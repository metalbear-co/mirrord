# Guards the scripts behind `flaky-test-report.yaml`, which files a Linear issue for every test
# nextest had to retry on `main` and comments every sighting on it.
#
# These fixtures are offline — pure stdlib, with `gh` and `curl` faked on $PATH — so no toolchain setup and
# no network are needed here.

name: Check Flaky Report

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string

permissions:
  contents: read

jobs:
  flaky-report:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Flaky test report regression tests
        run: python3 .github/scripts/test_flaky_report.py
