name: Auto Release PR

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PINNED_NIGHTLY: nightly-2026-08-13

jobs:
  create_release_pr:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      # Runs before the rest of the setup so that a run with nothing to release costs a
      # checkout and nothing more.
      #
      # Deliberately not comparing against `tags/${current_version}`: that tag is only created by
      # the `release_gh` job, so a single failed release would wedge this workflow until someone
      # tagged by hand. Unreleased fragments are the source of truth instead.
      - name: Determine and apply next release version
        id: version
        uses: ./.github/actions/next-release-version

      - name: Install Python
        if: steps.version.outputs.should-release == 'true'
        run: uv python install

      - name: Create virtual environment
        if: steps.version.outputs.should-release == 'true'
        run: uv venv

      - name: Install towncrier
        if: steps.version.outputs.should-release == 'true'
        run: uv pip install towncrier==23.11.0

      - if: steps.version.outputs.should-release == 'true'
        run: rm rust-toolchain.toml
      - if: steps.version.outputs.should-release == 'true'
        uses: metalbear-co/setup-rust-toolchain@a8d42d5aa259519dac1faeee20e37c1fb43453a3
        with:
          cache: false
          toolchain: ${{ env.PINNED_NIGHTLY }}
          rustflags: ""
      - name: Rust cache
        if: steps.version.outputs.should-release == 'true'
        uses: metalbear-co/rust-cache@d49d62d59c5755dd81754c833186b84a82f895fe # v2.9.1+1
        with:
          shared-key: mirrord

      - name: Update Cargo.lock
        if: steps.version.outputs.should-release == 'true'
        run: cargo update -w -q

      - name: Generate draft release notes
        if: steps.version.outputs.should-release == 'true'
        run: uv run towncrier build --draft --version "${{ steps.version.outputs.new-version }}" > /tmp/release-notes.md

      - name: Generate changelog
        if: steps.version.outputs.should-release == 'true'
        run: uv run towncrier build --yes --version "${{ steps.version.outputs.new-version }}"

      - name: Create or update release pull request
        if: steps.version.outputs.should-release == 'true'
        uses: ./.github/actions/create-release-pr
        with:
          version: ${{ steps.version.outputs.new-version }}
          release-notes-file: /tmp/release-notes.md
          app-id: ${{ secrets.CUBBY_CLIENT_ID }}
          private-key: ${{ secrets.CUBBY_PRIVATE_KEY }}
          paths: |
            Cargo.toml
            Cargo.lock
            changelog.d
            CHANGELOG.md
