name: Test E2E

on:
  workflow_call:

permissions:
  contents: read

env:
  MIRRORD_TELEMETRY: false

jobs:
  # Builds what the `e2e` jobs run, so that they take it from the remote cache rather than each
  # build it again.
  build:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bazel

      - name: Build the E2E tests
        run: |
          bazel build --remote_download_outputs=minimal //mirrord/cli //tests:e2e \
            //tests:e2e_operator_install //tests:e2e_ipv6

  e2e:
    needs: [build]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kind
            runtime: kind
            targets: //tests:e2e //tests:e2e_operator_install

          - name: minikube
            runtime: minikube
            targets: //tests:e2e

          - name: ipv6
            runtime: kind
            targets: //tests:e2e_ipv6

    name: e2e (${{ matrix.name }})
    env:
      MIRRORD_AGENT_RUST_LOG: "warn,mirrord=debug"
    steps:
      - name: Free disk space
        uses: metalbear-co/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      # `tool-cache: true` deletes /opt/hostedtoolcache, which the later setup actions install into.
      - name: Recreate the tool cache directory
        run: sudo mkdir -p /opt/hostedtoolcache && sudo chown "$(id -u):$(id -g)" /opt/hostedtoolcache

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bazel

      # Every Bazel command of the job gets the runtime from the user's bazelrc, because a command
      # with another runtime would discard Bazel's analysis cache.
      - name: Set the cluster runtime
        run: echo "common --//tests:cluster_runtime=${{ matrix.runtime }}" >> ~/.bazelrc

      - name: Enable IPv6 forwarding for the kind cluster
        if: ${{ matrix.name == 'ipv6' }}
        run: sudo sysctl -w net.ipv6.conf.all.forwarding=1

      # The smoke test uses no cluster, so only one of the jobs runs it.
      - name: Smoke-test mirrord wizard (alias to mirrord ui)
        if: ${{ matrix.name == 'kind' }}
        run: |
          bazel run //mirrord/cli -- wizard --no-browser
          curl -sf localhost:59281/health
          bazel run //mirrord/cli -- ui stop || true

      # The tests create their clusters with the kind or minikube that Bazel downloads.
      - name: Run the E2E tests
        run: bazel test --test_env=MIRRORD_AGENT_RUST_LOG ${{ matrix.targets }}

      # `ci-success` in `ci.yaml` merges these reports into the `nextest-junit` artifact, which
      # `flaky-test-report.yaml` reads.
      - name: Upload the test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nextest-junit-${{ github.job }}-${{ matrix.name }}
          path: bazel-testlogs/**/test.xml
          if-no-files-found: ignore
          # Only `main`'s reports feed the flaky test report.
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 2 }}

      # A failed end-to-end target keeps the logs of mirrord's intproxy and extproxy in its outputs.
      - name: Upload the proxy logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proxy-logs-${{ github.job }}-${{ matrix.name }}
          path: bazel-testlogs/tests/**/test.outputs/**
          if-no-files-found: ignore

      # Collects the logs of every cluster that the tests created, with the kind, minikube and
      # kubectl that Bazel downloads.
      - name: Collect logs
        if: ${{ failure() }}
        run: |
          kind() { bazel run @multitool//tools/kind -- "$@"; }
          kubectl() { bazel run @multitool//tools/kubectl -- --kubeconfig "$RUNNER_TEMP/kubeconfig" "$@"; }
          if [ "${{ matrix.runtime }}" = minikube ]; then
            # `minikube update-context` writes the cluster into the kubeconfig in `KUBECONFIG`.
            KUBECONFIG="$RUNNER_TEMP/kubeconfig" bazel run @multitool//tools/minikube -- update-context --profile mirrord-e2e
            kubectl get all
            kubectl describe pods
            docker exec mirrord-e2e find /var/log/pods -print -exec cat {} \;
          else
            for cluster in $(kind get clusters); do
              kind get kubeconfig --name "$cluster" > "$RUNNER_TEMP/kubeconfig"
              kubectl get all
              kubectl describe pods
              kind export logs "/tmp/kind-logs/$cluster" --name "$cluster"
            done
            find /tmp/kind-logs -type f -print -exec cat {} \;
          fi
