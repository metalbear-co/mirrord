name: Test E2E

# Runs the end-to-end tests as a developer does (see `mirrord/tests/BUILD.bazel`): `e2e_setup`
# creates a cluster and loads the agent that Bazel builds into it, and `bazel test` runs the tests
# against it. Each cluster gets its own job: a kind cluster, a minikube cluster, and an IPv6-only
# kind cluster for the IPv6 tests.
on:
  workflow_call:

permissions:
  contents: read

env:
  MIRRORD_TELEMETRY: false

jobs:
  e2e:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kind
            runtime: kind
            targets: //mirrord/tests:e2e //mirrord/tests:e2e_dirty_iptables
          # minikube gets most of the runner, as its nodes run inside one container.
          - name: minikube
            runtime: minikube
            create_args: --cpus max --memory 12gb --disk-size 40g
            targets: //mirrord/tests:e2e //mirrord/tests:e2e_dirty_iptables
          # IPv6 is enabled by default, so sessions against IPv6-only clusters must work with no
          # extra config. The tests need a cluster of their own.
          - name: ipv6
            runtime: kind
            create_args: --config mirrord/tests/kind-cluster-ipv6-config.yaml
            targets: //mirrord/tests:e2e_ipv6
    name: e2e (${{ matrix.name }})
    env:
      MIRRORD_AGENT_RUST_LOG: "warn,mirrord=debug"
      # The kubeconfig that `e2e_setup` keeps for the cluster.
      KUBECONFIG: ${{ github.workspace }}/mirrord/tests/clusters/${{ matrix.runtime }}/mirrord-e2e
    steps:
      - name: Free disk space
        uses: metalbear-co/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      # `tool-cache: true` removes /opt/hostedtoolcache, where setup actions install their tools.
      - name: Recreate the tool cache directory
        run: sudo mkdir -p /opt/hostedtoolcache && sudo chown "$(id -u):$(id -g)" /opt/hostedtoolcache

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The runner has Docker and kubectl, which `e2e_setup` needs too.
      - name: Install ${{ matrix.runtime }}
        run: |
          cd "$RUNNER_TEMP"
          if [ "${{ matrix.runtime }}" = kind ]; then
            curl -sSfLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
            echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d kind' | sha256sum -c
            sudo install kind /usr/local/bin/kind
          else
            curl -sSfLo minikube https://storage.googleapis.com/minikube/releases/v1.38.1/minikube-linux-amd64
            echo '099477eaf248bcb5bcea8ce78a2898e93ac01461c35189da1848c3de82ecd22e minikube' | sha256sum -c
            sudo install minikube /usr/local/bin/minikube
          fi

      - uses: ./.github/actions/setup-bazel

      - name: Enable IPv6 forwarding for the kind cluster
        if: ${{ matrix.name == 'ipv6' }}
        run: sudo sysctl -w net.ipv6.conf.all.forwarding=1

      # Creating the cluster takes minutes, and so does the build, so they run at the same time.
      # `e2e_cluster` is the part of `e2e_setup` that doesn't need the agent. `bazel run` would
      # hold Bazel's lock until it has built the program, so a build that started next to it could
      # get the lock first and make it wait. `--script_path` writes a script that runs the program
      # without Bazel instead. The build is everything that the later steps run.
      - name: Create the cluster while Bazel builds
        run: |
          bazel run --script_path="$RUNNER_TEMP/e2e_cluster" //mirrord/tests:e2e_cluster
          "$RUNNER_TEMP/e2e_cluster" --runtime ${{ matrix.runtime }} -- ${{ matrix.create_args }} &
          bazel build //mirrord/cli //mirrord/tests:e2e_setup ${{ matrix.targets }}
          wait $!

      - name: Load the agent into the cluster
        run: bazel run //mirrord/tests:e2e_setup -- --runtime ${{ matrix.runtime }}

      - name: Smoke-test mirrord wizard (alias to mirrord ui)
        if: ${{ matrix.name != 'ipv6' }}
        run: |
          bazel run //mirrord/cli -- wizard --no-browser
          curl -sf localhost:59281/health
          bazel run //mirrord/cli -- ui stop || true

      - name: Run the E2E tests
        run: |
          bazel test --test_env=KUBECONFIG --test_env=MIRRORD_AGENT_RUST_LOG ${{ matrix.targets }}

      # Runs after the other tests, which would use the operator that these tests install.
      - name: Run the operator install E2E tests
        if: ${{ !cancelled() && matrix.name == 'kind' }}
        run: bazel test --test_env=KUBECONFIG //mirrord/tests:e2e_operator_install

      # `ci-success` merges the reports into the `nextest-junit` artifact that
      # `flaky-test-report.yaml` reads.
      - name: Upload the test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nextest-junit-${{ github.job }}-${{ matrix.name }}
          path: bazel-testlogs/**/test.xml
          if-no-files-found: ignore
          # Only `main`'s reports feed the flaky test report.
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 2 }}

      - name: Collect logs
        if: ${{ failure() }}
        run: |
          kubectl get all
          kubectl describe pods
          if [ "${{ matrix.runtime }}" = minikube ]; then
            docker exec mirrord-e2e find /var/log/pods -print -exec cat {} \;
          else
            kind export logs /tmp/kind-logs --name mirrord-e2e
            find /tmp/kind-logs -type f -print -exec cat {} \;
          fi
