name: Test E2E

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label to use. Callers pass the one `plan` picked."
        required: false
        type: string
        default: "ubuntu-24.04"
      runner_image_built:
        description: "Whether the runner image comes from an uploaded artifact rather than the published one."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # `download image` polls the run's artifacts via `gh run download` while the
  # agent image build may still be in flight, which needs the actions read scope.
  actions: read
  packages: read

env:
  MIRRORD_TELEMETRY: false
  KIND_CLUSTER_NAME: mirrord-e2e

jobs:
  e2e:
    runs-on: ${{ inputs.runner }}
    strategy:
      matrix:
        include:
          - container-runtime: docker
            cluster-runtime: kind
          - container-runtime: containerd
            cluster-runtime: minikube
    name: e2e (${{ matrix.container-runtime }}/${{ matrix.cluster-runtime }})
    env:
      MIRRORD_AGENT_RUST_LOG: "warn,mirrord=debug"
    steps:
      - name: Free disk space
        uses: metalbear-co/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      # `tool-cache: true` removes /opt/hostedtoolcache; the cluster setup restores tools into it.
      - name: Recreate the tool cache directory
        run: sudo mkdir -p /opt/hostedtoolcache && sudo chown "$(id -u):$(id -g)" /opt/hostedtoolcache
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/e2e-setup
        with:
          container-runtime: ${{ matrix.container-runtime }}
          cluster-runtime: ${{ matrix.cluster-runtime }}
          kind-cluster-name: ${{ env.KIND_CLUSTER_NAME }}
      - name: Rust cache
        uses: metalbear-co/rust-cache@d49d62d59c5755dd81754c833186b84a82f895fe # v2.9.1+1
        with:
          shared-key: e2e
          save-if: ${{ matrix.cluster-runtime == 'kind' }}
      - uses: ./.github/actions/provide-ci-runner
        with:
          built: ${{ inputs.runner_image_built }}
      - name: Build the mirrord CLI
        uses: ./.github/actions/run-in-ci-runner
        with:
          command: cargo xtask build-cli
      # The agent image is built by a sibling job that runs concurrently with this one
      # (e2e no longer `needs` it), so the `test` artifact may not exist yet when we get
      # here. Poll for it until it's ready, giving the build up to 8 minutes to finish.
      # If the build job finishes without producing the artifact it has failed (a success
      # would have uploaded it), so bail out immediately instead of waiting out the timeout.
      - name: download image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deadline=$((SECONDS + 900))
          until gh run download "$GITHUB_RUN_ID" --name test --dir /tmp; do
            build_state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
              --jq '.jobs[] | select(.name | endswith("build-agent-image")) | .status' | head -n1)
            if [ "$build_state" = "completed" ]; then
              echo "::error::Agent image build finished without producing the image artifact; failing fast"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out after 15 minutes waiting for the agent image artifact"
              exit 1
            fi
            echo "Agent image artifact not ready yet, retrying in 15s..."
            sleep 15
          done
      - name: Load test image into minikube
        if: ${{ matrix.cluster-runtime == 'minikube' }}
        run: minikube image load /tmp/test.tar && rm /tmp/test.tar
      - name: Load test image into kind
        if: ${{ matrix.cluster-runtime == 'kind' }}
        run: kind load image-archive /tmp/test.tar --name "$KIND_CLUSTER_NAME" && rm /tmp/test.tar
      - name: Run cli E2E tests
        if: ${{ matrix.container-runtime == 'docker' }}
        uses: ./.github/actions/run-in-ci-runner
        with:
          artifact-key: test-e2e-cli-${{ matrix.container-runtime }}-${{ matrix.cluster-runtime }}
          capture-nextest-failures: true
          test-group: e2e
          command: cargo xtask test-e2e --binary target/x86_64-unknown-linux-gnu/debug/mirrord --layer target/x86_64-unknown-linux-gnu/debug/libmirrord_layer.so -- --profile ci --cargo-quiet --target=x86_64-unknown-linux-gnu --no-default-features --features cli --test-threads=6
      - name: Smoke-test mirrord wizard (alias to mirrord ui)
        uses: ./.github/actions/run-in-ci-runner
        with:
          command: >-
            ./target/x86_64-unknown-linux-gnu/debug/mirrord wizard --no-browser &&
            curl -sf localhost:59281/health &&
            (./target/x86_64-unknown-linux-gnu/debug/mirrord ui stop || true)
      - name: Run targetless E2E test
        uses: ./.github/actions/run-in-ci-runner
        with:
          artifact-key: test-e2e-targetless-${{ matrix.container-runtime }}-${{ matrix.cluster-runtime }}
          capture-nextest-failures: true
          test-group: e2e
          command: cargo xtask test-e2e --binary target/x86_64-unknown-linux-gnu/debug/mirrord --layer target/x86_64-unknown-linux-gnu/debug/libmirrord_layer.so -- --profile ci --cargo-quiet --target=x86_64-unknown-linux-gnu --no-default-features --features targetless --test-threads=6 -- targetless
      - name: Deploy ArgoCD Rollouts
        run: |
          kubectl create namespace argo-rollouts
          kubectl apply -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/download/v1.9.1/install.yaml
      - name: Run job E2E tests
        uses: ./.github/actions/run-in-ci-runner
        with:
          artifact-key: test-e2e-job-${{ matrix.container-runtime }}-${{ matrix.cluster-runtime }}
          capture-nextest-failures: true
          test-group: e2e
          command: cargo xtask test-e2e --binary target/x86_64-unknown-linux-gnu/debug/mirrord --layer target/x86_64-unknown-linux-gnu/debug/libmirrord_layer.so -- --profile ci --cargo-quiet --target=x86_64-unknown-linux-gnu --no-default-features --features job --test-threads=6
      - name: Run ephemeral-agent E2E tests
        uses: ./.github/actions/run-in-ci-runner
        with:
          artifact-key: test-e2e-ephemeral-${{ matrix.container-runtime }}-${{ matrix.cluster-runtime }}
          capture-nextest-failures: true
          test-group: e2e
          command: cargo xtask test-e2e --binary target/x86_64-unknown-linux-gnu/debug/mirrord --layer target/x86_64-unknown-linux-gnu/debug/libmirrord_layer.so -- --profile ci --cargo-quiet --target=x86_64-unknown-linux-gnu --no-default-features --features ephemeral --test-threads=6
      - name: Collect logs
        if: ${{ failure() }}
        run: |
          find /tmp -type f -name 'mirrord-intproxy-*' -print -exec cat {} \;
          kubectl get all
          kubectl describe pods
          if [[ "${{ matrix.cluster-runtime }}" == "minikube" ]]; then
            docker exec minikube find /var/log/pods -print -exec cat {} \;
          else
            kind export logs /tmp/kind-logs --name "$KIND_CLUSTER_NAME"
            find /tmp/kind-logs -type f -print -exec cat {} \;
          fi

  # IPv6 is enabled by default, so sessions against IPv6-only clusters must work with no
  # extra config. This job runs the IPv6-cluster tests (ignored in the regular e2e run) on
  # a single-stack IPv6 kind cluster. `outgoing_traffic_single_request_ipv6_enabled` stays
  # out - it needs IPv6 internet egress, which kind on a runner does not have.
  e2e-ipv6:
    runs-on: ${{ inputs.runner }}
    name: e2e (ipv6 kind cluster)
    env:
      MIRRORD_AGENT_RUST_LOG: "warn,mirrord=debug"
    steps:
      - name: Free disk space
        uses: metalbear-co/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      # `tool-cache: true` removes /opt/hostedtoolcache; the cluster setup restores tools into it.
      - name: Recreate the tool cache directory
        run: sudo mkdir -p /opt/hostedtoolcache && sudo chown "$(id -u):$(id -g)" /opt/hostedtoolcache
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enable IPv6 forwarding for the kind cluster
        run: sudo sysctl -w net.ipv6.conf.all.forwarding=1
      - uses: ./.github/actions/e2e-setup
        with:
          container-runtime: docker
          cluster-runtime: kind
          kind-cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          kind-cluster-config: tests/kind-cluster-ipv6-config.yaml
      - name: Rust cache
        uses: metalbear-co/rust-cache@d49d62d59c5755dd81754c833186b84a82f895fe # v2.9.1+1
        with:
          shared-key: e2e
          save-if: "false"
      - uses: ./.github/actions/provide-ci-runner
        with:
          built: ${{ inputs.runner_image_built }}
      - name: Build the mirrord CLI
        uses: ./.github/actions/run-in-ci-runner
        with:
          command: cargo xtask build-cli
      # Same artifact-polling dance as the main e2e job - the agent image is built by a
      # sibling job running concurrently with this one.
      - name: download image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deadline=$((SECONDS + 900))
          until gh run download "$GITHUB_RUN_ID" --name test --dir /tmp; do
            build_state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
              --jq '.jobs[] | select(.name | endswith("build-agent-image")) | .status' | head -n1)
            if [ "$build_state" = "completed" ]; then
              echo "::error::Agent image build finished without producing the image artifact; failing fast"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out after 15 minutes waiting for the agent image artifact"
              exit 1
            fi
            echo "Agent image artifact not ready yet, retrying in 15s..."
            sleep 15
          done
      - name: Load test image into kind
        run: kind load image-archive /tmp/test.tar --name "$KIND_CLUSTER_NAME" && rm /tmp/test.tar
      - name: Run IPv6 E2E tests
        uses: ./.github/actions/run-in-ci-runner
        with:
          artifact-key: test-e2e-ipv6-kind
          capture-nextest-failures: true
          test-group: e2e
          command: >-
            cargo xtask test-e2e --binary target/x86_64-unknown-linux-gnu/debug/mirrord --layer target/x86_64-unknown-linux-gnu/debug/libmirrord_layer.so -- --profile ci --cargo-quiet --target=x86_64-unknown-linux-gnu --no-default-features --features ipv6 --test-threads=1 -E 'test(ipv6)'
      - name: Collect logs
        if: ${{ failure() }}
        run: |
          find /tmp -type f -name 'mirrord-intproxy-*' -print -exec cat {} \;
          kubectl get all
          kubectl describe pods
          kind export logs /tmp/kind-logs --name "$KIND_CLUSTER_NAME"
          find /tmp/kind-logs -type f -print -exec cat {} \;
