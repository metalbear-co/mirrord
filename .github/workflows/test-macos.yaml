name: Test macOS

on:
  workflow_call:
    inputs:
      rust_toolchain:
        required: true
        type: string

permissions:
  contents: read

env:
  # Some crates have no tests on some platforms; nextest treats that as an error by default.
  NEXTEST_NO_TESTS: warn
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  MIRRORD_TELEMETRY: false

jobs:
  macos-tests:
    runs-on: macos-latest
    env:
      MIRRORD_LAYER_FILE: ${{ github.workspace }}/target/universal-apple-darwin/debug/libmirrord_layer.dylib
      MIRRORD_LAYER_FILE_MACOS_ARM64: ${{ github.workspace }}/target/aarch64-apple-darwin/debug/libmirrord_layer.dylib
      MIRRORD_TESTS_USE_BINARY: ${{ github.workspace }}/target/universal-apple-darwin/debug/mirrord
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Routes this job's downloads through a local caching proxy backed by the Actions cache.
      # Never fatal: if it does not start, the job just downloads the way it did before.
      - name: Start HTTP cache proxy
        continue-on-error: true
        if: ${{ runner.os != 'Windows' }}
        uses: aviramha/cicache@41c6b73e1200efc1eb4c6cfa641986ba12f354e8 # v0.2.1
        with:
          # Only genuinely large artifacts. The cache service is rate limited per job, so the
          # floor has to keep the number of stored objects in the tens rather than the thousands;
          # it also leaves more of the repository's cache budget to the Rust caches.
          min-size: "4194304"
      # frida's build script fetches its devkit with a TLS stack carrying its own root store, so
      # it ignores SSL_CERT_FILE and cannot be talked through an intercepting proxy over HTTPS.
      # Requesting the same artifact over plain HTTP keeps that hop on localhost; the proxy then
      # fetches it over HTTPS upstream and caches it. Harmless without a proxy, where GitHub just
      # redirects back to HTTPS.
      - name: Fetch the frida devkit through the cache proxy
        if: ${{ runner.os != 'Windows' }}
        run: echo "FRIDA_DOWNLOAD_CDN=http://github.com/frida/frida/releases/download" >> "$GITHUB_ENV"
      - run: rm rust-toolchain.toml
      - uses: metalbear-co/setup-rust-toolchain@a8d42d5aa259519dac1faeee20e37c1fb43453a3
        with:
          cache: false
          components: rustfmt, clippy
          target: x86_64-apple-darwin, aarch64-apple-darwin
          toolchain: ${{ inputs.rust_toolchain }}
      - name: Rust cache
        uses: metalbear-co/rust-cache@d49d62d59c5755dd81754c833186b84a82f895fe # v2.9.1+1
        with:
          shared-key: mirrord
      - name: Install Protoc
        uses: metalbear-co/setup-protoc@770e54d44679c8e1d8fdc06d1d9268fa79fbefb4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Enable corepack (pnpm-only; leave npm alone for wizard build)
        run: corepack enable pnpm
      - name: verify SIP status
        run: csrutil status
      - name: build cli and universal layer
        run: cargo xtask build-cli --platform macos-universal --no-ui
      - uses: metalbear-co/install-action@c127aaa0fa8c555cbfb72bfa29b29a692d25d267 # v2.75.16
        with:
          tool: cargo-nextest
      - name: mirrord-sip UT
        run: cargo nextest run -p mirrord-sip
      - name: mirrord-intproxy UT
        run: cargo nextest run -p mirrord-intproxy
      - run: |
          cd mirrord/layer-tests/tests/apps/issue1123
          rustc issue1123.rs --out-dir target
      - run: |
          cd mirrord/layer-tests/tests/apps/issue1054
          rustc issue1054.rs --out-dir target
      - run: |
          cd mirrord/layer-tests/tests/apps/issue1458
          rustc issue1458.rs --out-dir target
      - run: |
          cd mirrord/layer-tests/tests/apps/issue1458portnot53
          rustc issue1458portnot53.rs --out-dir target
      - run: |
          cd mirrord/layer-tests/tests/apps/issue2058
          rustc issue2058.rs --out-dir target
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.24"
          cache: false
      - run: |
          go version
      - run: |
          cd mirrord/layer-tests/tests
          ../../../scripts/build_go_apps.sh 24
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.25"
          cache: false
      - run: |
          go version
      - run: |
          cd mirrord/layer-tests/tests
          ../../../scripts/build_go_apps.sh 25
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26"
          cache: false
      - run: |
          go version
      - run: |
          cd mirrord/layer-tests/tests
          ../../../scripts/build_go_apps.sh 26
      - run: |
          cd mirrord/layer-tests/tests/apps/fileops
          cargo build
      - run: |
          cd mirrord/layer-tests/tests/apps/outgoing
          cargo build
      - run: |
          cd mirrord/layer-tests/tests/apps/recv_from
          cargo build
      - run: |
          cd mirrord/layer-tests/tests/apps/dns_resolve
          cargo build
      - run: |
          cd mirrord/layer-tests/tests/apps/issue1776
          cargo build
      - run: |
          cd mirrord/layer-tests/tests/apps/issue1776portnot53
          cargo build
      - run: |
          cd mirrord/layer-tests/tests/apps/issue1899
          cargo build
      - run: |
          cd mirrord/layer-tests/tests/apps/issue2001
          cargo build
      - run: |
          cd mirrord/layer-tests/tests/apps/issue2438
          cargo build
      - run: |
          cd mirrord/layer-tests/tests/apps/issue3248
          cargo build
      - run: |
          cd mirrord/layer-tests/tests/apps/rebind0
          cargo build
      - run: |
          cd mirrord/layer-tests/tests/apps/dup_listen
          cargo build
      - run: |
          cd mirrord/layer-tests/tests/apps/double_listen
          cargo build
      - run: ./scripts/build_c_apps.sh
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
      - name: Display Pip version
        run: pip --version
      - run: python3 -m pip install flask fastapi uvicorn[standard]
      - run: pnpm --filter mirrord-frontends install --frozen-lockfile
      - uses: metalbear-co/install-action@c127aaa0fa8c555cbfb72bfa29b29a692d25d267 # v2.75.16
        with:
          tool: cargo-nextest
      - name: mirrord layer integration tests
        run: cargo nextest run -p mirrord-layer-tests --no-default-features
      - name: mirrord layer unit tests
        run: cargo nextest run -p mirrord-layer
      - name: save intproxy logs
        continue-on-error: true
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intproxy_logs_macos
          path: /tmp/intproxy_logs/macos
          retention-days: 2
      # Drains the upload queue and prints the hit rate. Has to run even when the job fails, or
      # nothing is stored for later runs.
      - name: Stop HTTP cache proxy
        continue-on-error: true
        if: ${{ always() && runner.os != 'Windows' }}
        uses: aviramha/cicache/cleanup@41c6b73e1200efc1eb4c6cfa641986ba12f354e8 # v0.2.1
