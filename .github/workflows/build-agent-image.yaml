name: Build Agent Image

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label to use. Callers pass the one `plan` picked."
        required: false
        type: string
        default: "ubuntu-24.04"

permissions:
  contents: read
  packages: write

jobs:
  build-agent-image:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # bake-action exposes the cache runtime to BuildKit, so the cache declared in
      # ci/docker-bake.hcl actually imports/exports. A plain `run: docker buildx bake` can't, so
      # the cache was silently a no-op and every run rebuilt the agent image from scratch.
      - name: build and export
        uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584 # v7.2.0
        env:
          PLATFORMS: "linux/amd64"
          AGENT_TAGS: "test"
          PRODUCT_CACHE_FROM: type=registry,ref=ghcr.io/metalbear-co/mirrord:buildcache-agent
          PRODUCT_CACHE_TO: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'type=registry,ref=ghcr.io/metalbear-co/mirrord:buildcache-agent,mode=max,ignore-error=true' || '' }}
        with:
          files: ci/docker-bake.hcl
          targets: agent
          set: |
            agent.output=type=docker,dest=${{ github.workspace }}/test.tar
      - name: upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test
          path: ${{ github.workspace }}/test.tar
          retention-days: 2
