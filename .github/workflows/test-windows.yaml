name: Test Windows

on:
  workflow_call:
    inputs:
      rust_toolchain:
        required: true
        type: string

permissions:
  contents: read

env:
  # Some crates have no tests on some platforms; nextest treats that as an error by default.
  NEXTEST_NO_TESTS: warn
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  MIRRORD_TELEMETRY: false

jobs:
  windows-tests:
    runs-on: windows-latest
    env:
      MIRRORD_TESTS_USE_BINARY: ${{ github.workspace }}/target/debug/mirrord.exe
      MIRRORD_LAYER_FILE: ${{ github.workspace }}/target/debug/mirrord_layer_win.dll
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: Remove-Item rust-toolchain.toml
      - uses: metalbear-co/setup-rust-toolchain@a8d42d5aa259519dac1faeee20e37c1fb43453a3
        with:
          cache: false
          components: rustfmt, clippy
          target: x86_64-pc-windows-msvc
          toolchain: ${{ inputs.rust_toolchain }}
          rustflags: ""
      - name: Rust cache
        uses: metalbear-co/rust-cache@d49d62d59c5755dd81754c833186b84a82f895fe # v2.9.1+1
        with:
          shared-key: mirrord
      - run: |
          cd mirrord/layer-tests/tests/apps/issue1123
          rustc issue1123.rs --out-dir target
      - run: |
          cd mirrord/layer-tests/tests/apps/outgoing
          cargo build
      - run: |
          cd mirrord/layer-tests/tests/apps/dns_resolve
          cargo build
      - run: |
          cd mirrord/layer-tests/tests/apps/rebind0
          cargo build
      - run: |
          cd mirrord/layer-tests/tests/apps/issue2058
          rustc issue2058.rs --out-dir target
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: npm install express
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      - run: python -m pip install --break-system-packages flask fastapi uvicorn[standard]
      # Caching the module downloads costs more on this runner than it saves: the restore and save
      # together run about three minutes, and the builds that follow are no faster than the two
      # uncached Go versions below.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.25"
          cache: false
      - run: |
          go version
      - run: |
          . ./scripts/win_build_test_apps_utils.ps1
          Build-RepoGoApps -RepoRoot (Join-Path $pwd "mirrord/layer-tests/tests") -OutputPrefix "25"
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26"
          cache: false
      - run: |
          go version
      - run: |
          . ./scripts/win_build_test_apps_utils.ps1
          Build-RepoGoApps -RepoRoot (Join-Path $pwd "mirrord/layer-tests/tests") -OutputPrefix "26"
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.27"
          cache: false
      - run: |
          go version
      - run: |
          . ./scripts/win_build_test_apps_utils.ps1
          Build-RepoGoApps -RepoRoot (Join-Path $pwd "mirrord/layer-tests/tests") -OutputPrefix "27"
      - name: build layer
        run: cargo build -p mirrord-layer-win
      - name: build mirrord
        run: cargo build -p mirrord
      - uses: metalbear-co/install-action@c127aaa0fa8c555cbfb72bfa29b29a692d25d267 # v2.75.16
        with:
          tool: cargo-nextest
      - name: mirrord layer integration tests
        run: |
          $ErrorActionPreference = "Stop"
          cargo nextest run --profile ci --cargo-quiet -p mirrord-layer-tests --no-default-features
      - name: Collect mirrord layer integration test results
        if: ${{ always() }}
        uses: ./.github/actions/collect-nextest-results
        with:
          artifact-key: test-windows-mirrord-layer-tests
          capture-nextest-failures: true
          test-group: integration
      - name: run UT
        run: |
          $ErrorActionPreference = "Stop"
          cargo nextest run --profile ci --cargo-quiet -p mirrord -p mirrord-layer-win
      - name: Collect mirrord and mirrord-layer-win UT results
        if: ${{ always() }}
        uses: ./.github/actions/collect-nextest-results
        with:
          artifact-key: test-windows-mirrord-and-layer-win
          capture-nextest-failures: true
          test-group: ut
      - name: mirrord intproxy UT
        run: |
          $ErrorActionPreference = "Stop"
          cargo nextest run --profile ci --cargo-quiet -p mirrord-intproxy
      - name: Collect mirrord intproxy UT results
        if: ${{ always() }}
        uses: ./.github/actions/collect-nextest-results
        with:
          artifact-key: test-windows-mirrord-intproxy
          capture-nextest-failures: true
          test-group: ut
