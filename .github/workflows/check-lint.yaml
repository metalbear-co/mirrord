name: Check Lint

on:
  workflow_call:
    inputs:
      run_markdown:
        required: true
        type: boolean
      run_rust:
        required: true
        type: boolean
      run_vale:
        required: true
        type: boolean
      run_wizard_frontend:
        required: true
        type: boolean
      run_ui_frontend:
        required: true
        type: boolean
      rust_toolchain:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  typos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: install typos
        uses: metalbear-co/install-action@c127aaa0fa8c555cbfb72bfa29b29a692d25d267
        with:
          tool: typos-cli
      - name: print typos version
        run: echo $(typos --version)
      - name: list markdown files
        run: echo $(git ls-files '*.md')
      - name: spell check markdown files
        run: typos --format brief $(git ls-files '*.md')
      - name: spell check mirrord/config crate
        run: typos --format brief $(git ls-files 'mirrord/config/*.rs')
  lint-markdown:
    if: ${{ inputs.run_markdown }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: metalbear-co/markdownlint-cli2-action@4db3dfc2cb719a5a152cb38efef6e2e50db98973
        with:
          config: '.markdownlint.json'
          globs: 'README.md'
  wizard-frontend-lint:
    if: ${{ inputs.run_wizard_frontend }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm --filter mirrord-wizard install --frozen-lockfile
      - run: pnpm --filter mirrord-wizard run lint
      - run: pnpm --filter mirrord-wizard run format:check
      - run: pnpm --filter mirrord-wizard run typecheck
  wizard-frontend-test:
    if: ${{ inputs.run_wizard_frontend }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm --filter mirrord-wizard install --frozen-lockfile
      - run: pnpm --filter mirrord-wizard run test:run
  ui-frontend-lint:
    if: ${{ inputs.run_ui_frontend }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter session-monitor-frontend run lint
      - run: pnpm --filter session-monitor-frontend run format:check
      - run: pnpm --filter session-monitor-frontend run typecheck
      - run: pnpm --filter mirrord-ui run lint
      - run: pnpm --filter mirrord-ui run format:check
      - run: pnpm --filter mirrord-ui run typecheck
      - run: pnpm --filter mirrord-ui run build
  vale:
    if: ${{ inputs.run_vale }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install vale
        run: |
          wget "https://github.com/errata-ai/vale/releases/download/v3.13.1/vale_3.13.1_Linux_64-bit.tar.gz" -O /tmp/vale.tgz
          echo '99bd899f0ac52054444ffe3df571c749cc811f3b606cf5ef740c9a5a2db33df6 /tmp/vale.tgz' | sha256sum -c
          mkdir -p /tmp/vale
          tar -xzf /tmp/vale.tgz -C /tmp/vale
          chmod +x /tmp/vale/vale
          mv /tmp/vale/vale /usr/local/bin
      - name: check root markdown files
        run: vale $(find . -maxdepth 1 -name '*.md' -not -name CLAUDE.md -not -name CHANGELOG.md) --output=report.tmpl
      - name: check changelog.d files
        run: vale $(git ls-files 'changelog.d/*.md') --output=report.tmpl
  cargo-lint:
    if: ${{ inputs.run_rust }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: rm rust-toolchain.toml
      - uses: metalbear-co/setup-rust-toolchain@a8d42d5aa259519dac1faeee20e37c1fb43453a3
        with:
          cache: false
          toolchain: ${{ inputs.rust_toolchain }}
          components: rustfmt, clippy
          target: ${{ matrix.target }}
      - name: Rust cache
        uses: metalbear-co/rust-cache@d49d62d59c5755dd81754c833186b84a82f895fe # v2.9.1+1
        with:
          shared-key: mirrord
      - uses: metalbear-co/setup-protoc@770e54d44679c8e1d8fdc06d1d9268fa79fbefb4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo clippy
        id: cargo_clippy
        continue-on-error: true
        run: cargo clippy ${{ contains(matrix.target, 'linux') && '--workspace' || '' }} --all-targets --all-features --target ${{ matrix.target }} --keep-going --quiet -- "-Wclippy::indexing_slicing" -D warnings
      - name: cargo fmt (run only on one platform)
        id: cargo_fmt
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: operator crd check (run only on one platform)
        id: operator_crd_check
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        continue-on-error: true
        run: cargo check -p mirrord-operator --features crd --target ${{ matrix.target }} --keep-going --quiet
      - name: check all lint steps passed
        if: ${{ !cancelled() && (steps.cargo_clippy.outcome == 'failure' || steps.cargo_fmt.outcome == 'failure' || steps.operator_crd_check.outcome == 'failure') }}
        run: |
          echo "One or more cargo lint checks failed."
          exit 1
  shear:
    if: ${{ inputs.run_rust }}
    name: 'cargo shear'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: corepack enable pnpm
      - uses: metalbear-co/setup-protoc@770e54d44679c8e1d8fdc06d1d9268fa79fbefb4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Install cargo shear'
        uses: metalbear-co/install-action@c127aaa0fa8c555cbfb72bfa29b29a692d25d267 # v2.75.16
        with:
          tool: cargo-shear@1.13.1
      - run: cargo shear --deny-warnings
  tui-standalone:
    if: ${{ inputs.run_rust }}
    name: 'mirrord-tui stands alone'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Rust cache
        uses: metalbear-co/rust-cache@d49d62d59c5755dd81754c833186b84a82f895fe # v2.9.1+1
        with:
          shared-key: mirrord
      # `mirrord` depends on `mirrord-tui`, and nothing may make that point the other way: the whole
      # reason the interface is its own crate is that working on it does not mean building the CLI,
      # the layer and the agent. Nothing else in CI notices if that stops being true - the workspace
      # would simply keep building, only slower.
      - name: the interface must not depend on the rest of mirrord
        run: |
          status=0
          for crate in mirrord mirrord-layer mirrord-agent mirrord-intproxy; do
            if cargo tree --quiet -p mirrord-tui -i "$crate" >/dev/null 2>&1; then
              echo "::error file=mirrord/tui/Cargo.toml::mirrord-tui depends on $crate; the dependency has to point the other way round."
              status=1
            fi
          done
          exit $status
      # And `cargo run` inside the crate has to keep selecting only the crate. That follows from the
      # root manifest being virtual - `default-members` applies there, not in a member directory -
      # so it is a property of the workspace layout that a future change could quietly take away.
      - name: cargo must select only the interface from its own directory
        run: |
          selected=$(cd mirrord/tui && cargo tree --depth 0 --prefix none --quiet |
            awk 'NF && $1 !~ /^\[/ {print $1}' | sort -u)
          if [ "$selected" != "mirrord-tui" ]; then
            echo "::error file=Cargo.toml::a bare cargo command in mirrord/tui selects [$(echo $selected)], not mirrord-tui alone."
            exit 1
          fi
  lint-success:
    if: '!cancelled()'
    needs:
      [
        typos,
        lint-markdown,
        wizard-frontend-lint,
        wizard-frontend-test,
        ui-frontend-lint,
        vale,
        cargo-lint,
        shear,
        tui-standalone
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Check all jobs passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')
          if [ -n "$failing" ]; then
            echo "$failing"
            exit 1
          fi
