name: Test Integration

on:
  workflow_call:
    inputs:
      runner_image_built:
        description: "Whether the runner image comes from an uploaded artifact rather than the published one."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

env:
  MIRRORD_TELEMETRY: false

jobs:
  integration-tests:
    runs-on: ubuntu-24.04
    env:
      MIRRORD_TESTS_USE_BINARY: /workspace/mirrord/target/x86_64-unknown-linux-gnu/debug/mirrord
      MIRRORD_LAYER_FILE: /workspace/mirrord/target/x86_64-unknown-linux-gnu/debug/libmirrord_layer.so
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Rust cache
        uses: metalbear-co/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: integration
      - uses: ./.github/actions/provide-ci-runner
        with:
          built: ${{ inputs.runner_image_built }}
      - name: build test apps
        uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            set -eux
            cd mirrord/layer-tests/tests/apps
            for app in issue1123 issue1054 issue1458 issue1458portnot53 issue2058 issue2204; do
              (cd "$app" && rustc "$app.rs" --out-dir target)
            done
            for app in fileops outgoing recv_from dns_resolve listen_ports issue1776 \
              issue1776portnot53 issue1899 issue2001 issue2438 issue3248 rebind0 dup_listen \
              double_listen; do
              (cd "$app" && cargo build)
            done
            ./dlopen_cgo/build_test_app.sh
            cd /workspace/mirrord
            pnpm --filter mirrord-frontends install --frozen-lockfile
            ./scripts/build_c_apps.sh
      - uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cargo build --target x86_64-unknown-linux-gnu -p mirrord-layer
      - uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cargo build --target x86_64-unknown-linux-gnu -p mirrord
      - uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cargo nextest run --target x86_64-unknown-linux-gnu -p mirrord-layer-lib --profile ci
      - uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cargo nextest run --target x86_64-unknown-linux-gnu -p mirrord-layer-tests --no-default-features --profile ci
      - uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cargo nextest run --target x86_64-unknown-linux-gnu -p mirrord-layer --profile ci
      - name: mirrord protocol UT
        uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cargo nextest run --target x86_64-unknown-linux-gnu -p mirrord-protocol --profile ci
      - name: mirrord config UT
        uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cargo nextest run --target x86_64-unknown-linux-gnu -p mirrord-config --profile ci
      - name: mirrord kube UT
        uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cargo nextest run --target x86_64-unknown-linux-gnu -p mirrord-kube --all-features --profile ci
      - name: mirrord intproxy UT
        uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cargo nextest run --target x86_64-unknown-linux-gnu -p mirrord-intproxy --profile ci
      - name: mirrord auth UT
        uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cargo nextest run --target x86_64-unknown-linux-gnu -p mirrord-auth --profile ci
      - name: mirrord operator UT
        uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cargo nextest run --target x86_64-unknown-linux-gnu -p mirrord-operator --features "crd, client" --profile ci
      - name: mirrord cli UT
        uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cargo xtask test-ut -- --target x86_64-unknown-linux-gnu
      - name: mirrord protocol-io UT
        uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cargo nextest run --target x86_64-unknown-linux-gnu -p mirrord-protocol-io --profile ci
      - name: mirrord jaq UT
        uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cargo nextest run --target x86_64-unknown-linux-gnu -p mirrord-jaq --profile ci
      - name: save intproxy logs
        continue-on-error: true
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intproxy_logs_linux
          path: /tmp/intproxy_logs/linux
