name: Test Integration

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label to use. Callers pass the one `plan` picked."
        required: false
        type: string
        default: "blacksmith-16vcpu-ubuntu-2404"
      runner_arm:
        description: "arm64 runner label. Callers pass the one `plan` picked."
        required: false
        type: string
        default: "blacksmith-8vcpu-ubuntu-2404-arm"
      runner_image_built:
        description: "Whether the runner image comes from an uploaded artifact rather than the published one."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

env:
  # Some crates have no tests on some platforms; nextest treats that as an error by default.
  NEXTEST_NO_TESTS: warn
  MIRRORD_TELEMETRY: false

jobs:
  integration-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ${{ inputs.runner }}
          - arch: arm64
            runner: ${{ inputs.runner_arm }}
    name: integration-tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      MIRRORD_TESTS_USE_BINARY: /workspace/mirrord/target/debug/mirrord
      MIRRORD_LAYER_FILE: /workspace/mirrord/target/debug/libmirrord_layer.so
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Rust links x86_64 with `rust-lld` but aarch64 with GNU ld, which is several times slower.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -Clink-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Rust cache
        uses: metalbear-co/rust-cache@d49d62d59c5755dd81754c833186b84a82f895fe # v2.9.1+1
        with:
          shared-key: integration
      - uses: ./.github/actions/provide-ci-runner
        with:
          built: ${{ inputs.runner_image_built }}
      - name: build test apps
        uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            set -eux
            cd mirrord/layer-tests/tests/apps
            for app in issue1123 issue1054 issue1458 issue1458portnot53 issue2058 issue2204; do
              (cd "$app" && rustc "$app.rs" --out-dir target)
            done
            for app in fileops outgoing recv_from dns_resolve listen_ports issue1776 \
              issue1776portnot53 issue1899 issue2001 issue2438 issue3248 rebind0 dup_listen \
              double_listen posix_spawn_shared_sockets; do
              (cd "$app" && cargo build)
            done
            ./dlopen_cgo/build_test_app.sh
            cd /workspace/mirrord
            pnpm --filter mirrord-frontends install --frozen-lockfile
            ./scripts/build_c_apps.sh
      - uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cargo build -p mirrord-layer
      - uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cargo build -p mirrord
      - name: mirrord layer integration tests
        uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cargo nextest run -p mirrord-layer-tests --no-default-features
      # Runs after the integration tests, since `test-ut` (which adds `-p mirrord` with placeholder
      # CLI assets) replaces the `target/debug/mirrord` they run.
      #
      # Also checks the vendored docs and skills, so a release PR whose bumped corpus doesn't hold
      # up fails here.
      - name: mirrord UT
        uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cargo xtask test-ut \
              -p mirrord-layer-lib \
              -p mirrord-layer \
              -p mirrord-protocol \
              -p mirrord-config \
              -p mirrord-progress \
              -p mirrord-kube \
              -p mirrord-intproxy \
              -p mirrord-auth \
              -p mirrord-operator \
              -p mirrord-protocol-io \
              -p mirrord-jaq \
              -p mirrord-vpn \
              -p mirrord-up \
              -p mirrord-mcp \
              -p mirrord-tui \
              --features mirrord-kube/incluster,mirrord-kube/portforward,mirrord-operator/crd,mirrord-operator/client
      # Built from its own directory, so that the crate is checked the way someone working only on
      # it builds it, rather than with whatever features the rest of the workspace happens to turn
      # on.
      - name: mirrord tui standalone build
        uses: ./.github/actions/run-in-ci-runner
        with:
          command: |
            cd mirrord/tui && cargo build
      - name: save intproxy logs
        continue-on-error: true
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intproxy_logs_linux_${{ matrix.arch }}
          path: /tmp/intproxy_logs/linux
          retention-days: 2
