# Hello traveler!
# This is the CI workflow for mirrord.
#
# Bazel builds, lints and tests everything, so CI runs the same commands that a developer runs:
#
#     bazel build //...                                      # build
#     bazel build --config=clippy //... //mirrord/tests:e2e  # lint the Rust code
#     bazel build --config=doc //...                         # build the Rust docs
#     bazel test //...                                       # unit and integration tests
#     bazel run //:lint                                      # lint the docs and the frontends, and
#                                                            # check the changelog and the deps
#     bazel run //:format -- --check                         # check the formatting
#
# The `build-test` job runs the first four on each platform, as separate steps, so that the job's
# summary shows which of them failed. `.github/actions/setup-bazel` turns on the `ci` config of
# `.bazelrc` for every command. The `lint` job runs the last two, with the tools of the `lint`
# devshell in `flake.nix`. The end-to-end tests run in `test-e2e.yaml`. On a release branch, the
# `*_on_release_branch` jobs build what the release builds, with `--config=release`, and run the
# end-to-end tests of the IDE extensions with it.
#
# Please be mindful, we try to target less than 30 minutes for the CI to run. If you're adding
# something, please make sure it doesn't impact too much, and if you're reviewing please have it in
# mind.
#
# - Adding a compiled app to e2e:
#
# If you want to add a rust/go/[other compiled language] to the list of e2e apps, then you have to
# check 2 other places.
#
# 1. The `test-images` repo, if your e2e wants to use a custom image, that's not already there, and;
# 2. `:apps` in `mirrord/tests/BUILD.bazel`, which builds the apps that the tests run.
#
# Forgetting (2) will probably net you a message saying that `mirrord exec` could not find the path
# of the app, while forgetting (1) nets you a message saying that the service could not be
# reached/found.
name: CI

on:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main, "*staging*", "windows-support"]
  pull_request:
    branches: [main, "*staging*", "windows-support"]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel previous runs on the same PR.
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIRRORD_TELEMETRY: false

jobs:
  # ── plan ────────────────────────────────────────────────────────────

  plan:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # don't run CI on drafts
    if: github.event.pull_request.draft == false
    outputs:
      # Whether anything that Bazel builds changed. A change to the docs alone skips the build
      # jobs, which would only fetch every output from the cache and start every runner for it.
      build_changed: ${{ steps.changed-build.outputs.any_changed }}
      ci_changed: ${{ steps.changed-ci.outputs.any_changed }}
      config_schema_changed: ${{ steps.changed-config-schema.outputs.any_changed }}
      corpus_changed: ${{ steps.changed-corpus.outputs.any_changed }}
      install_script_changed: ${{ steps.changed-install-script.outputs.any_changed }}
      # Whether anything changed that the end-to-end tests build or run with. Bazel never caches
      # their results, because they depend on the cluster, so they take their whole time whenever
      # they run.
      run_e2e: ${{ steps.changed-e2e.outputs.any_changed }}
      release_branch: ${{ steps.release-branch.outputs.branch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: get CI changes
        id: changed-ci
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            .github/workflows/**
            .github/actions/**

      # Everything but the Markdown files at the root and the changelog fragments. The Markdown
      # files elsewhere can be part of the build, like the docs that `mirrord mcp` embeds.
      - name: get build changes
        id: changed-build
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            **
          files_ignore: |
            *.md
            changelog.d/**

      - name: get install script changes
        id: changed-install-script
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            scripts/install.sh
            .github/workflows/test-install-script.yaml

      # The docs and the Bazel build of the crate don't change the protocol.
      - name: get protocol changes
        id: changed-protocol
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            mirrord/protocol/**
          files_ignore: |
            mirrord/protocol/**/*.md
            mirrord/protocol/**/BUILD.bazel

      - name: get protocol toml changes
        id: changed-protocol-toml
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            mirrord/protocol/Cargo.toml

      # The crates, the tests and their apps, which are all in `mirrord/`, the dependencies, the
      # Bazel rules and flags, and the workflows that run the tests. The frontends in `packages/`
      # aren't here, because a change to them doesn't reach the cluster.
      - name: get e2e changes
        id: changed-e2e
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            mirrord/**
            Cargo.toml
            Cargo.lock
            MODULE.bazel
            MODULE.bazel.lock
            BUILD.bazel
            bazel/**
            .bazelrc
            .bazelversion
            .config/nextest.toml
            go_apps.work
            .github/workflows/ci.yaml
            .github/workflows/test-e2e.yaml
            .github/actions/setup-bazel/**
          files_ignore: |
            mirrord/**/AGENTS.md

      - name: verify protocol bump
        run: |
          if [ "${{ steps.changed-protocol.outputs.any_changed }}" == "true" ] && [ "${{ steps.changed-protocol-toml.outputs.any_changed }}" != "true" ]; then
            echo "Error: Protocol has changed but Cargo.toml has not. Please update Cargo.toml."
            exit 1
          fi

      - name: get corpus changes
        id: changed-corpus
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            mirrord/mcp/corpus/**
            mirrord/mcp/vendor/**

      - name: get config changes
        id: changed-config-schema
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            mirrord-schema.json
            mirrord-up-schema.json

      # `auto-release-pr` names release branches `releases/<version>`, which `release.yaml` and
      # `auto-release-pr.yaml` match by the same prefix.
      #
      # This is false in the merge queue, where the ref is `gh-readonly-queue/...` and carries a
      # pull request number rather than a branch name. The pull request run is the one that matters
      # here.
      - id: release-branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "branch=$([[ "$BRANCH" == releases/* ]] && echo "true" || echo "false")" >> "$GITHUB_OUTPUT"

  # ── checks (no build) ───────────────────────────────────────────────

  install_script:
    needs: [plan]
    if: ${{ needs.plan.outputs.install_script_changed == 'true' || needs.plan.outputs.ci_changed == 'true' }}
    uses: ./.github/workflows/test-install-script.yaml

  # ── lint and format ─────────────────────────────────────────────────

  # `bazel run //:lint` and `bazel run //:format` take their tools from `PATH`, which the `lint`
  # devshell of `flake.nix` provides, so that CI runs them at the versions that developers run.
  lint:
    needs: plan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      # The corpus upstream check reads the pull request's labels.
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # towncrier compares the branch with `origin/main`.
          fetch-depth: 0
          # `release.yaml` builds the head of the release branch rather than its merge with main,
          # so a release PR checks the corpus against the schemas of that head. Other runs keep the
          # default ref.
          ref: ${{ needs.plan.outputs.release_branch == 'true' && github.event.pull_request.head.sha || '' }}

      # The action downloads the newest installer unless it's given a version.
      - uses: metalbear-co/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.4
          extra-conf: experimental-features = nix-command flakes

      - uses: ./.github/actions/setup-bazel

      # A change to the modules must come with the lockfile that they resolve to, and with the
      # `use_repo` calls that `bazel mod tidy` writes, or every developer's next build would change
      # the lockfile. Any other Bazel command updates the lockfile in place, so this step runs
      # before the others.
      - name: Bazel modules
        run: |
          bazel mod deps --lockfile_mode=error
          bazel mod tidy
          git diff --exit-code

      - name: lint
        if: ${{ !cancelled() }}
        run: nix develop .#lint --command bazel run //:lint

      - name: format
        if: ${{ !cancelled() }}
        run: nix develop .#lint --command bazel run //:format -- --check

      # The vendored docs and skills must be byte-identical to their pinned upstream commits, and
      # the config blocks in the skills repo at its pinned commit must validate against the schemas
      # of this commit. A change to the schemas runs it, so that a change that breaks a pinned skill
      # fails on its own PR rather than on the next release PR. Release PRs always run it, because
      # they ship the corpus with the schemas of their head even when the pins didn't move. It
      # fetches the upstream repositories, so it only runs when its inputs change.
      - name: corpus
        if: ${{ !cancelled() && (needs.plan.outputs.corpus_changed == 'true' || needs.plan.outputs.config_schema_changed == 'true' || needs.plan.outputs.ci_changed == 'true' || needs.plan.outputs.release_branch == 'true') }}
        run: nix develop .#lint --command bazel run //mirrord/mcp/vendor -- check

      # The next release PR bumps the corpus pins to upstream HEAD, so this checks the config blocks
      # in the skills repo at HEAD against the schemas of this PR, to fail a schema change that
      # breaks them here rather than on the release PR. A change the skills repo can only follow
      # once it ships, such as renaming an option, can't pass: add the `skip-corpus-upstream` label,
      # re-run the failed jobs, and update the skills repo before the next release. The label is
      # read when the job runs, since a re-run gets the labels of the original event. The merge
      # queue doesn't run it, as a PR in the queue has already passed it or been labeled to skip it.
      - name: corpus upstream
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.plan.outputs.config_schema_changed == 'true' || needs.plan.outputs.corpus_changed == 'true' || needs.plan.outputs.ci_changed == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if grep -qx skip-corpus-upstream <<< "$labels"; then
            echo "Skipped by the skip-corpus-upstream label."
          else
            nix develop .#lint --command bazel run //mirrord/mcp/vendor -- check-upstream
          fi

  # ── build and test ──────────────────────────────────────────────────

  build-test:
    needs: plan
    if: ${{ needs.plan.outputs.build_changed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: blacksmith-16vcpu-ubuntu-2404
          - name: linux-aarch64
            runner: blacksmith-8vcpu-ubuntu-2404-arm
          - name: macos
            runner: blacksmith-6vcpu-macos-latest
          - name: windows
            runner: blacksmith-16vcpu-windows-2025
    name: build-test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # Git Bash, the Windows runners' `bash`, rewrites arguments that look like Unix paths for
      # Windows programs, which would turn `//...` into `/...`. Other platforms ignore it.
      MSYS2_ARG_CONV_EXCL: "*"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Of the jobs that run on each platform, this one downloads the most, so it's the one that
      # saves the cache of the downloads, and only on `main`, whose caches every branch and the
      # merge queue can read.
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Each step after this one runs even when an earlier one fails, so that the job reports every
      # failing step, and each step keeps going after a failing target. The build only checks that
      # everything builds, so it leaves the outputs in the remote cache rather than download them.
      # The steps that read files from `bazel-bin` or `bazel-testlogs` keep Bazel's default, which
      # downloads the outputs of the targets that they name.
      - name: build
        run: bazel build --remote_download_outputs=minimal //...

      # `//...` leaves out the end-to-end tests, which are `manual` (see `.bazelrc`).
      - name: clippy
        if: ${{ !cancelled() }}
        run: bazel build --config=clippy //... //mirrord/tests:e2e

      - name: docs
        if: ${{ !cancelled() }}
        run: bazel build --config=doc //...

      # A test that Bazel takes from the remote cache brings back the `test.xml` of the run that
      # cached it, with that run's retries, so the flaky test report would count them again on every
      # later run. On `main`, nearly every test would come from the cache, since `main` gets the
      # tree that its merge queue run tested. So `main` runs every test again, and its reports only
      # hold the retries of its own run.
      - name: test
        if: ${{ !cancelled() }}
        run: bazel test ${{ github.ref == 'refs/heads/main' && '--nocache_test_results' || '' }} //...

      # Windows gives the CLI's main thread only the stack that the binary asks for, so this checks
      # that the CLI that mirrord distributes fits in it. The build step compiled that CLI as part
      # of `//...`, so this build only fetches the binary and its PDB, which is in an output group
      # that Bazel only builds when it's asked for. The script finds the CLI's frames in the PDB
      # next to the binary. The other steps run in Git Bash, whose Bazel server found Git's
      # `usr\bin\bash.exe`. PowerShell would find `bin\bash.exe`, and Bazel would then start another
      # server, which analyzes the workspace again, so `BAZEL_SH` names the same shell.
      - name: stack check
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        env:
          BAZEL_SH: C:\Program Files\Git\usr\bin\bash.exe
        run: |
          $ErrorActionPreference = "Stop"
          bazel build //mirrord/cli:cli_standalone --output_groups=+pdb_file
          if ($LASTEXITCODE -ne 0) { throw "bazel build failed" }
          ./scripts/win_stack_check.ps1 -Exe bazel-bin\mirrord\cli\standalone\mirrord.exe

      # The layer tests write the intproxy's logs to their outputs, which Bazel keeps in each test's
      # `test.outputs`.
      - name: upload the intproxy logs
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intproxy_logs_${{ matrix.name }}
          path: bazel-testlogs/mirrord/layer-tests/**/test.outputs/**
          if-no-files-found: ignore
          retention-days: 2

      # `ci-success` merges the reports into the `nextest-junit` artifact that
      # `flaky-test-report.yaml` reads. Bazel keeps each test's JUnit report as its `test.xml`.
      - name: upload the test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nextest-junit-${{ github.job }}-${{ matrix.name }}
          path: bazel-testlogs/**/test.xml
          if-no-files-found: ignore
          # Only `main`'s reports feed the flaky test report.
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 2 }}

  e2e:
    needs: [plan]
    if: ${{ needs.plan.outputs.run_e2e == 'true' }}
    uses: ./.github/workflows/test-e2e.yaml

  # ── release branches ────────────────────────────────────────────────

  # A release pull request builds what `release.yaml` builds, with `--config=release`, so that it
  # finds what fails to build only with optimizations, like code that only debug assertions use,
  # or only for the release, before the release itself does, which has pushed its images by the
  # time that a later job of it fails. Three jobs build it.
  #
  # `build_e2e_files_on_release_branch` builds the two files that the IDE extensions' end-to-end
  # tests run, so that the tests start without waiting for the other platforms. They download the
  # Linux CLI, with the layer and the UI that it embeds, from the `mirrord-artifacts` artifact, and
  # load the agent's image as the image `test` from the `test.tar` of the `test` artifact.
  build_e2e_files_on_release_branch:
    name: build release (e2e files)
    needs: [plan]
    if: ${{ needs.plan.outputs.release_branch == 'true' }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bazel

      # `image_load`'s `tarball` output is the archive that `docker load` takes.
      - name: Build the CLI and the agent image
        run: |
          bazel build --config=release --//mirrord/agent:image_tag=test:latest --output_groups=+tarball \
            //release:mirrord_linux_x86_64 //mirrord/agent:image_load
          mkdir "$RUNNER_TEMP/cli"
          cp bazel-bin/release/mirrord_linux_x86_64 "$RUNNER_TEMP/cli/mirrord"
          cp bazel-bin/mirrord/agent/image_load/tarball.tar "$RUNNER_TEMP/test.tar"

      - name: Upload the CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mirrord-artifacts
          path: ${{ runner.temp }}/cli/mirrord
          if-no-files-found: error
          retention-days: 2

      - name: Upload the agent image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test
          path: ${{ runner.temp }}/test.tar
          if-no-files-found: error
          retention-days: 2

  # Builds the targets that the `build_unix_and_release_images` job of `release.yaml` builds: the
  # files for Linux and macOS, with the macOS files signed ad hoc, and the images. It runs after
  # `build_e2e_files_on_release_branch`, whose outputs it takes from the remote cache rather than
  # build the Linux x86-64 CLI and the agent again.
  build_on_release_branch:
    name: build release (unix)
    needs: [plan, build_e2e_files_on_release_branch]
    if: ${{ needs.plan.outputs.release_branch == 'true' }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bazel

      - name: Build the release files and the images
        run: |
          bazel build --config=release --remote_download_outputs=minimal \
            //release:unix \
            //mirrord/agent:push //mirrord/agent:image_index.digest \
            //mirrord/cli:push //mirrord/cli:image_index.digest

  # Builds the targets that the `build_binaries_windows` job of `release.yaml` builds, which only
  # a Windows machine builds as the release does. Every crate fails on a warning, so a warning
  # that only an optimized build for Windows gives would otherwise first fail in the release.
  build_windows_on_release_branch:
    name: build release (windows)
    needs: [plan]
    if: ${{ needs.plan.outputs.release_branch == 'true' }}
    runs-on: blacksmith-16vcpu-windows-2025
    timeout-minutes: 150
    env:
      # See `build-test`.
      MSYS2_ARG_CONV_EXCL: "*"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bazel

      - name: Build the release files
        run: |
          bazel build --config=release --remote_download_outputs=minimal \
            //mirrord/cli:cli_standalone //mirrord/layer-win

  intellij_e2e_on_release_branch:
    needs: [build_e2e_files_on_release_branch]
    uses: metalbear-co/mirrord-intellij/.github/workflows/reusable_e2e.yaml@main
    with:
      mirrord_release_branch: true

  vscode_e2e_on_release_branch:
    needs: [build_e2e_files_on_release_branch]
    uses: metalbear-co/mirrord-vscode/.github/workflows/reusable_e2e.yaml@main
    with:
      mirrord_release_branch: true

  # ── gate ────────────────────────────────────────────────────────────

  # The one required check, so that branch protection doesn't have to list every job, including
  # the matrix jobs and the ones that a change skips.
  ci-success:
    name: ci
    # We want this to run even if some of the required jobs got skipped
    if: always()
    needs:
      [
        plan,
        intellij_e2e_on_release_branch,
        vscode_e2e_on_release_branch,
        build_e2e_files_on_release_branch,
        build_on_release_branch,
        build_windows_on_release_branch,
        build-test,
        e2e,
        lint,
        install_script,
      ]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      # Merging the test reports deletes the per-job ones.
      actions: write
    steps:
      # Both report steps run ahead of the gate below, because a run that failed still retried the
      # tests it got through, and those retries are exactly what the flake report is looking for.
      - name: Count the test reports
        id: reports
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name | startswith("nextest-junit-"))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Merge the test reports
        if: ${{ github.ref == 'refs/heads/main' && steps.reports.outputs.count != '0' }}
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nextest-junit
          pattern: nextest-junit-*
          separate-directories: true
          delete-merged: true
          retention-days: 30

      - name: Check required jobs passed
        # We have to do it in the shell since if it's in the if condition
        # then skipping is considered success by branch protection rules
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')
          if [ -n "$failing" ]; then
            echo "$failing"
            exit 1
          fi
