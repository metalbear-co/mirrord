# Hello traveler!
# This is the CI workflow for mirrord.
#
# Please be mindful, we try to target less than 30 minutes for the CI to run. If you're adding
# something, please make sure it doesn't impact too much, and if you're reviewing please have it in
# mind.
#
# - Adding a compiled app to e2e:
#
# If you want to add a rust/go/[other compiled language] to the list of e2e apps, then you have to
# check 2 other places.
#
# 1. The `test-images` repo, if your e2e wants to use a custom image, that's not already there, and;
# 2. `//tests:apps`, which builds the apps that the tests run.
#
# Forgetting (2) will probably net you a message saying that `mirrord exec` could not find the path
# of the app, while forgetting (1) nets you a message saying that the service could not be
# reached/found.
name: CI

on:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main, "*staging*", "windows-support"]
  pull_request:
    branches: [main, "*staging*", "windows-support"]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel previous runs on the same PR.
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIRRORD_TELEMETRY: false
  # Line tables keep the file and line numbers in panics and backtraces, but they build and link faster than full
  # debug info. rust-cache hashes this variable into its key, so the jobs that share a cache must all set it.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # ── plan ────────────────────────────────────────────────────────────

  plan:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # don't run CI on drafts
    if: github.event.pull_request.draft == false
    outputs:
      build_changed: ${{ steps.changed-build.outputs.any_changed }}
      ci_changed: ${{ steps.changed-ci.outputs.any_changed }}
      content_only: ${{ steps.changed-content-only.outputs.only_changed }}
      install_script_changed: ${{ steps.changed-install-script.outputs.any_changed }}
      release_branch: ${{ steps.release-branch.outputs.branch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get CI changes
        id: changed-ci
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            .github/workflows/**
            .github/actions/**

      # A change that only touches the Markdown files at the root and the changelog fragments skips
      # the build. `*.md` only matches the files at the root, because Markdown elsewhere can be part
      # of the build, like the docs that `mirrord mcp` embeds.
      - name: Get build changes
        id: changed-build
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            **
          files_ignore: |
            *.md
            changelog.d/**

      - name: Get install script changes
        id: changed-install-script
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            scripts/install.sh
            .github/workflows/test-install-script.yaml

      - name: Get protocol changes
        id: changed-protocol
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            mirrord/protocol/**
          files_ignore: |
            mirrord/protocol/**/*.md
            mirrord/protocol/**/BUILD.bazel

      - name: Get protocol toml changes
        id: changed-protocol-toml
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            mirrord/protocol/Cargo.toml

      - name: Verify protocol bump
        run: |
          if [ "${{ steps.changed-protocol.outputs.any_changed }}" == "true" ] && [ "${{ steps.changed-protocol-toml.outputs.any_changed }}" != "true" ]; then
            echo "Error: Protocol has changed but Cargo.toml has not. Please update Cargo.toml."
            exit 1
          fi

      # A pull request that only changes these needs no changelog fragment and runs no build.
      - name: Get docs, guides and skills-only changes
        id: changed-content-only
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            docs/**
            guides/**
            skills/**

      # `auto-release-pr` names release branches `releases/<version>`.
      #
      # In the merge queue, the ref is `gh-readonly-queue/...`, which carries a pull request number
      # rather than the branch name, so `branch` is false there. The release branch jobs only need
      # to run on the pull request.
      - id: release-branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "branch=$([[ "$BRANCH" == releases/* ]] && echo "true" || echo "false")" >> "$GITHUB_OUTPUT"

  # ── checks (no build) ───────────────────────────────────────────────

  install_script:
    needs: [plan]
    if: ${{ needs.plan.outputs.install_script_changed == 'true' || needs.plan.outputs.ci_changed == 'true' }}
    uses: ./.github/workflows/test-install-script.yaml

  # ── lint and format ─────────────────────────────────────────────────

  lint:
    needs: plan
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # `towncrier check` compares the branch with `origin/main`, which a shallow clone lacks.
          fetch-depth: 0
          # `release.yaml` releases the head of the release branch rather than its merge with
          # `main`, so a release pull request checks that head.
          ref: ${{ needs.plan.outputs.release_branch == 'true' && github.event.pull_request.head.sha || '' }}

      - uses: ./.github/actions/setup-bazel

      # Any other Bazel command would update a stale lockfile in place and hide it, so this step
      # runs first.
      - name: Bazel modules
        run: |
          # Fails if `MODULE.bazel.lock` doesn't match the modules.
          bazel mod deps --lockfile_mode=error
          # `bazel mod tidy` fixes the `use_repo` calls, so `git diff` fails if any didn't match the
          # extensions' repositories. It also sorts the arguments of the calls by buildifier's
          # default table, so buildifier sorts them back by `.buildifier-tables.json`.
          bazel mod tidy
          bazel run @multitool//tools/buildifier -- MODULE.bazel
          git diff --exit-code

      # `cargo deny` and `cargo shear` read the workspace through `cargo metadata`, which downloads
      # every crate of `Cargo.lock`. Only `main` saves the cache, because every branch can read
      # `main`'s caches.
      - name: Restore Cargo's downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # A pull request that only changes `docs/`, `guides/` or `skills/` needs no changelog
      # fragment, since the release notes describe changes to mirrord, not to its documentation or
      # skills.
      - name: Lint
        if: ${{ !cancelled() }}
        run: bazel run //:lint -- ${{ needs.plan.outputs.content_only == 'true' && '--skip towncrier' || '' }}

      - name: Save Cargo's downloads
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Format
        if: ${{ !cancelled() }}
        run: bazel run //:format -- --check

      # A pull request that only changes `docs/`, `guides/` or `skills/` skips `build-test`, so this
      # runs the tests that read them: the `mirrord-mcp` tests, which check that every page and
      # skill that `mirrord mcp` embeds loads, and the tests of the scripts that check them.
      - name: Test the docs and skills
        if: ${{ !cancelled() && needs.plan.outputs.content_only == 'true' }}
        run: bazel test //docs/... //skills/... //mirrord/mcp/...

  # ── build and test ──────────────────────────────────────────────────

  # A pull request that only changes `docs/`, `guides/` or `skills/` builds nothing, and the `lint`
  # job runs the tests that read them.
  build-test:
    needs: plan
    if: ${{ needs.plan.outputs.build_changed == 'true' && needs.plan.outputs.content_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: blacksmith-16vcpu-ubuntu-2404

          - name: linux-aarch64
            runner: blacksmith-8vcpu-ubuntu-2404-arm

          - name: macos
            runner: blacksmith-6vcpu-macos-latest

          - name: windows
            runner: blacksmith-16vcpu-windows-2025

    name: build-test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      # Stops Git Bash, the Windows steps' shell, from rewriting `//...` into the Unix path `/...`.
      MSYS2_ARG_CONV_EXCL: "*"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Of the jobs that run on each platform, this one downloads the most, so it saves the cache.
      - uses: ./.github/actions/setup-bazel
        with:
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # The build only checks that everything builds, so it doesn't download the outputs.
      - name: Build
        run: bazel build --remote_download_outputs=minimal //...

      # Clippy also lints the end-to-end tests, which `//...` leaves out because they're `manual`.
      - name: Clippy
        if: ${{ !cancelled() }}
        run: bazel build --config=clippy //... //tests:_e2e

      - name: Docs
        if: ${{ !cancelled() }}
        run: bazel build --config=doc //...

      # `main` runs every test again rather than take its result from the remote cache, because a
      # cached result brings back the `test.xml` of the run that cached it, with that run's retries.
      # The flaky test report reads `main`'s reports, so it would count those retries again on every
      # run.
      #
      # `bazel test` would build every target of `//...` and download all their outputs.
      # `--build_tests_only` limits it to the tests and what they need, because the `Build` step
      # already checked that the rest builds.
      - name: Test
        if: ${{ !cancelled() }}
        run: bazel test --build_tests_only ${{ github.ref == 'refs/heads/main' && '--nocache_test_results' || '' }} //...

      - name: Upload the intproxy logs
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: intproxy_logs_${{ matrix.name }}
          path: bazel-testlogs/mirrord/layer-tests/**/test.outputs/**
          if-no-files-found: ignore
          retention-days: 2

      # `ci-success` merges these reports into the `nextest-junit` artifact, which
      # `flaky-test-report.yaml` reads.
      - name: Upload the test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nextest-junit-${{ github.job }}-${{ matrix.name }}
          path: bazel-testlogs/**/test.xml
          if-no-files-found: ignore
          # Only `main`'s reports feed the flaky test report.
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 2 }}

      # After every Bazel command, so that the disk cache holds the results of all of them.
      - name: Save the disk cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-bazel
        with:
          save-disk-cache: "true"

  e2e:
    needs: [plan]
    if: ${{ needs.plan.outputs.build_changed == 'true' && needs.plan.outputs.content_only != 'true' }}
    uses: ./.github/workflows/test-e2e.yaml

  # ── release branches ────────────────────────────────────────────────

  # A release pull request builds what `release.yaml` builds, with `-c opt`, so that the
  # release build fails on the pull request rather than in the release, which may have pushed some
  # images by then.
  #
  # This job only builds the Linux x86-64 CLI and the agent's image, which the IDE extensions'
  # end-to-end tests download as the `mirrord-artifacts` and `test` artifacts, so that those tests
  # don't wait for the rest of the release build.
  build_e2e_files_on_release_branch:
    name: build release (e2e files)
    needs: [plan]
    if: ${{ needs.plan.outputs.release_branch == 'true' }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # `release.yaml` releases the head of the release branch, not its merge with `main`.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/setup-bazel

      # The `tarball` output group of `image_load` holds the archive that `minikube image load`
      # reads. The extensions' tests run the agent image `test`, and the tag is the full name that
      # Kubernetes looks it up by, because a runtime that imports the archive into containerd keeps
      # the name exactly as the archive gives it.
      - name: Build the CLI and the agent image
        run: |
          bazel build -c opt --//mirrord/agent:image_tag=docker.io/library/test:latest \
            --output_groups=+tarball \
            //mirrord/cli:release/mirrord_linux_x86_64 //mirrord/agent:image_load
          mkdir "$RUNNER_TEMP/cli"
          cp bazel-bin/mirrord/cli/release/mirrord_linux_x86_64 "$RUNNER_TEMP/cli/mirrord"
          cp bazel-bin/mirrord/agent/image_load_docker.tar "$RUNNER_TEMP/test.tar"

      - name: Upload the CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mirrord-artifacts
          path: ${{ runner.temp }}/cli/mirrord
          if-no-files-found: error
          retention-days: 2

      - name: Upload the agent image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test
          path: ${{ runner.temp }}/test.tar
          if-no-files-found: error
          retention-days: 2

  # Builds what `build_unix_and_release_images` in `release.yaml` builds.
  build_on_release_branch:
    name: build release (unix)
    # Waiting for `build_e2e_files_on_release_branch` lets this job take the Linux x86-64 CLI and
    # the agent from the remote cache rather than build them again.
    needs: [plan, build_e2e_files_on_release_branch]
    if: ${{ needs.plan.outputs.release_branch == 'true' }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # `release.yaml` releases the head of the release branch, not its merge with `main`.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/setup-bazel

      - name: Build the release files and the images
        run: |
          bazel build -c opt --remote_download_outputs=minimal \
            //mirrord/cli:release_unix \
            //mirrord/agent:image_push //mirrord/agent:image_index.digest \
            //mirrord/cli:image_push //mirrord/cli:image_index.digest

  # Builds what `build_binaries_windows` in `release.yaml` builds.
  build_windows_on_release_branch:
    name: build release (windows)
    needs: [plan]
    if: ${{ needs.plan.outputs.release_branch == 'true' }}
    runs-on: blacksmith-16vcpu-windows-2025
    timeout-minutes: 150
    env:
      MSYS2_ARG_CONV_EXCL: "*"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # `release.yaml` releases the head of the release branch, not its merge with `main`.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/setup-bazel

      - name: Build the release files
        run: |
          bazel build -c opt --remote_download_outputs=minimal \
            //mirrord/cli:cli_standalone //mirrord/layer-win

  intellij_e2e_on_release_branch:
    needs: [build_e2e_files_on_release_branch]
    uses: metalbear-co/mirrord-intellij/.github/workflows/reusable_e2e.yaml@main
    with:
      mirrord_release_branch: true

  vscode_e2e_on_release_branch:
    needs: [build_e2e_files_on_release_branch]
    uses: metalbear-co/mirrord-vscode/.github/workflows/reusable_e2e.yaml@main
    with:
      mirrord_release_branch: true

  # ── gate ────────────────────────────────────────────────────────────

  # The one required check, so that branch protection doesn't have to list every job.
  ci-success:
    name: ci
    # We want this to run even if some of the required jobs got skipped
    if: always()
    needs:
      [
        plan,
        intellij_e2e_on_release_branch,
        vscode_e2e_on_release_branch,
        build_e2e_files_on_release_branch,
        build_on_release_branch,
        build_windows_on_release_branch,
        build-test,
        e2e,
        lint,
        install_script,
      ]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      # Merging the test reports deletes each job's reports.
      actions: write
    steps:
      # Both report steps run ahead of the gate below, because a run that failed still retried the
      # tests it got through, and those retries are exactly what the flake report is looking for.
      - name: Count the test reports
        id: reports
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name | startswith("nextest-junit-"))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Merge the test reports
        if: ${{ github.ref == 'refs/heads/main' && steps.reports.outputs.count != '0' }}
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nextest-junit
          pattern: nextest-junit-*
          separate-directories: true
          delete-merged: true
          retention-days: 30

      - name: Check required jobs passed
        # We have to do it in the shell since if it's in the if condition
        # then skipping is considered success by branch protection rules
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')
          if [ -n "$failing" ]; then
            echo "$failing"
            exit 1
          fi
