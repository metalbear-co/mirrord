# Hello traveler!
# This is the CI workflow for mirrord.
# It is a bit complicated, but it is also very powerful.
# We try to optimize for speed, but sometimes there are limitations.
# Please try to document it here so people won't try repeating your errors.
# 1. GitHub cache is limited to 10GB, so we try to have less jobs to not exceed it, since if we get over 10GB
#    the cache will be evicted then builds will be slower, so it's better to have less jobs.
# 2. I (Aviram) tried to use a container to build the Linux stuff, but couldn't get the e2e to work and (minikube in container)
#    and the benefit seemed little.
# 3. Please be mindful, we try to target less than 30 minutes for the CI to run. In a perfect world it'd be less than 5m.
#     If you're adding something, please make sure it doesn't impact too much, and if you're reviewing please have it in mind.
# 4. Make sure to specify target for cargo invocations, to re-use cache (cargo build --target X while host is X then cargo build will not use cache
#    since it's different targets from it's perspective - https://doc.rust-lang.org/cargo/guide/build-cache.html
#
# - Adding a compiled app to e2e:
#
# If you want to add a rust/go/[other compiled language] to the list of e2e apps, then you have to check 2 other
# places.
#
# 1. The `test-images` repo, if your e2e wants to use a custom image, that's not already there, and;
# 2. The local `.github/actions/e2e-setup/action.yaml`, where you should add the compilation call.
#
# Forgetting (2) will probably net you a message saying that `mirrord exec` could not find the path of the app,
# while forgetting (1) nets you a message saying that the service could not be reached/found.
#
# Caveats:
#
# You cannot use `workspace` dependencies in the test app, it fails to build, must fully specify the dependency.
#
# Related to (2): If you modify `mirrord-ci/actions.yaml`, you'll be affecting every PR!
name: CI

on:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main, "*staging*", "windows-support", "gh-readonly-queue*"]
  pull_request:
    branches: [main, "*staging*", "windows-support"]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel previous runs on the same PR.
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Some crates have no tests on some platforms; nextest treats that as an error by default.
  NEXTEST_NO_TESTS: warn
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  MIRRORD_TELEMETRY: false
  PINNED_NIGHTLY: nightly-2026-08-13

jobs:
  # ── plan ────────────────────────────────────────────────────────────

  plan:
    runs-on: ubuntu-24.04
    # don't run CI on drafts
    if: github.event.pull_request.draft == false
    outputs:
      rust_toolchain: ${{ steps.toolchain.outputs.rust_toolchain }}
      rs_changed: ${{ steps.changed-rs.outputs.any_changed }}
      vale_changed: ${{ steps.changed-vale.outputs.any_changed }}
      windows_changed: ${{ steps.changed-windows.outputs.any_changed }}
      markdown_changed: ${{ steps.changed-markdown.outputs.any_changed }}
      ci_changed: ${{ steps.changed-ci.outputs.any_changed }}
      protocol_changed: ${{ steps.changed-protocol.outputs.any_changed }}
      config_schema_changed: ${{ steps.changed-config-schema.outputs.any_changed }}
      dockerfile_changed: ${{ steps.changed-dockerfile.outputs.any_changed }}
      runner_image_changed: ${{ steps.changed-runner-image.outputs.any_changed }}
      frontend_changed: ${{ steps.changed-wizard-frontend.outputs.any_changed }}
      release_branch: ${{ steps.release-branch.outputs.branch }}
      runner_4: ${{ steps.runners.outputs.runner_4 }}
      runner_8: ${{ steps.runners.outputs.runner_8 }}
      runner_8_arm: ${{ steps.runners.outputs.runner_8_arm }}
      runner_16: ${{ steps.runners.outputs.runner_16 }}
      blacksmith: ${{ steps.runners.outputs.blacksmith }}
    steps:
      # This repo is public, so a pull request from anyone can run its CI. Paid runners are for
      # branches we own; everything from a fork gets the free ones. Every job takes its runner from
      # here so the choice is made once.
      - name: Pick the runners this run is allowed to use
        id: runners
        env:
          OURS: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$OURS" = "true" ]; then
            {
              echo "runner_4=blacksmith-4vcpu-ubuntu-2404"
              echo "runner_8=blacksmith-8vcpu-ubuntu-2404"
              echo "runner_8_arm=blacksmith-8vcpu-ubuntu-2404-arm"
              echo "runner_16=blacksmith-16vcpu-ubuntu-2404"
              echo "blacksmith=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "runner_4=ubuntu-24.04"
              echo "runner_8=ubuntu-24.04"
              echo "runner_8_arm=ubuntu-24.04-arm"
              echo "runner_16=ubuntu-24.04"
              echo "blacksmith=false"
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: toolchain
        run: echo "rust_toolchain=${{ env.PINNED_NIGHTLY }}" >> "$GITHUB_OUTPUT"
      - name: get CI changes
        id: changed-ci
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            .github/workflows/**
      - name: get changed rs files
        id: changed-rs
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            **/*.rs
            mirrord/**
            tests/**
            Cargo.toml
            Cargo.lock
            .dockerignore
            rust-toolchain.toml
            rustfmt.toml
            deny.toml
            .cargo/**
      - name: get CI runner image changes
        id: changed-runner-image
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            tests/**
            scripts/**
            mirrord/layer-tests/tests/apps/**/*.go
            mirrord/layer-tests/tests/apps/**/go.mod
            mirrord/layer-tests/tests/apps/**/go.sum
            mirrord/layer-tests/tests/apps/**/*.c
            rust-toolchain.toml
            Cargo.toml
            Cargo.lock
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
          files_ignore: |
            tests/src/**
            tests/README.md
      - name: get vale changes
        id: changed-vale
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            *.md
            changelog.d/*.md
      - name: get changed windows files
        id: changed-windows
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            mirrord/layer-win/**
            mirrord/str-win/**
            mirrord/**/windows/**
            mirrord/**/win32/**
            mirrord/**/win/**
            scripts/**/*.ps1
            **/*.ps1
            .github/workflows/windows-build.yaml
      - name: get markdown changes
        id: changed-markdown
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            README.md
      - name: get protocol changes
        id: changed-protocol
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            mirrord/protocol/**
      - name: get protocol toml changes
        id: changed-protocol-toml
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            mirrord/protocol/Cargo.toml
      - name: get dockerfile changes
        id: changed-dockerfile
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            mirrord/agent/Dockerfile
            mirrord/cli/Dockerfile
      - name: get frontend changes
        id: changed-wizard-frontend
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            packages/**
            pnpm-lock.yaml
            pnpm-workspace.yaml
            package.json
      - name: verify protocol bump
        run: |
          if [ "${{ steps.changed-protocol.outputs.any_changed }}" == "true" ] && [ "${{ steps.changed-protocol-toml.outputs.any_changed }}" != "true" ]; then
            echo "Error: Protocol has changed but Cargo.toml has not. Please update Cargo.toml."
            exit 1
          fi
      - name: get config changes
        id: changed-config-schema
        uses: metalbear-co/changed-files@db1aaf2ad42e3c3035f04afd76630172ef6743eb
        with:
          files: |
            mirrord-schema.json
      # `auto-release-pr` names release branches `releases/<version>`, so the
      # bare-version pattern this used to match stopped matching anything and
      # the IDE end-to-end jobs below have been silently skipping. Match the
      # same prefix that `release.yaml` and `auto-release-pr.yaml` use.
      #
      # This is false in the merge queue, where the ref is
      # `gh-readonly-queue/...` and carries a pull request number rather than a
      # branch name. The pull request run is the one that matters here.
      - id: release-branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "branch=$([[ "$BRANCH" == releases/* ]] && echo "true" || echo "false")" >> "$GITHUB_OUTPUT"
      - name: output test
        run: |
          echo ${{ steps.changed-rs.outputs.any_changed }};
          echo ${{ steps.changed-rs.outputs.all_changed_files }};
          echo ${{ steps.changed-vale.outputs.any_changed }};
          echo ${{ steps.changed-vale.outputs.all_changed_files }};
          echo ${{ steps.changed-markdown.outputs.any_changed }};
          echo ${{ steps.changed-markdown.outputs.all_changed_files }};
          echo ${{ steps.changed-ci.outputs.any_changed }};
          echo ${{ steps.changed-ci.outputs.all_changed_files }};
          echo ${{ steps.changed-protocol.outputs.any_changed }};
          echo ${{ steps.changed-protocol-toml.outputs.any_changed }};
          echo ${{ steps.changed-windows.outputs.any_changed }};
          echo ${{ steps.changed-dockerfile.outputs.any_changed }};
          echo ${{ steps.changed-config-schema.outputs.any_changed }};
          echo ${{ steps.changed-wizard-frontend.outputs.any_changed }};
          echo ${{ steps.release-branch.outputs.branch }};

  # ── checks (no build deps) ─────────────────────────────────────────

  build-ci-runner:
    needs: [plan]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-ci-runner.yaml
    with:
      runner: ${{ needs.plan.outputs.runner_8 }}
      blacksmith: ${{ needs.plan.outputs.blacksmith == 'true' }}
      build: ${{ needs.plan.outputs.runner_image_changed == 'true' }}
    secrets: inherit

  towncrier_check:
    uses: ./.github/workflows/check-towncrier.yaml

  lint:
    needs: plan
    uses: ./.github/workflows/check-lint.yaml
    with:
      run_markdown: ${{ needs.plan.outputs.markdown_changed == 'true' || needs.plan.outputs.ci_changed == 'true' }}
      run_rust: ${{ needs.plan.outputs.rs_changed == 'true' || needs.plan.outputs.ci_changed == 'true' }}
      run_vale: ${{ needs.plan.outputs.vale_changed == 'true' || needs.plan.outputs.ci_changed == 'true' }}
      run_wizard_frontend: ${{ needs.plan.outputs.frontend_changed == 'true' || needs.plan.outputs.ci_changed == 'true' }}
      run_ui_frontend: ${{ needs.plan.outputs.frontend_changed == 'true' || needs.plan.outputs.ci_changed == 'true' }}
      rust_toolchain: ${{ needs.plan.outputs.rust_toolchain }}
    secrets: inherit

  cargo-deny:
    needs: plan
    if: ${{ needs.plan.outputs.rs_changed == 'true' || needs.plan.outputs.ci_changed == 'true' || needs.plan.outputs.windows_changed == 'true' }}
    uses: ./.github/workflows/check-cargo-deny.yaml
    with:
      rust_toolchain: ${{ needs.plan.outputs.rust_toolchain }}

  check-rust-docs:
    needs: [plan]
    if: ${{ needs.plan.outputs.rs_changed == 'true' || needs.plan.outputs.ci_changed == 'true' }}
    uses: ./.github/workflows/check-rust-docs.yaml
    with:
      rust_toolchain: ${{ needs.plan.outputs.rust_toolchain }}
    secrets: inherit

  # ── builds ──────────────────────────────────────────────────────────

  # we build mirrord to run ide tests, while it can take time for e2e/integration to finish,
  # building concurrently can run faster the release ide tests
  build_mirrord_on_release_branch:
    name: build mirrord CLI
    needs: [plan]
    if: ${{ needs.plan.outputs.release_branch == 'true' }}
    uses: ./.github/workflows/build-mirrord-cli.yaml
    secrets: inherit

  test_agent_image:
    needs: plan
    if: ${{ needs.plan.outputs.rs_changed == 'true' || needs.plan.outputs.ci_changed == 'true' || needs.plan.outputs.dockerfile_changed == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-agent-image.yaml
    with:
      runner: ${{ needs.plan.outputs.runner_8 }}

  test_cli_image:
    needs: plan
    if: ${{ needs.plan.outputs.rs_changed == 'true' || needs.plan.outputs.ci_changed == 'true' || needs.plan.outputs.dockerfile_changed == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-cli-image.yaml
    with:
      runner: ${{ needs.plan.outputs.runner_8 }}
      runner_arm: ${{ needs.plan.outputs.runner_8_arm }}

  # ── tests ───────────────────────────────────────────────────────────

  test_agent:
    runs-on: ubuntu-24.04
    needs: plan
    if: ${{ needs.plan.outputs.rs_changed == 'true' || needs.plan.outputs.ci_changed == 'true' }}
    container:
      image: ghcr.io/metalbear-co/ci-agent-build:54901618bd7bdc9b4975fb7e5439e519f6469ac0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Routes this job's downloads through a local caching proxy backed by the Actions cache.
      # Never fatal: if it does not start, the job just downloads the way it did before.
      - name: Start HTTP cache proxy
        continue-on-error: true
        if: ${{ runner.os != 'Windows' }}
        uses: aviramha/cicache@2dac7392897df52ee1f9c11166e5e8a91b01ab55 # v0.3.1
        with:
          # Only genuinely large artifacts. The cache service is rate limited per job, so the
          # floor has to keep the number of stored objects in the tens rather than the thousands;
          # it also leaves more of the repository's cache budget to the Rust caches.
          min-size: "4194304"
          # Bumped past the keys an earlier version of the proxy left reserved but never
          # committed; the service reports those as existing while serving nothing for them.
          key-prefix: "cicache-v2"
      # frida's build script fetches its devkit with a TLS stack carrying its own root store, so
      # it ignores SSL_CERT_FILE and cannot be talked through an intercepting proxy over HTTPS.
      # Requesting the same artifact over plain HTTP keeps that hop on localhost; the proxy then
      # fetches it over HTTPS upstream and caches it. Harmless without a proxy, where GitHub just
      # redirects back to HTTPS.
      - name: Fetch the frida devkit through the cache proxy
        if: ${{ runner.os != 'Windows' }}
        run: echo "FRIDA_DOWNLOAD_CDN=http://github.com/frida/frida/releases/download" >> "$GITHUB_ENV"
      - uses: metalbear-co/setup-protoc@770e54d44679c8e1d8fdc06d1d9268fa79fbefb4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: rm rust-toolchain.toml
      - run: rustup default ${{ env.PINNED_NIGHTLY }}
      - name: Rust cache
        uses: metalbear-co/rust-cache@d49d62d59c5755dd81754c833186b84a82f895fe # v2.9.1+1
        with:
          shared-key: agent
      - uses: metalbear-co/install-action@c127aaa0fa8c555cbfb72bfa29b29a692d25d267 # v2.75.16
        with:
          tool: cargo-nextest
      - name: mirrord-agent UT
        run: cargo nextest run --target x86_64-unknown-linux-gnu -p mirrord-agent
      - name: mirrord-agent-env UT
        run: cargo nextest run --target x86_64-unknown-linux-gnu -p mirrord-agent-env
      - name: mirrord-agent-iptables UT
        run: cargo nextest run --target x86_64-unknown-linux-gnu -p mirrord-agent-iptables
      # Drains the upload queue and prints the hit rate. Has to run even when the job fails, or
      # nothing is stored for later runs.
      - name: Stop HTTP cache proxy
        continue-on-error: true
        if: ${{ always() && runner.os != 'Windows' }}
        uses: aviramha/cicache/cleanup@2dac7392897df52ee1f9c11166e5e8a91b01ab55 # v0.3.1

  integration_tests:
    needs: [plan, build-ci-runner]
    if: ${{ needs.plan.outputs.rs_changed == 'true' || needs.plan.outputs.ci_changed == 'true' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test-integration.yaml
    with:
      runner: ${{ needs.plan.outputs.runner_16 }}
      runner_image_built: ${{ needs.build-ci-runner.outputs.built == 'true' }}

  macos_tests:
    needs: plan
    if: ${{ needs.plan.outputs.rs_changed == 'true' || needs.plan.outputs.ci_changed == 'true' }}
    uses: ./.github/workflows/test-macos.yaml
    with:
      rust_toolchain: ${{ needs.plan.outputs.rust_toolchain }}
    secrets: inherit

  # NOTE: e2e intentionally does not `need` test_agent_image so the two run concurrently.
  # e2e spends its first ~9 min on cluster setup + building the CLI before it actually
  # needs the agent image, so overlapping that with the ~10 min image build keeps the
  # build off the critical path. The `download image` step polls for the artifact.
  e2e:
    needs: [plan, build-ci-runner]
    if: ${{ needs.plan.outputs.rs_changed == 'true' || needs.plan.outputs.ci_changed == 'true' || needs.plan.outputs.runner_image_changed == 'true' }}
    # A `workflow_call` job only passes down scopes the caller holds.
    permissions:
      contents: read
      actions: read
      packages: read
    uses: ./.github/workflows/test-e2e.yaml
    with:
      runner: ${{ needs.plan.outputs.runner_16 }}
      runner_image_built: ${{ needs.build-ci-runner.outputs.built == 'true' }}
    secrets: inherit

  windows_tests:
    needs: plan
    if: ${{ needs.plan.outputs.rs_changed == 'true' || needs.plan.outputs.windows_changed == 'true' || needs.plan.outputs.ci_changed == 'true' }}
    uses: ./.github/workflows/test-windows.yaml
    with:
      rust_toolchain: ${{ needs.plan.outputs.rust_toolchain }}

  # ── external calls ──────────────────────────────────────────────────

  # depends on `build_mirrord_on_release_branch` which provides the binary on the current tag
  # `build_mirrord_on_release_branch` depends on `plan`
  # which checks if the branch is a release branch
  intellij_e2e_on_release_branch:
    needs: [build_mirrord_on_release_branch, test_agent_image]
    uses: metalbear-co/mirrord-intellij/.github/workflows/reusable_e2e.yaml@main
    with:
      mirrord_release_branch: true

  vscode_e2e_on_release_branch:
    needs: [build_mirrord_on_release_branch, test_agent_image]
    uses: metalbear-co/mirrord-vscode/.github/workflows/reusable_e2e.yaml@main
    with:
      mirrord_release_branch: true

  # ── gate ────────────────────────────────────────────────────────────

  # We need some "accumulation" job here because bors fails (timeouts) to
  # listen on matrix builds.
  # Hence, we have some kind of dummy here that bors can listen on
  ci-success:
    name: ci
    # We want this to run even if some of the required jobs got skipped
    if: always()
    # This job prunes the run's inter-job artifacts, so every job that downloads one has to be
    # listed here. Dropping a job from this list lets the prune run while that job is still going,
    # and it then fails on a missing artifact.
    needs:
      [
        towncrier_check,
        plan,
        intellij_e2e_on_release_branch,
        vscode_e2e_on_release_branch,
        test_agent_image,
        test_cli_image,
        macos_tests,
        integration_tests,
        e2e,
        test_agent,
        lint,
        check-rust-docs,
        cargo-deny,
        windows_tests,
      ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      # Both report steps run ahead of the gate below, because a run that failed still retried the
      # tests it got through, and those retries are exactly what the flake report is looking for.
      - name: Count the test reports
        id: reports
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name | startswith("nextest-junit-"))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Merge the test reports
        if: ${{ github.ref == 'refs/heads/main' && steps.reports.outputs.count != '0' }}
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nextest-junit
          pattern: nextest-junit-*
          separate-directories: true
          delete-merged: true
          retention-days: 30

      - name: Check required jobs passed
        # We have to do it in the shell since if it's in the if condition
        # then skipping is considered success by branch protection rules
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failing=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')
          if [ -n "$failing" ]; then
            echo "$failing"
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Delete inter-job artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/prune-artifacts.sh run "$GITHUB_RUN_ID"
