name: Release
on:
  pull_request:
    branches:
      - main
    types:
      - closed
    # Release PRs are the only ones that rewrite CHANGELOG.md: towncrier builds it into
    # the release branch, while every other PR only adds changelog.d fragments. GitHub
    # offers no head-branch filter for pull_request, so this path filter is what keeps a
    # Release run from being created on every closed PR. Whether a run that does start
    # publishes is still decided by the releases/* check in validate_release_request.
    paths:
      - CHANGELOG.md
  # Running from workflow dispatch (AKA manual) will not publish anything.
  # This is intended for testing changes to this flow.
  workflow_dispatch:

# Least-privilege default; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  validate_release_request:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.validate.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.precheck.outputs.sha }}
    steps:
      # Resolve the single commit this release is pinned to, before anything is
      # checked out: the release branch tip. `auto-release-pr` cuts that branch
      # from main and adds a single commit, and the `release-branches-bot-only`
      # ruleset (in metalbear-co/infra) lets only the release bot push to it, so
      # its tree is exactly what the changelog describes.
      #
      # Neither default gives that. On a `pull_request` event the checkout ref is
      # `refs/pull/<n>/merge`, which GitHub recomputes whenever the base branch
      # moves, and `ref: main` is simply whatever main points at right now. Both
      # pick up whatever landed on main while the release PR was open — code that
      # would ship in this release but stay documented in the next one.
      #
      # A squashed release PR never puts the tip on main, so only the tag (and
      # GitHub's `refs/pull/<n>/head`) keeps it alive. Nothing downstream needs
      # it on main: `linear-release-action` scans `<previous tip>..<this tip>`,
      # which holds the main commits between the two cuts whether the PR was
      # squashed or merged.
      - name: Resolve release commit
        id: precheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed as data rather than interpolated into the script below, so a
          # branch name can never be expanded into shell syntax by the template
          # engine. See GitHub's security hardening guide for script injection.
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          sha=""
          if [ "${EVENT_NAME}" = "pull_request" ] \
            && [ "${PR_MERGED}" = "true" ] \
            && [[ "${HEAD_REF}" == releases/* ]]; then
            sha="${HEAD_SHA}"

            if [ -z "${sha}" ]; then
              echo "merged PR has no head SHA, aborting" >&2
              exit 1
            fi

            # A squashed release PR leaves the tip one commit ahead of main, and
            # one that landed as a merge commit leaves it on main. More than one
            # commit ahead means the branch holds more than auto-release-pr's
            # commit, so its tree may not match the changelog. The
            # `release-branches-bot-only` ruleset should prevent that, and this
            # check catches it if it ever doesn't.
            ahead_by=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${sha}" --jq '.ahead_by')
            if ! [[ "${ahead_by}" =~ ^[01]$ ]]; then
              echo "Release commit ${sha} is '${ahead_by}' commits ahead of main, expected 0 or 1." >&2
              echo "The release branch must hold only the commit auto-release-pr made. Aborting." >&2
              exit 1
            fi

            echo "Pinning release to ${sha}"
          fi

          # Empty on manual dispatch and on any PR that cannot produce a release,
          # where actions/checkout falls back to the triggering ref.
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      # Without a release commit, this checks out the triggering ref, whose version a manual run
      # builds.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.precheck.outputs.sha }}
          persist-credentials: false

      # The other jobs take the version from this job's output.
      - name: Read the version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format in Cargo.toml: ${version}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate release conditions
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          HEAD_REF: ${{ github.head_ref }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "Manual dispatch — skipping release validation."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          merged="${PR_MERGED}"
          head_ref="${HEAD_REF}"

          if [ "${merged}" != "true" ]; then
            echo "PR was not merged, skipping."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${head_ref}" != releases/* ]]; then
            echo "PR is not from a releases/* branch (head: ${head_ref}), skipping."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          version="${VERSION}"
          if gh release view "${version}" &>/dev/null; then
            echo "Release ${version} already exists, skipping."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "All checks passed — will release ${version}."
          echo "should_release=true" >> "${GITHUB_OUTPUT}"

  # Builds everything that the release takes from a Linux machine, in one Bazel command, so that
  # each crate compiles once: the Linux files for both CPUs and the universal macOS files, under the
  # names that the release gives them (see `release/BUILD.bazel`), and the agent's and the CLI's
  # images for both Linux CPUs. `--config=release` optimizes them as `cargo build --release` would.
  # Bazel signs the macOS files with MetalBear's Developer ID through `rcodesign` (see
  # `//bazel:macos_sign.bzl`), which reads the certificate and its private key from a PKCS #12 file.
  #
  # The job then pushes the images from the output base that built them, so `bazel run` finds every
  # action of `:push` already done. No image is pushed before the files and both images built, and
  # the job only logs in to the registry then. Each image is one index for both CPUs, whose digest
  # `:image_index.digest` writes to `image_index.json.sha256`.
  #
  # `build_on_release_branch` in `ci.yaml` builds the same targets on the release pull request.
  build_unix_and_release_images:
    needs: [validate_release_request]
    if: github.event_name == 'workflow_dispatch' || needs.validate_release_request.outputs.should_release == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 150
    permissions:
      packages: write
      contents: read
      # Keyless Sigstore signing of the build provenance, and recording it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate_release_request.outputs.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-bazel
        with:
          publishes: "true"

      - name: Write the signing certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
        run: |
          signing="$RUNNER_TEMP/signing"
          mkdir -m 700 "$signing"
          base64 --decode <<< "$P12_BASE64" > "$signing/identity.p12"
          printf '%s' "$P12_PASSWORD" > "$signing/password"

      - name: Build the release files and the images
        id: build
        run: |
          bazel build --config=release \
            --//bazel:macos_signing_p12_file="$RUNNER_TEMP/signing/identity.p12" \
            --//bazel:macos_signing_p12_password_file="$RUNNER_TEMP/signing/password" \
            //release:unix \
            //mirrord/agent:push //mirrord/agent:image_index.digest \
            //mirrord/cli:push //mirrord/cli:image_index.digest
          for image in agent cli; do
            digest=$(cat "bazel-bin/mirrord/$image/image_index.json.sha256")
            echo "${image}_digest=${digest:?}" >> "$GITHUB_OUTPUT"
          done

      - name: Remove the signing certificate
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/signing"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unix
          path: |
            bazel-bin/release/mirrord_*
            bazel-bin/release/libmirrord_layer_*
          if-no-files-found: error
          retention-days: 2

      # The Homebrew formula takes the checksums of the zips.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shasum
          path: bazel-bin/release/*.shasum256
          if-no-files-found: error
          retention-days: 2

      # `oci_push` pushes with the credentials that Docker keeps.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the images (test)
        if: github.event_name == 'workflow_dispatch'
        run: |
          bazel run --config=release //mirrord/agent:push -- \
            --repository ghcr.io/metalbear-co/mirrord-staging --tag ${{ github.sha }}
          bazel run --config=release //mirrord/cli:push -- \
            --repository ghcr.io/metalbear-co/mirrord-cli-staging --tag ${{ github.sha }}

      # Staging images are attested too, so a workflow_dispatch run exercises the
      # signing path without needing to cut a release.
      - name: Attest the agent image's build provenance (test)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/metalbear-co/mirrord-staging
          subject-digest: ${{ steps.build.outputs.agent_digest }}
          push-to-registry: true

      - name: Attest the CLI image's build provenance (test)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/metalbear-co/mirrord-cli-staging
          subject-digest: ${{ steps.build.outputs.cli_digest }}
          push-to-registry: true

      # Only the version tags are published here. `latest` is moved after both
      # attestations exist, so a signing failure can never leave the floating
      # tag that existing installs follow pointing at an unattested image.
      - name: Push the images (final/release)
        if: needs.validate_release_request.outputs.should_release == 'true'
        run: |
          bazel run --config=release //mirrord/agent:push -- \
            --tag ${{ needs.validate_release_request.outputs.version }}
          bazel run --config=release //mirrord/cli:push -- \
            --tag ${{ needs.validate_release_request.outputs.version }}

      # The agent runs privileged in our users' clusters, so it is the artifact
      # most worth being able to trace back to a build. The digest is the one of
      # the multi-arch index, which is what pulling either tag resolves to, so
      # verifying against a tag works.
      - name: Attest the agent image's build provenance
        if: needs.validate_release_request.outputs.should_release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/metalbear-co/mirrord
          subject-digest: ${{ steps.build.outputs.agent_digest }}
          push-to-registry: true

      - name: Attest the CLI image's build provenance
        if: needs.validate_release_request.outputs.should_release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/metalbear-co/mirrord-cli
          subject-digest: ${{ steps.build.outputs.cli_digest }}
          push-to-registry: true

      # Pushes the same indexes again, so `latest` names the attested digests.
      - name: Promote latest
        if: needs.validate_release_request.outputs.should_release == 'true'
        run: |
          bazel run --config=release //mirrord/agent:push -- --tag latest
          bazel run --config=release //mirrord/cli:push -- --tag latest

  # Checks the macOS files with Apple's own tools, which `rcodesign` doesn't replace: that the
  # signatures are valid and MetalBear's, that the files hold both CPUs, and that the CLI runs.
  verify_binaries_macos:
    needs: [build_unix_and_release_images]
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: unix
          path: release

      - name: Verify the macOS files
        working-directory: release
        run: |
          for file in mirrord_mac_universal libmirrord_layer_mac_universal.dylib; do
            codesign --verify --strict --verbose=2 "$file"
            codesign --display --verbose=2 "$file" 2>&1 | grep -q "Authority=Developer ID Application: METALBEAR TECH LTD"
            lipo -archs "$file"
          done
          # `lipo -verify_arch` fails unless the file has every CPU that it names. The layer also
          # has the arm64e shim (see `mirrord/layer/BUILD.bazel`).
          lipo mirrord_mac_universal -verify_arch x86_64 arm64
          lipo libmirrord_layer_mac_universal.dylib -verify_arch x86_64 arm64 arm64e
          chmod +x mirrord_mac_universal
          ./mirrord_mac_universal --version

  build_binaries_windows:
    needs: [validate_release_request]
    if: github.event_name == 'workflow_dispatch' || needs.validate_release_request.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 180
    environment: release
    permissions:
      # Needed to mint the OIDC token that authenticates against Azure Artifact Signing.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate_release_request.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install WiX Toolset
        run: |
          choco install wixtoolset -y
          $env:PATH = "C:\Program Files (x86)\WiX Toolset v3.14\bin;$env:PATH"
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: ./.github/actions/setup-bazel
        with:
          publishes: "true"

      # Signing changes the files in place, so they're copied out of Bazel's output tree, and lose
      # the read-only attribute that Bazel gives its outputs. `build_windows_on_release_branch` in
      # `ci.yaml` builds the same targets on the release pull request.
      - name: Build mirrord DLL and EXE
        run: |
          $ErrorActionPreference = "Stop"

          bazel build --config=release //mirrord/cli:cli_standalone //mirrord/layer-win
          if ($LASTEXITCODE -ne 0) { throw "bazel build failed" }

          $release = "$env:RUNNER_TEMP\release"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          $exe = "$release\mirrord.exe"
          $dll = "$release\mirrord_layer_win.dll"
          Copy-Item bazel-bin\mirrord\cli\standalone\mirrord.exe $exe
          Copy-Item bazel-bin\mirrord\layer-win\mirrord_layer_win.dll $dll
          foreach ($file in @($exe, $dll)) { (Get-Item $file).IsReadOnly = $false }

          echo "RELEASE_DIR=$release" >> $env:GITHUB_ENV
          echo "MIRRORD_DLL=$dll" >> $env:GITHUB_ENV
          echo "MIRRORD_EXE=$exe" >> $env:GITHUB_ENV

      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign DLL and EXE
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: metalbear
          certificate-profile-name: mirrord
          files: |
            ${{ env.MIRRORD_DLL }}
            ${{ env.MIRRORD_EXE }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build MSI
        run: |
          $ErrorActionPreference = "Stop"

          # Create working directory
          $wixDir = "$env:RUNNER_TEMP\wix"
          New-Item -ItemType Directory -Force -Path $wixDir | Out-Null

          # Copy binary files
          Copy-Item $env:MIRRORD_EXE "$wixDir\mirrord.exe" -Force
          Copy-Item $env:MIRRORD_DLL "$wixDir\mirrord_layer_win.dll" -Force
          Copy-Item "mirrord\cli\wix\mirrord.ico" "$wixDir\mirrord.ico" -Force
          Copy-Item "mirrord\cli\wix\License.rtf" "$wixDir\License.rtf" -Force

          $version = "${{ needs.validate_release_request.outputs.version }}"

          # MSI's ProductVersion caps each field at Major.Minor.Build = 255.255.65535.
          # We encode the CLI version as 1.<major>.<minor * 10 + patch>, using the wide Build field 
          # to carry both minor and patch. 
          # IMPORTANT: This assumes patch < 10 (historically it has never exceeded 5); if that's ever
          # not enough, fail loudly here rather than silently colliding two releases' MSI versions.
          $cliParts = $version.Split(".")
          $cliMajor = [int]$cliParts[0]
          $cliMinor = [int]$cliParts[1]
          $cliPatch = [int]$cliParts[2]

          if ($cliPatch -ge 10) {
            throw "CLI patch version $cliPatch does not fit in the MSI version encoding (must be < 10). Update the multiplier in this workflow step."
          }

          $msiBuild = $cliMinor * 10 + $cliPatch
          if ($msiBuild -gt 65535) {
            throw "Encoded MSI build $msiBuild exceeds the MSI Build field limit of 65535 (CLI version: $version)."
          }

          $version = "1.$cliMajor.$msiBuild"

          # Read WXS file directly and write with updated version (avoid Copy-Item encoding issues)
          $wxsSource = "mirrord\cli\wix\main.wxs"
          $wxsPath = "$wixDir\main.wxs"
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          $wxsContent = [System.IO.File]::ReadAllText($wxsSource, $utf8NoBom)
          # Replace Product Version attribute (case-sensitive to avoid XML declaration)
          $wxsContent = $wxsContent -creplace '(<Product[^>]+Version=)"[^"]*"', "`$1`"$version`""
          [System.IO.File]::WriteAllText($wxsPath, $wxsContent, $utf8NoBom)

          Write-Host "Updated WXS Product Version to: $version"

          # Build MSI
          $obj = "$wixDir\main.wixobj"
          $msi = "$env:RELEASE_DIR\mirrord.msi"

          candle.exe -nologo "$wixDir\main.wxs" -out $obj
          if ($LASTEXITCODE -ne 0) { throw "candle.exe failed" }

          light.exe -nologo $obj -out $msi -ext WixUIExtension -sval
          if ($LASTEXITCODE -ne 0) { throw "light.exe failed" }

          if (-not (Test-Path $msi)) {
            throw "MSI not produced"
          }

          echo "MIRRORD_MSI=$msi" >> $env:GITHUB_ENV

      - name: Sign MSI
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: metalbear
          certificate-profile-name: mirrord
          files: ${{ env.MIRRORD_MSI }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # The signing certificates are short-lived and re-issued every few days, so a broken
      # chain would otherwise only surface once users try to install a published artifact.
      - name: Verify signatures
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($file in @($env:MIRRORD_EXE, $env:MIRRORD_DLL, $env:MIRRORD_MSI)) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Signature verification failed for ${file}: $($sig.Status) - $($sig.StatusMessage)"
            }
            Write-Host "$file signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Generate checksums
        run: |
          foreach ($file in @($env:MIRRORD_EXE, $env:MIRRORD_DLL, $env:MIRRORD_MSI)) {
            (Get-FileHash $file -Algorithm SHA256).Hash.ToLower() | Out-File -FilePath "$file.sha256" -NoNewline -Encoding ascii
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: x86_64-pc-windows-msvc
          path: |
            ${{ env.MIRRORD_EXE }}
            ${{ env.MIRRORD_DLL }}
            ${{ env.MIRRORD_MSI }}
            ${{ env.MIRRORD_EXE }}.sha256
            ${{ env.MIRRORD_DLL }}.sha256
            ${{ env.MIRRORD_MSI }}.sha256
          if-no-files-found: error
          retention-days: 2

  update_config_docs:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [validate_release_request]
    if: needs.validate_release_request.outputs.should_release == 'true'
    permissions:
      contents: write
    env:
      TEMP_DIR_NAME: temp-docs-dir
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate_release_request.outputs.sha }}
          # The step that pushes to the `docs` branch takes the token itself.
          persist-credentials: false
          fetch-tags: true
          fetch-depth: 0
      # The docs come from the config schema's doc comments, so they only change with the schema.
      # The `latest` tag is the previous release.
      - name: Check whether the config schema changed since the last release
        id: schema
        env:
          SHA: ${{ needs.validate_release_request.outputs.sha }}
        run: |
          if git diff --quiet "latest...$SHA" -- mirrord-schema.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-bazel
        if: steps.schema.outputs.changed == 'true'
        with:
          publishes: "true"
      - if: steps.schema.outputs.changed == 'true'
        run: mkdir ${{ env.TEMP_DIR_NAME }}
      - name: Generate new GitBook files from our config
        if: steps.schema.outputs.changed == 'true'
        run: ./scripts/residency.sh # uses env.TEMP_DIR_NAME
        shell: bash
      - name: Commit to docs branch (syncs with GitBook)
        if: steps.schema.outputs.changed == 'true'
        uses: metalbear-co/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f
        with:
          folder: ${{ env.TEMP_DIR_NAME }}
          target-folder: configuration
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: docs
          clean: false # prevent SUMMARY.md in target folder from being removed
          dry-run: false
      - name: Cleanup temp files from script
        continue-on-error: true
        if: ${{ always() }}
        run: rm -rf ${{ env.TEMP_DIR_NAME }}
        shell: bash

  release_gh:
    needs:
      [
        validate_release_request,
        build_unix_and_release_images,
        verify_binaries_macos,
        build_binaries_windows,
      ]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: needs.validate_release_request.outputs.should_release == 'true'
    permissions:
      packages: write
      contents: write
      deployments: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate_release_request.outputs.sha }}
      # The artifacts hold the files under the names that the release gives them.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: /tmp/release
          pattern: +(unix|x86_64-pc-windows-msvc)
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${{ needs.validate_release_request.outputs.version }}"
          # Extract content between the version heading and the next heading
          awk -v v="${version}" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          cat /tmp/release-notes.md

      # The .shasum256 / .sha256 files next to each asset prove a download
      # arrived intact. They say nothing about origin, since anyone able to
      # replace an asset can replace the checksum beside it. This ties each
      # binary back to this workflow and commit.
      - name: Attest binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            /tmp/release/mirrord_linux_x86_64
            /tmp/release/mirrord_linux_aarch64
            /tmp/release/mirrord_mac_universal
            /tmp/release/libmirrord_layer_linux_x86_64.so
            /tmp/release/libmirrord_layer_linux_aarch64.so
            /tmp/release/libmirrord_layer_mac_universal.dylib
            /tmp/release/mirrord.exe
            /tmp/release/mirrord_layer_win.dll
            /tmp/release/mirrord.msi

      - name: Release
        uses: metalbear-co/action-gh-release@ab50eebb6488051c6788d97fa95232267c6a4e23
        with:
          tag_name: ${{ needs.validate_release_request.outputs.version }}
          target_commitish: ${{ needs.validate_release_request.outputs.sha }}
          name: ${{ needs.validate_release_request.outputs.version }}
          body_path: /tmp/release-notes.md
          files: /tmp/release/**

  update-changelog-web-docs:
    needs: [validate_release_request, release_gh]
    if: needs.validate_release_request.outputs.should_release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/changelog-update.yaml
    with:
      ref: ${{ needs.validate_release_request.outputs.sha }}
    secrets:
      CHANGELOG_PAT: ${{ secrets.CHANGELOG_PAT }}

  release_homebrew:
    needs: [validate_release_request, release_gh]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: needs.validate_release_request.outputs.should_release == 'true'
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: shasum
          path: /tmp/artifacts
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate_release_request.outputs.sha }}
      - name: Get release version and hashes
        shell: bash # for -o pipefail, see https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
        run: |
          echo "version=${{ needs.validate_release_request.outputs.version }}" >> $GITHUB_ENV
          echo "sha256_mac=$(cat /tmp/artifacts/mirrord_mac_universal.shasum256 | awk '{ print $1 }')" >> $GITHUB_ENV
          echo "sha256_linux_aarch64=$(cat /tmp/artifacts/mirrord_linux_aarch64.shasum256 | awk '{ print $1 }')" >> $GITHUB_ENV
          echo "sha256_linux_x86_64=$(cat /tmp/artifacts/mirrord_linux_x86_64.shasum256 | awk '{ print $1 }')" >> $GITHUB_ENV
      - name: Checkout into homebrew-mirrord
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: metalbear-co/homebrew-mirrord
          path: ./
          token: ${{ secrets.BREW_GITHUB_PAT }}
      - name: Update hashes and urls
        run: |
          sed -i -e 's/\([0-9]\+\.[0-9]\+\.[0-9]\+\)/${{ env.version }}/g' mirrord.rb
          sed -z -i -e 's/[0-9a-f]\{64\}/${{ env.sha256_mac }}/1' mirrord.rb
          sed -z -i -e 's/[0-9a-f]\{64\}/${{ env.sha256_linux_aarch64 }}/2' mirrord.rb
          sed -z -i -e 's/[0-9a-f]\{64\}/${{ env.sha256_linux_x86_64 }}/3' mirrord.rb
      - name: Display formula (For debugging purposes only)
        run: cat mirrord.rb
      - name: Commit to metalbear-co/homebrew-mirrord
        run: |
          git config --global user.email "eyal@metalbear.co"
          git config --global user.name "Eyal Bukchin"
          git add .
          git commit -m "Update to ${{ env.version }}"
          git push

  release_chocolatey:
    needs: [validate_release_request, release_gh]
    runs-on: windows-latest
    if: needs.validate_release_request.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate_release_request.outputs.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: x86_64-pc-windows-msvc
          path: artifacts/windows

      - name: Build and publish Chocolatey package
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ needs.validate_release_request.outputs.version }}"

          # Find the MSI file
          $msi = Get-ChildItem "artifacts/windows" -Filter "mirrord.msi" -Recurse | Select-Object -First 1
          if (-not $msi) {
            throw "MSI file not found in artifacts"
          }

          # Create Chocolatey package structure
          $pkgRoot = Join-Path $env:RUNNER_TEMP "choco"
          $toolsDir = Join-Path $pkgRoot "tools"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null

          # Copy MSI
          Copy-Item $msi.FullName (Join-Path $toolsDir "mirrord.msi") -Force

          # Copy LICENSE
          Copy-Item "LICENSE" (Join-Path $toolsDir "LICENSE.txt") -Force

          # Create VERIFICATION.txt
          $hash = Get-FileHash $msi.FullName -Algorithm SHA256
          @"
          VERIFICATION
          ------------

          1. Download the mirrord MSI from the official source:
             https://github.com/metalbear-co/mirrord/releases

          2. Verify the SHA256 checksum of the downloaded file matches:
             $($hash.Hash)

          This installer is built from the source at:
             https://github.com/metalbear-co/mirrord
          "@ | Set-Content -Encoding UTF8 -Path (Join-Path $toolsDir "VERIFICATION.txt")

          # Create nuspec file
          @"
          <?xml version="1.0"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd">
            <metadata>
              <id>mirrord</id>
              <version>$version</version>
              <title>mirrord (Kubernetes dev tool)</title>
              <summary>Run local code in the context of your Kubernetes environment.</summary>
              <authors>MetalBear</authors>
              <owners>MetalBear</owners>
              <licenseUrl>https://github.com/metalbear-co/mirrord/blob/main/LICENSE</licenseUrl>
              <projectUrl>https://github.com/metalbear-co/mirrord</projectUrl>
              <packageSourceUrl>https://github.com/metalbear-co/mirrord</packageSourceUrl>
              <projectSourceUrl>https://github.com/metalbear-co/mirrord</projectSourceUrl>
              <docsUrl>https://mirrord.dev</docsUrl>
              <bugTrackerUrl>https://github.com/metalbear-co/mirrord/issues</bugTrackerUrl>
              <iconUrl>https://raw.githubusercontent.com/metalbear-co/mirrord/main/assets/icon.png</iconUrl>
              <requireLicenseAcceptance>false</requireLicenseAcceptance>
              <description>mirrord lets you run local code in the context of your cloud environment (Kubernetes).</description>
              <releaseNotes>https://github.com/metalbear-co/mirrord/releases/tag/$version</releaseNotes>
              <tags>mirrord kubernetes debugging cloud</tags>
            </metadata>
            <files>
              <file src="tools\**" target="tools" />
            </files>
          </package>
          "@ | Set-Content -Encoding UTF8 -Path (Join-Path $pkgRoot "mirrord.nuspec")

          # Create chocolateyinstall.ps1
          @'
          $ErrorActionPreference = 'Stop'

          $packageName = 'mirrord'
          $toolsDir    = Split-Path -Parent $MyInvocation.MyCommand.Definition
          $msiPath     = Join-Path $toolsDir 'mirrord.msi'

          Install-ChocolateyInstallPackage -PackageName $packageName -FileType 'msi' -SilentArgs '/qn /norestart' -ValidExitCodes @(0, 3010) -File $msiPath
          '@ | Set-Content -Encoding UTF8 -Path (Join-Path $toolsDir "chocolateyinstall.ps1")

          # Build package
          choco pack (Join-Path $pkgRoot "mirrord.nuspec") --outputdirectory $pkgRoot

          # Find the generated nupkg
          $nupkg = Get-ChildItem $pkgRoot -Filter "mirrord.$version.nupkg" -File | Select-Object -First 1
          if (-not $nupkg) {
            $nupkg = Get-ChildItem $pkgRoot -Filter "mirrord*.nupkg" -File | Select-Object -First 1
          }
          if (-not $nupkg) {
            throw "Failed to find generated nupkg in $pkgRoot"
          }

          Write-Host "Built Chocolatey package: $($nupkg.FullName)"

          # Publish to Chocolatey
          if (-not $env:CHOCO_API_KEY) {
            throw "CHOCO_API_KEY secret is not set. Cannot publish to Chocolatey."
          }

          Write-Host "Publishing to Chocolatey..."
          choco push $nupkg.FullName --api-key $env:CHOCO_API_KEY --source "https://push.chocolatey.org/"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish to Chocolatey (exit code: $LASTEXITCODE)"
          }
          Write-Host "Successfully published to Chocolatey"

  release_winget:
    needs: [validate_release_request, release_gh]
    runs-on: windows-latest
    if: needs.validate_release_request.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate_release_request.outputs.sha }}

      - name: Install .NET runtime for wingetcreate
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Update WinGet manifest
        env:
          # Classic PAT from a bot account. A GitHub App installation token
          # can't be used here: wingetcreate opens the PR against
          # microsoft/winget-pkgs, where our app isn't (and can't be) installed.
          # A classic PAT can open a cross-fork PR to a public repo without
          # write access, which is exactly what WinGet needs.
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ needs.validate_release_request.outputs.version }}"

          # Construct MSI download URL from GitHub release
          $installerUrl = "https://github.com/metalbear-co/mirrord/releases/download/$version/mirrord.msi"
          $packageId = "MetalBear.mirrord"

          Write-Host "Updating WinGet manifest for package '$packageId' version '$version'"
          Write-Host "Installer URL: $installerUrl"

          # Validate the WinGet PAT is set
          if (-not $env:WINGET_TOKEN) {
            throw "WINGET_GITHUB_PAT is not set. Cannot publish to WinGet."
          }

          # Download wingetcreate
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

          # Update manifest and submit a PR to microsoft/winget-pkgs
          $output = & .\wingetcreate.exe update $packageId `
            --version $version `
            --urls "$installerUrl|x64|machine" `
            --submit `
            --token $env:WINGET_TOKEN 2>&1

          $exitCode = $LASTEXITCODE

          # Display output
          $output | ForEach-Object { Write-Host $_ }

          # Check for errors
          if ($exitCode -ne 0) {
            if ($output -match "was not found") {
              throw "WinGet package '$packageId' was not found in microsoft/winget-pkgs. Create the initial package manually first."
            } else {
              throw "wingetcreate update failed with exit code $exitCode"
            }
          }

          Write-Host "Successfully updated WinGet manifest"

  update_latest:
    needs: [validate_release_request, release_homebrew]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: needs.validate_release_request.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate_release_request.outputs.sha }}
          fetch-depth: 0

      - name: Update major version and latest tags in git
        uses: metalbear-co/release-tracker-action@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Move "latest" tag
          update-latest: true
          # Don't update the vX.Y tags
          update-minor: false

      - name: Update latest release on GitHub (not latest git tag).
        run: gh release edit "${{ needs.validate_release_request.outputs.version }}" --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update_infra_cli_version:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [validate_release_request, release_homebrew, update_latest]
    if: needs.validate_release_request.outputs.should_release == 'true'
    steps:
      - name: Create app token for infra workflow dispatch
        id: app_token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.CUBBY_CLIENT_ID }}
          private-key: ${{ secrets.CUBBY_PRIVATE_KEY }}
          owner: metalbear-co
          repositories: infra
          permission-actions: write

      - name: Dispatch infra update-cli-version workflow
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail

          gh api \
            --method POST \
            repos/metalbear-co/infra/actions/workflows/update-cli-version.yml/dispatches \
            -f ref=main \
            -f inputs[cli_version]=${{ needs.validate_release_request.outputs.version }}

  linear_release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    needs: [validate_release_request, release_homebrew, update_latest]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: ${{ needs.validate_release_request.outputs.sha }}
          fetch-depth: 0 # Required for commit history

      - uses: metalbear-co/linear-release-action@76a250988b9470b152ec13d24d661140084042c1
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          version: ${{ needs.validate_release_request.outputs.version }}
          name: ${{ needs.validate_release_request.outputs.version }}
