# `issue_comment` rather than `pull_request`: it runs from the default branch with secrets
# available, which is what makes an approval command safe to expose on fork pull requests. Fork code
# never runs here, and nothing happens at all unless someone deliberately asks for it.
name: Jev auto-approve

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  auto-approve:
    # Running the command is an org member delegating a review they could have done by hand, so the
    # commenter's association is what is checked. The author's is deliberately not: approving an
    # outside contribution this way is a call the member makes.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/jev-approve') &&
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The pull request, its discussion, and its diff are read with the workflow token; the review
      # itself is submitted by the app token below.
      pull-requests: read
    steps:
      - name: Get token for the cubby-mb app
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.CUBBY_CLIENT_ID }}
          private-key: ${{ secrets.CUBBY_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Ask Jev whether this needs a human
        uses: metalbear-co/jev-auto-approve@6c1afaa35ef3de29df188714a98e9e51a3786e68
        with:
          jev-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          # An app installation token has no user identity, so `approver` is deliberately unset.
          approve-token: ${{ steps.app-token.outputs.token }}
          confidence-threshold: '0.95'
          # Both sides of the answer, so what `yes` covers is stated rather than implied. An
          # interface change is weighed here rather than vetoed; privileged automation is not.
          criteria: |
            {
              "false": "No: the change is verified, and how far it reaches is understood. Behaviour that changed is covered by tests that were added or updated, or by manual testing the pull request records. Where a human has already reviewed it, what they raised was addressed - in the code, or in an answer that holds up. Where the change reaches past this repository - the mirrord config schema, CLI flags or their behaviour, the agent/layer protocol, the public API of a published crate - it is small and deliberate, and the pull request accounts for the callers it affects. Any user-visible change carries a changelog fragment under changelog.d/. Nothing in it touches privileged automation.",
              "true": "Yes: something about the change is unsettled, or it reaches somewhere no machine should sign off. Behaviour changed with neither tests nor a record of manual testing. Or something raised in review is unaddressed, or answered in a way that does not hold up. Or the change alters something others depend on - config schema, CLI flags, the agent/layer protocol, a published crate's public API - and the consequences for them are not accounted for. Or a user-visible change has no changelog fragment under changelog.d/. Or it touches privileged automation: anything under .github/, the release, publishing, signing or credential configuration, or anything else running with write-capable credentials, whatever else the change does. Or the pull request does not show enough to tell which of these is the case."
            }
