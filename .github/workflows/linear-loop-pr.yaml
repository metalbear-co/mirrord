name: Linear loop pull requests

# `pull_request_target` runs this file from the base branch of the pull request, and another base
# branch could carry its own copy of the script. The job therefore only handles pull requests into
# the default branch and takes its script from there. Nothing from the pull request is checked out.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: linear-loop-pr-${{ github.event.pull_request.number }}-${{ github.event.action }}
  cancel-in-progress: false

jobs:
  route:
    if: >-
      github.event.pull_request.user.login == 'linear-code[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'linear/') &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Route the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_TOKEN: ${{ secrets.LINEAR_LOOP_REVIEW_TOKEN }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LINEAR_APP_CLIENT_ID: ${{ secrets.LINEAR_APP_CLIENT_ID }}
          LINEAR_APP_CLIENT_SECRET: ${{ secrets.LINEAR_APP_CLIENT_SECRET }}
        run: .github/scripts/linear-loop-pr.sh
