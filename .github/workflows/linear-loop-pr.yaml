name: Linear loop pull requests

# `pull_request_target` takes this file and the checkout from the default branch, whatever the base
# branch of the pull request is. Nothing from the pull request is checked out.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: linear-loop-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  route:
    if: >-
      github.event.pull_request.user.login == 'linear-code[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'linear/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      # The workflow token cannot see the organization's teams, so the cubby-mb app requests the review.
      # This step fails while the app cannot read the organization's members, and the script then skips
      # the review request.
      - name: Get a token that can request a team review
        id: review-token
        continue-on-error: true
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.CUBBY_CLIENT_ID }}
          private-key: ${{ secrets.CUBBY_PRIVATE_KEY }}
          permission-members: read
          permission-pull-requests: write
      - name: Route the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_TOKEN: ${{ steps.review-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LINEAR_APP_CLIENT_ID: ${{ secrets.LINEAR_APP_CLIENT_ID }}
          LINEAR_APP_CLIENT_SECRET: ${{ secrets.LINEAR_APP_CLIENT_SECRET }}
        run: .github/scripts/linear-loop-pr.sh
