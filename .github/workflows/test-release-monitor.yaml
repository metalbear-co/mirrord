name: Test Release Monitor

on:
  pull_request:
    paths:
      - '.github/scripts/release-monitor*.cjs'
      - '.github/workflows/releases-test.yaml'
      - '.github/workflows/test-release-monitor.yaml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: node --test .github/scripts/release-monitor.test.cjs
