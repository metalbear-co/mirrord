# Only modules that enable `large_stack_frames` use this, such as `mirrord-layer-core`'s `envp`,
# which runs in the `execve` hook on the ~32 KiB stack of a `posix_spawn` child (see
# `mirrord/layer/core/src/envp.rs`). Clippy's default of about 500 KB is too large to catch
# anything there.
#
# The value applies to every module that enables the lint, so revisit it when:
# - `large_stack_frames` or `clippy::nursery` is enabled for a whole crate or the workspace (for
#   example in `[workspace.lints.clippy]`, a crate's `[lints]`, or a crate-root `#![warn]`). Code
#   running on regular thread stacks (MiB-sized) would then be held to 4 KiB.
# - A module whose code runs on a regular thread stack enables the lint for its own reasons. That
#   module needs a different threshold, which this file can't express per module; give its crate
#   its own `.clippy.toml` instead, copying everything here into it, since clippy reads only the
#   nearest config.
# - The stack budget of the code that uses it changes, such as the libc's `posix_spawn` child
#   stack size, or the hook running in another constrained context.
stack-size-threshold = 4096
