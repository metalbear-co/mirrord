[package]
name = "mirrord-tui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Terminal UI for mirrord"
repository = "https://github.com/metalbear-co/mirrord-tui"
publish = false

[dependencies]
anyhow = "1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3"
http = "1"
humantime = "2"
k8s-openapi = { version = "0.28", features = ["v1_32"] }
kube = {
    git = "https://github.com/metalbear-co/kube.git",
    rev = "6cbb2e8bef0b905edcecc7e0cf8e1804f7b02c67",
    default-features = false,
    features = [
        "runtime",
        "derive",
        "client",
        "ws",
        "rustls-tls",
        "aws-lc-rs",
        "oidc",
        "socks5",
        "http-proxy",
    ],
}
mirrord-config = { git = "https://github.com/metalbear-co/mirrord.git", tag = "3.249.0" }
mirrord-kube = { git = "https://github.com/metalbear-co/mirrord.git", tag = "3.249.0" }
mirrord-operator = { git = "https://github.com/metalbear-co/mirrord.git", tag = "3.249.0", default-features = false, features = ["crd"] }
mirrord-session-monitor-client = { git = "https://github.com/metalbear-co/mirrord.git", tag = "3.249.0" }
mirrord-session-monitor-protocol = { git = "https://github.com/metalbear-co/mirrord.git", tag = "3.249.0" }
ratatui = "0.30.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
strum = { version = "0.28", features = ["derive"] }
throbber-widgets-tui = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-term = "0.3.4"
vt100 = "0.16"

# For redirecting the stderr that auth exec plugins inherit, and — on macOS, which has no `/proc` to
# read it from — for reading a process's parent.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
