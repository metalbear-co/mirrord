  # pgBranchConfig:
  ## example
  ##
  ## dbPod:
  ##   image:
  ##     # Registry for the PostgreSQL branch container.
  ##     # Defaults to `docker.io/library/postgres`.
  ##     # Tag can be specified by the user when requesting a new branch, defaulting to `17`.
  ##     registry: "custom-postgres-registry"
  ##   initImage:
  ##     # Registry for the PostgreSQL branch initContainer image.
  ##     # Defaults to `docker.io/library/postgres`.
  ##     # Tag can be specified by the user when requesting a new branch, defaulting to `17`.
  ##     registry: "custom-postgres-registry"
  ##   migrationImages:
  ##     # Registry per schema-migration tool, used by the matching `migrations.flavor`.
  ##     # When unset, each defaults to its upstream image; when set, the registry is used
  ##     # with that tool's pinned tag. The per-branch `migrations` config in mirrord.json
  ##     # can override the full image.
  ##     flyway:
  ##       # Defaults to `flyway/flyway:12`; a registry here is used with the tag `12`.
  ##       registry: "custom-flyway-registry"
  ##     liquibase:
  ##       # Defaults to `liquibase/liquibase:4.33`; a registry here is used with the tag `4.33`.
  ##       registry: "custom-liquibase-registry"
  ##   # Environment for container-flavor migration Jobs. `inherit` (default true) hands the
  ##   # Job the target container's env and envFrom, so an app image boots the same way its
  ##   # real pods do; `env`/`envFrom` are admin extras in plain Kubernetes shapes, so
  ##   # `valueFrom`/`secretRef` keep secret values in-cluster. Admin entries override
  ##   # inherited ones by name, but never the operator's redirect of the declared connection
  ##   # vars to the branch; the per-branch `migrations.env` in mirrord.json overrides
  ##   # everything. Available on every `<db>BranchConfig`.
  ##   migrationEnv:
  ##     inherit: true
  ##     env:
  ##       - name: RAILS_ENV
  ##         value: development
  ##     envFrom:
  ##       - configMapRef:
  ##           name: shared-migration-config
  ##   # Glob patterns of images users may run as branch pods via the per-branch `image`
  ##   # field in mirrord.json (which overrides the registry configured above). When this
  ##   # list is absent, all images are allowed. Available on every `<db>BranchConfig`.
  ##   allowedImages:
  ##     - "registry.example.com/postgresql:*"
  ##     - "docker.io/library/postgres:*"
  ##   # Image pull secrets for the PostgreSQL branch pod.
  ##   # The pod will use following images:
  ##   # * .pgBranchConfig.dbPod.image
  ##   # * .pgBranchConfig.dbPod.initImage
  ##   # * .pgBranchConfig.dbPod.migrationImages.flyway
  ##   # * .pgBranchConfig.dbPod.migrationImages.liquibase
  ##   # * .operator.image
  ##   imagePullSecrets:
  ##     - name: "postgres-registry-secret"
  ##   # Image pull policy for all .pgBranchConfig.dbPod images (db, init, and migration).
  ##   imagePullPolicy: "IfNotPresent"
  ##   labels: { "role": "database" }
  ##   annotations: { "db.branch/owner-team": "platform" }
  ##   # How the branch pod's data and init (dump) volumes are backed. By default each
  ##   # branch gets its own PersistentVolumeClaims on the cluster's default StorageClass,
  ##   # deleted together with the branch; on clusters without a default StorageClass,
  ##   # branches fall back to node-local emptyDir. Available on every `<db>BranchConfig`.
  ##   storage:
  ##     # `pvc` (default) or `emptyDir` (node-local scratch space, capped by
  ##     # `operator.dbBranching.*PodVolumeLimit`).
  ##     kind: "pvc"
  ##     # StorageClass for the branch PVCs. Unset means the cluster's default.
  ##     storageClassName: "fast-ssd"
  ##     # Requested per-branch PVC sizes. Default to `operator.dbBranching.databasePvcSize`
  ##     # / `initPvcSize` (20Gi each). The dump staged on the init volume is roughly the
  ##     # size of the copied data.
  ##     dataSize: "50Gi"
  ##     initSize: "50Gi"
  ##     # PVC access modes, defaulting to ReadWriteOnce.
  ##     accessModes: ["ReadWriteOnce"]
  ##   # An explicit volume overrides `storage` entirely and is used as given.
  ##   volume:
  ##     name: "pg-data"
  ##     emptyDir:
  ##       sizeLimit: "1Gi"
  ##   resources:
  ##     requests:
  ##       cpu: "500m"
  ##       memory: "512Mi"
  ##     limits:
  ##       cpu: "1"
  ##       memory: "1Gi"
  ##   # How branch pods recreate the source database's roles.
  ##   # `empty` (default): NOLOGIN shell roles, just enough for the schema restore.
  ##   # `full`: real role attributes (LOGIN, ...) and role memberships, and the data copy
  ##   # keeps table ownership and grants, so the branch enforces the same permissions as
  ##   # the source. The user declared in the branch's connection config keeps its real
  ##   # password on the branch (as a salted hash); PostgreSQL never exposes other roles'
  ##   # passwords, so those restore without one.
  ##   roles: "empty"
  ##   # Client authentication on branches whose source uses IAM auth.
  ##   # `trust` (default): the branch accepts any credentials - IAM apps present
  ##   # cloud-minted tokens a plain postgres branch cannot verify, and trust is what
  ##   # lets them connect unchanged.
  ##   # `password`: regular password auth; IAM apps must then read the branch
  ##   # password from an env var mirrord injects (the `password` connection param).
  ##   # Branches without `iam_auth` always use password auth.
  ##   iamBranchAuth: "trust"
  ##   # Extra flags for the branch's postgres server, passed as the container's args. The
  ##   # official image's entrypoint hands them to the server, so an image that replaces that
  ##   # entrypoint may not pick them up. Any file a flag points at (TLS certs below) must
  ##   # exist in the image, and the entrypoint's temporary server that restores the copied
  ##   # data runs with the same flags. Keep the listener on 5432 - the seeding init
  ##   # container, schema migrations, and the operator all connect there.
  ##   dbServerArgs:
  ##     - "-c"
  ##     - "ssl=on"
  ##     - "-c"
  ##     - "ssl_cert_file=/etc/ssl/certs/server.pem"
  ##     - "-c"
  ##     - "ssl_key_file=/etc/ssl/private/server.key"
  ##
  ## Named profiles: alternative complete baselines next to the default `dbPod` above,
  ## selected per branch with `"profile": "<name>"` in mirrord.json. A profile accepts
  ## the same fields as `dbPod` (registries, migrationImages, allowedImages, pull
  ## secrets, resources, ...) and is not an overlay - fields left unset get the built-in
  ## defaults, not the values from the default `dbPod`. Available on every
  ## `<db>BranchConfig`.
  ##
  ## `allowedImages` is the one field a profile inherits when it does not set its own
  ## list, because an unset list means "any image is allowed" and a profile added for an
  ## unrelated reason should not quietly widen your image policy. Set
  ## `allowedImages: ["*"]` in a profile to allow anything on purpose, or `[]` to allow
  ## no user-supplied images at all.
  ##
  ## profiles:
  ##   team-analytics:
  ##     dbPod:
  ##       image:
  ##         registry: "pgvector/pgvector"
  ##       initImage:
  ##         registry: "pgvector/pgvector"
  ##       migrationImages:
  ##         flyway:
  ##           registry: "custom-flyway-registry"
  ##         liquibase:
  ##           registry: "custom-liquibase-registry"
  ##       allowedImages: ["pgvector/*"]
  ##       imagePullSecrets:
  ##         - name: "analytics-registry-secret"

