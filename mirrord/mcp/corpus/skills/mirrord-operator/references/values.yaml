  # redisBranchConfig:
  ## example
  ##
  ## dbPod:
  ##   image:
  ##     registry: "docker.io/library/redis"
  ##   imagePullSecrets:
  ##     - name: "redis-registry-secret"
  ##   imagePullPolicy: "IfNotPresent"
  ##   labels: { "role": "database" }
  ##   annotations: { "db.branch/owner-team": "platform" }
  ##   # An explicit volume overrides the default per-branch PVC backing; see `storage`
  ##   # under pgBranchConfig (available on every `<db>BranchConfig`).
  ##   volume:
  ##     name: "redis-data"
  ##     emptyDir:
  ##       sizeLimit: "1Gi"
  ##   resources:
  ##     requests:
  ##       cpu: "500m"
  ##       memory: "512Mi"
  ##     limits:
  ##       cpu: "1"
  ##       memory: "1Gi"
  ##
  ## For a custom image with TLS baked in, keep the TLS listener on 6379 and
  ## disable the plaintext one; `tls: true` makes the operator (seeding and the
  ## connection URL handed to the app) use rediss://.
  ##
  ##   dbServerArgs:
  ##     - "--tls-port"
  ##     - "6379"
  ##     - "--port"
  ##     - "0"
  ##     - "--tls-cert-file"
  ##     - "/certs/tls.crt"
  ##     - "--tls-key-file"
  ##     - "/certs/tls.key"
  ##     - "--tls-auth-clients"
  ##     - "no"
  ##   tls: true
  ##
  ## Named profiles let one cluster hold several complete pod baselines at once
  ## (e.g. a TLS setup and a plain one). Users select one per branch with
  ## `"profile": "<name>"` in their mirrord config; without it, the top-level
  ## dbPod applies. A profile is a complete dbPod (same fields as above), not an
  ## overlay - fields left unset get the built-in defaults, never the top-level
  ## values. The exception is `allowedImages`, which a profile inherits unless it
  ## sets its own list, so adding a profile never quietly widens your image policy;
  ## use `allowedImages: ["*"]` to allow anything on purpose, or `[]` to allow no
  ## user-supplied images. Every <db>BranchConfig supports `profiles`, not just Redis.
  ##
  ## profiles:
  ##   tls-baseline:
  ##     dbPod:
  ##       allowedImages:
  ##         - "registry.example.com/team/redis-tls:*"
  ##       dbServerArgs:
  ##         - "--tls-port"
  ##         - "6379"
  ##         - "--port"
  ##         - "0"
  ##         - "--tls-cert-file"
  ##         - "/certs/tls.crt"
  ##         - "--tls-key-file"
  ##         - "/certs/tls.key"
  ##       tls: true
  ##
  ## Profile settings live under the profile's `dbPod` key. A key placed beside
  ## `dbPod` (e.g. `profiles.tls-baseline.tls`) is not a valid setting, and a
  ## branch selecting that profile fails with an error naming the misplaced key.
  ##
  ## For `copy.mode: all` against a source Redis that only accepts TLS, provide
  ## the certificates via a `MirrordPropertyList` named `redis-source-tls` in the
  ## target's namespace - not via chart values - with the same properties as
  ## `cockroachdb-source-tls` under cockroachdbBranchConfig below. The object
  ## name can be overridden with `dbPod.sourceTlsPropertyList: "my-name"`.
  ##
  ## `dbPod.sourceSslmode` sets how strictly the copy verifies the source's certificate:
  ## `verify-full` (chain and hostname, the default) or `verify-ca` (chain only). Use
  ## `verify-ca` when the source certificate has no subjectAltName covering the host the
  ## branch dials, where `verify-full` can never pass and `#insecure` in the URL would skip
  ## the chain check too. It only applies to TLS connections (the property list or a
  ## `rediss://` URL decide that) and `#insecure` still wins over it:
  ##
  ##   dbPod:
  ##     sourceSslmode: "verify-ca"

