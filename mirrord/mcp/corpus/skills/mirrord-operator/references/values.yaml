  # cockroachdbBranchConfig:
  ## example
  ##
  ## dbPod:
  ##   image:
  ##     # Registry for the CockroachDB branch container.
  ##     # Defaults to `docker.io/cockroachdb/cockroach`.
  ##     # Tag can be specified by the user when requesting a new branch, defaulting to `latest-v26.2`.
  ##     registry: "custom-cockroachdb-registry"
  ##   initImage:
  ##     # Registry for the CockroachDB branch initContainer image.
  ##     # Defaults to `docker.io/cockroachdb/cockroach`.
  ##     registry: "custom-cockroachdb-registry"
  ##   imagePullSecrets:
  ##     - name: "cockroachdb-registry-secret"
  ##   imagePullPolicy: "IfNotPresent"
  ##   labels: { "role": "database" }
  ##   annotations: { "db.branch/owner-team": "platform" }
  ##   # An explicit volume overrides the default per-branch PVC backing; see `storage`
  ##   # under pgBranchConfig (available on every `<db>BranchConfig`).
  ##   volume:
  ##     name: "cockroachdb-data"
  ##     emptyDir:
  ##       sizeLimit: "1Gi"
  ##   resources:
  ##     requests:
  ##       cpu: "500m"
  ##       memory: "512Mi"
  ##     limits:
  ##       cpu: "1"
  ##       memory: "1Gi"
  ##
  ## Sources behind certificate verification (sslmode=verify-ca/verify-full against a
  ## private CA) or mTLS are supported via a `MirrordPropertyList` named
  ## `cockroachdb-source-tls` in the target's namespace - not via chart values - so each
  ## namespace can point at its own cert Secret. The object name can be overridden with
  ## `dbPod.sourceTlsPropertyList: "my-name"`. tlsClientCert/tlsClientKey must be set
  ## together and are omitted when the source only needs a trusted CA (tlsCaCert):
  ##
  ##   apiVersion: mirrord.metalbear.co/v1
  ##   kind: MirrordPropertyList
  ##   metadata:
  ##     name: cockroachdb-source-tls
  ##     namespace: my-app-namespace
  ##   spec:
  ##     properties:
  ##       - name: tlsCaCert
  ##         valueFrom:
  ##           secretKeyRef: { name: my-db-certs, key: ca.crt }
  ##       - name: tlsClientCert
  ##         valueFrom:
  ##           secretKeyRef: { name: my-db-certs, key: client.myservice.crt }
  ##       - name: tlsClientKey
  ##         valueFrom:
  ##           secretKeyRef: { name: my-db-certs, key: client.myservice.key }
  ##
  ## `dbPod.sourceSslmode` sets a cluster-wide default sslmode for the copy connection to
  ## the source. An explicit sslmode in a session's connection URL or params still wins.
  ## Without it the default is verify-full when the property list provides certs, disable
  ## otherwise. Note verify-ca/verify-full still need the property list - without a CA the
  ## copy fails rather than silently downgrading:
  ##
  ##   dbPod:
  ##     sourceSslmode: "verify-full"
  ##
  ## `dbPod.sourceConfigMap` sets the ConfigMap that `configmap` connection param sources
  ## read when a session's param names none itself: a `configMap` volume of the target
  ## pod (`volume`) or a ConfigMap name (`name`), plus an optional data `key`. Developers
  ## then write only the selector per param. Works on the default `dbPod` and on profiles:
  ##
  ##   profiles:
  ##     app-config:
  ##       dbPod:
  ##         sourceConfigMap:
  ##           volume: app-config
  ##           key: config.yml

  # genericBranchConfig:
  ## example
  ##
  ## Generic branches always run a user-supplied image (see the `genericBranching` flag
  ## note above), so `allowedImages` is the main lever here. `image`/`initImage`
  ## registries, `dbServerArgs`, `tls`, and default volumes are not consulted for generic
  ## branches - the user's image, command, and args are used as given.
  ##
  ## dbPod:
  ##   allowedImages:
  ##     - "valkey/*"
  ##     - "influxdb:*"
  ##   imagePullSecrets:
  ##     - name: "generic-registry-secret"
  ##   imagePullPolicy: "IfNotPresent"
  ##   labels: { "role": "database" }
  ##   annotations: { "db.branch/owner-team": "platform" }
  ##   resources:
  ##     requests:
  ##       cpu: "250m"
  ##       memory: "256Mi"
  ##     limits:
  ##       cpu: "1"
  ##       memory: "1Gi"
  ##
  ## Named profiles work here like for every other database type: keep the default
  ## locked with `allowedImages: []` and grant each team its own images, pull secrets,
  ## and resource budget. Users select one per branch with `"profile": "<name>"`.
  ## A profile that does not set `allowedImages` inherits the default's, so with a
  ## locked default a profile only ever runs the images it lists itself.
  ##
  ## A profile can additionally carry the whole engine setup, so a user's mirrord.json
  ## shrinks to type/id/profile/connection:
  ##
  ## - `dbPod.branch` supplies branch-container defaults (image, port, command, args,
  ##   env, readiness). A value set in the user's mirrord.json wins per field.
  ## - `dbPod.copy` supplies a one-shot copy Job: an image you author that copies
  ##   schema/data from the source into the branch before it turns Ready. The Job's env
  ##   carries the same `MIRRORD_PARAM_*` vars as the branch container (the source
  ##   connection) plus `MIRRORD_BRANCH_HOST`/`MIRRORD_BRANCH_PORT` (where to write).
  ##   A `copy` in the user's mirrord.json wins over the profile's, and the copy runs at
  ##   most once per branch. The copy image also goes through `allowedImages`. If your
  ##   cluster uses NetworkPolicies, the Job (in the target's namespace) must be able to
  ##   reach both the source database and the branch pod's IP.
  ##
  ## Both fields are engine-specific, so they are only honored inside a named profile -
  ## a generic branch that uses no profile fails when the default-level `dbPod` sets
  ## them (users wanting an empty branch would have no opt-out otherwise).
  ##
  ## profiles:
  ##   team-search:
  ##     dbPod:
  ##       allowedImages:
  ##         - "registry.example.com/search/*"
  ##       imagePullSecrets:
  ##         - name: "search-registry-secret"
  ##       resources:
  ##         limits:
  ##           memory: "2Gi"
  ##   opensearch-full:
  ##     dbPod:
  ##       allowedImages:
  ##         - "opensearchproject/*"
  ##         - "registry.example.com/dbtools/*"
  ##       branch:
  ##         image: "opensearchproject/opensearch:2.19.1"
  ##         port: 9200
  ##         env: { "discovery.type": "single-node" }
  ##       copy:
  ##         image: "registry.example.com/dbtools/opensearch-copy:1.0"
  ##         command: ["./copy.sh"]
  ##         args: ["--mode=all"]

agent:
  ## example
  ##
  ## image:
  ##   registry: "your-internal.registry.io/metalbear-co/agent"
  ##   tag: "latest"
  ##
  ## or
  ##
  ## image: "your-internal.registry.io/metalbear-co/agent:latest"
  ##
  # image:
  # registry: "ghcr.io/metalbear-co/mirrord"
  # tag: "latest"

  # If you want the operator to secure agent connections with TLS, set this value to true.
  # This option requires agent version at least 3.97.0.
  tls: false

  # Configure whether the agent should inject headers by default.
  # If `agent.extraConfig.inject_headers` is set, it takes precedence.
  # Agent headers mark whether request went thru the agent or not,
  # and if they were stolen or handled by original pod
  injectHeaders: true

  # If you want the agents to accept operator connections on some predefined port,
  # you can set it here. If you don't set anything, each agent will be assigned with a random high port.
  # port: 9999

  ## CPU and memory requests and limits for agent pods (not applied to ephemeral agents).
  ## These defaults match the agent's own built-in defaults; when this block is set it replaces
  ## them entirely. If `agent.extraConfig.resources` is set, it takes precedence over this block.
  ##
  ## Every quantity is optional. Set one to `null` (`agent.resources.limits.cpu: null`), or a whole
  ## block to `null` (`agent.resources.limits: null`), and it is left out of the agent pod spec
  ## entirely - for example to run agents without a CPU limit so they are never throttled.
  # resources:
  #   requests:
  #     cpu: 1m
  #     memory: 1Mi
  #   limits:
  #     cpu: 300m
  #     memory: 100Mi

  # Define additional environment variables for agent pods.
  extraEnv: {}

  priorityClass:
    # Whether to create a PriorityClass for agent pods.
    create: true
    # PriorityClass name to create/use for agent pods.
    # When empty and create=true, defaults to "mirrord-agent-pod".
    # When empty and create=false, no priority class is set on the agent.
    name: mirrord-agent-pod
    # Integer priority value assigned to the class.
    value: 1000000000
    # Whether this class should be the cluster default.
    globalDefault: false
    # Pod preemption policy for this class.
    preemptionPolicy: PreemptLowerPriority
    # Description shown on the class object.
    description: "Priority class for mirrord agent pods."

  ## use this if you want to add settings that aren't covered by the values.yaml
  ## see possible settings here: https://mirrord.dev/docs/reference/configuration/#root-agent
  extraConfig:
  #  json_log: false
  #  labels: { "user": "meow" }
  #  annotations: { "cats.io/inject": "enabled" }
  #  tolerations:
  #    - operator: Exists
  #  privileged: true

license:
  ## ID of a Google Secret Manager secret containing the license PEM file.
  ##
  ## If provided, the operator will fetch the license file from this secret.
  ##
  ## To access the secret, the operator will use Application Default Credentials.
  ## The easiest way to provide credentials is by allowing the operator's
  ## Kubernetes ServiceAccount to impersonate a GCP service account.
  ## This can be done with `.sa.gcpSa` setting.
  # pemGsmRef: "projects/PROJECT_ID/secrets/SECRET_NAME/versions/SECRET_VERSION"

  ## ID of a Google Secret Manager secret containing the license key.
  ##
  ## If provided, the operator will fetch the license key from this secret.
  ##
  ## Uses the same authentication behavior described for `pemGsmRef` above.
  # keyGsmRef: "projects/PROJECT_ID/secrets/SECRET_NAME/versions/SECRET_VERSION"

  key: ""

  file:
    secret: mirrord-operator-license
    # data:
    #   license.pem:
  keyRef: ""
  pemRef: ""

  # For air-gapped systems there is an option to use a license-server for enterprise licenses.
  # This must be an accessible endpoint from where the operator is installed
  # (can be in cluster or not and via any ingress or node-port as long as communication is possible via http/https)
  #
  # licenseServer: http://mirrord-operator-license-server.mirrord.svc

  # For enterprise licenses the operator can allow usage for more than the max amount of seats.
  #
  # Set this value to `false` to disable this allowance to go over the max seats count.
  allowSeatOverages: true

# Cloud API key — the default credential the operator uses to authenticate to the mirrord cloud
# (RFC 0008). The operator exchanges it (via app.metalbear.com) for a short-lived token and uses
# that token to obtain its license and make its other cloud calls over the API. It is intended to
# replace the standalone license key as the primary credential; existing installs that set only
# `license.*` keep working via license-key authentication.
#
# Not used when `license.licenseServer` is set: such an operator authenticates only against that
# license server, never against the cloud, so the key is ignored and a license source is required.
#
# Provide the key through exactly one of the following:
cloud:
  apiKey:
    ## Direct value (simplest for dev/test; the value lands as plaintext in the pod spec).
    key: ""
    ## Reference to an existing Kubernetes secret holding the key under the `apiKey` data key.
    keyRef: ""
    ## ID of a secret in Google Secret Manager (used by us and by customers on GCP). Accessed
    ## via Application Default Credentials, like `license.gsmRef` (see `.sa.gcpSa`).
    # gsmRef: "projects/PROJECT_ID/secrets/SECRET_NAME/versions/SECRET_VERSION"
    gsmRef: ""

  ## When true, the operator keeps sending only anonymized telemetry to the mirrord cloud even
  ## when its cloud API key carries identity consent.
  anonymizeData: false

service:
  name: mirrord-operator

sa:
  ## Whether the chart should create the operator ServiceAccount.
  ## Set to `false` to use an existing ServiceAccount named by `sa.name`.
  create: true

  ## Name of the ServiceAccount used by the operator Deployment and RBAC bindings.
  name: mirrord-operator

  ## AWS role ARN to use for IAM role assumption.
  # roleArn: arn:aws:iam::111122223333:role/mirrord-operator-role
  ## GCP service account to impersonate.
  # gcpSa: <iam-sa-name>@<iam-sa-project-id>.iam.gserviceaccount.com
  ## Azure Managed Identity client ID for AKS Workload Identity.
  ## When set, the operator pod gets the azure.workload.identity/use label.
  ## If `sa.create` is true, the ServiceAccount also gets the
  ## azure.workload.identity/client-id annotation. The Workload Identity webhook
  ## then injects Azure credentials (AZURE_CLIENT_ID, AZURE_TENANT_ID,
  ## AZURE_FEDERATED_TOKEN_FILE) into the operator pod automatically.
  # azureClientId: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

tls:
  secret: mirrord-operator-tls

  # Set to `true` to mount the secret named by `tls.secret` without the chart
  # creating it. Use this when the TLS secret is provisioned out-of-band (e.g. by
  # an ExternalSecret or another controller). When `true`, `tls.data` and
  # `tls.certManager` are ignored.
  useExistingSecret: false

  # if you're using a verified certificate, set this value to false.
  apiService:
    insecureSkipTLSVerify: true

  # if certmanager is disabled and no tls.key and tls.crt is set,
  # the operator will generate a self-signed certificate.
  certManager:
    enabled: false
    createIssuer: true

    issuer: mirrord-operator-issuer
    certificate: mirrord-operator-tls

  data:
    tls.key: ""
    tls.crt: ""

# if you run on OpenShift, set this value to true to get a SCC in the yaml.
openshift: false
