# Default values for mirrord-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

namespace: mirrord

## Whether we should create the namespace or not
## If you set this to false, you must create the namespace manually
createNamespace: true

## For each namespace you'd like a namespaced role to be created in, add here.
## The chart will create a role that is required to use mirrord in the namespace
## and it can be bound via rolebinding (That you need to create yourself).
roleNamespaces: []

## Additional Kubernetes resources to create with the chart. Entries are rendered as templates,
## so they can reference chart values and release information.
extraObjects: []

role:
  # Note there's a cluster role version of it below.
  mirrord-operator-user:
    # add labels to the role, for i.e aggregate RBAC
    labels: {}

clusterRole:
  mirrord-operator-user-basic:
    # add labels to the role, for i.e aggregate RBAC
    labels: {}
  mirrord-operator-user:
    # add labels to the role, for i.e aggregate RBAC
    labels: {}
  mirrord-operator-ci:
    # add labels to the role, for i.e aggregate RBAC
    labels: {}

operator:
  image: ghcr.io/metalbear-co/operator

  # Number of replicas of the operator's deployment.
  # At all times, only one of the replicas acts as the leader and serves mirrord sessions.
  # Additional replicas remain in a standby mode,
  # ready to resume the work in case the leader exits (e.g. due to node failure).
  replicas: 1

  # How long Kubernetes waits for an operator pod to exit after asking it to stop.
  # The operator drains its tasks and then releases leadership, needing a little
  # over 20 seconds.
  terminationGracePeriodSeconds: 25

  # Override the pull policy, useful for local development.
  # imagePullPolicy: Always

  # Set this value to specify a tag to use instead of the `appVersion`.
  # imageTag: test

  podAnnotations: {}
  podLabels: {}

  ## Custom labels to be added to all Kubernetes resources created by this chart.
  ## These labels will be applied to higher-level resources like Deployments, Services, etc.
  ## For pod-specific labels, use operator.podLabels instead.
  ## Example:
  ## labels:
  ##   team: platform
  labels: {}

  ## Custom annotations to be added to all Kubernetes resources created by this chart, except the
  ## CustomResourceDefinitions. Those are left unannotated so that an ordering hint set here cannot
  ## delay them past the workloads that depend on them.
  ## For pod-specific annotations, use operator.podAnnotations instead.
  ## GitOps tools read annotations off the resources themselves, so this is where a sync-wave or a
  ## similar ordering hint belongs; podAnnotations never leaves the pod template.
  ## Example:
  ## annotations:
  ##   argocd.argoproj.io/sync-wave: "1"
  annotations: {}

  ## Optional human-friendly name for this cluster.
  ## When set, it is reported on the operator's startup telemetry events, so the cluster shows up
  ## with a recognizable label (instead of only an opaque identifier) in the license server and in
  ## the mirrord cloud. Leave unset to omit it.
  # clusterName: "staging-us-east"

  jsonLog: true
  # Require Kubernetes front-proxy client certificates on operator API routes.
  # The operator validates the certificate chain using the front-proxy CA from the cluster's
  # extension-apiserver-authentication configmap. Disable this only for environments where
  # requests reach the operator without kube-apiserver/front-proxy client certificates, for
  # example local development, custom API routing, or debugging through traffic interception.
  requireFrontProxyClientCert: true

  # Define additional environment variables for the operator. Note that variables which reference
  # other variables must be defined _after_ those that they reference, as variables are added to
  # the manifest in order.
  extraEnv:
  #   MY_ENV_VAR: "value"
  #   HOST_IP:
  #     valueFrom:
  #       fieldRef:
  #         fieldPath: status.hostIP
  #   MY_REFERENCED_VAR: "$(HOST_IP):$(MY_ENV_VAR)"

  # Define additional volume mounts for the operator container.
  # extraVolumeMounts:
  #   - name: my-secret
  #     mountPath: /etc/my-secret
  #     readOnly: true

  # Define additional volumes for the operator deployment.
  # extraVolumes:
  #   - name: my-secret
  #     secret:
  #       secretName: my-secret

  # Has to be set to `true` in order to use the SQS queue splitting feature.
  sqsSplitting: false
  # Has to be set to `true` in order to use the Kafka queue splitting feature.
  kafkaSplitting: false
  # Has to be set to `true` in order to use the RabbitMQ queue splitting feature.
  rmqSplitting: false
  # Has to be set to `true` in order to use the GCP Pub/Sub queue splitting feature.
  gcpPubsubSplitting: false
  # Has to be set to `true` in order to use the Azure Service Bus queue splitting feature.
  azureServiceBusSplitting: false
  # Has to be set to `true` in order to use the Redis Pub/Sub queue splitting feature.
  redisPubsubSplitting: false
  # Has to be set to `true` in order to use the Temporal queue splitting feature.
  temporalSplitting: false
  # Has to be set to `true` in order to use the BullMQ queue splitting feature.
  bullmqSplitting: false
  # Has to be set to `true` in order to use the NATS queue splitting feature.
  natsSplitting: false
  # Has to be set to `true` in order to use the core NATS (non-JetStream) pub/sub
  # queue splitting feature. Best-effort delivery: nothing is persisted.
  natsPubsubSplitting: false
  # Temporal queue splitting proxy settings.
  temporalProxy:
    # Port for the Temporal frontend proxy workers connect to via `TEMPORAL_ADDRESS`.
    port: 7233
  # Has to be set to `true` in order to use the argocd application auto-sync pause feature.
  applicationPauseAutoSync: false

  # Has to be set to `true` in order to use the suspend flux controllers feature.
  suspendFluxControllers: false
  # Has to be set to `true` in order to let the operator pause KEDA scale-in.
  pauseKedaScaleIn: false
  # Has to be set to `true` in order to use the MySQL database branching feature.
  mysqlBranching: false
  # Has to be set to `true` in order to use the MariaDB database branching feature.
  mariadbBranching: false
  # Has to be set to `true` in order to use the PostgreSQL database branching feature.
  pgBranching: false
  # Has to be set to `true` in order to use the MongoDB database branching feature.
  mongodbBranching: false
  # Has to be set to `true` in order to use the DynamoDB database branching feature.
  dynamodbBranching: false
  # Has to be set to `true` in order to use the MSSQL database branching feature.
  mssqlBranching: false
  # Has to be set to `true` in order to use the Redis database branching feature.
  redisBranching: false
  # Has to be set to `true` in order to use the Google Cloud Spanner database branching feature.
  spannerBranching: false
  # Has to be set to `true` in order to use the ClickHouse database branching feature.
  clickhouseBranching: false
  # Has to be set to `true` in order to use the CockroachDB database branching feature.
  cockroachdbBranching: false
  # Has to be set to `true` in order to use the generic (user-supplied image) database
  # branching feature. NOTE: enabling this lets users who can create branches run arbitrary
  # container images as branch pods (under the namespace default service account). Restrict
  # the images with `genericBranchConfig.dbPod.allowedImages` if needed; when that field is
  # absent, all images are allowed.
  genericBranching: false
  # Has to be set to `true` in order to use the S3 bucket branching feature. The operator
  # clones buckets in the customer's cloud account with its own AWS credentials (from the
  # service account's IAM role annotation); there is no branch pod and no `s3BranchConfig`.
  s3Branching: false
  # Has to be set to `true` in order to use the turbopuffer namespace branching feature. The
  # operator branches namespaces through turbopuffer's API with the API key it reads off the
  # target workload; there is no branch pod and no `turbopufferBranchConfig`.
  turbopufferBranching: false
  # Settings for the turbopuffer namespace branching feature.
  turbopufferOptions:
    # Domains a turbopuffer branch may send its API key to, on top of `turbopuffer.com`, which
    # is always allowed. Set this only for a dedicated cluster served from another domain: a
    # branch names its own endpoint, so anything listed here is a host the operator will hand
    # the resolved API key to.
    allowedHosts: []
  # Grants cluster-wide Secret permissions needed when users pass literal
  # database credentials in the mirrord config instead of referencing
  # existing K8s Secrets.
  dbBranchingLiteralCredentials: true
  # Enables the preview environments feature. Set to `false` to leave out the PreviewSession CRD
  # and the operator permissions that preview environments need.
  previewEnv: true
  # Records which Services mirrord sessions talk to, for the cluster topology view in the
  # dashboard. Makes the operator watch every Service and EndpointSlice in the cluster, and
  # grants it read access to EndpointSlices.
  topology: false

  # Sharing preview environments via a plain link. Requires `previewEnv: true` and the
  # `mirrord-share-ingress` chart deployed with a matching `shareDomain`.
  shareIngress:
    # Domain that preview share hosts are minted under, as `<slug>.<shareDomain>`, entered without
    # a leading "*." wildcard. When empty, no share host is minted and previews are not shareable by link.
    shareDomain: ""
    # Mint share hosts without the random suffix, as `<sanitized key>.<shareDomain>` (the key
    # lowercased, other characters turned into "-"), so a link can be built from the session key
    # alone - for example by a PR bot from the PR number. One live session per host on the
    # cluster: a second session whose key gives the same host fails at creation, naming the
    # session that holds it. Sessions that already have a host keep it. The links become
    # guessable, so only enable this when the ingress in front of `mirrord-share-ingress`
    # authenticates every request.
    stableSlugs: false

  preview:
    # Annotations added to the pods created by preview environments.
    annotations: {}

    # Labels added to the pods created by preview environments.
    labels: {}

    # How long to retain "failed" preview sessions before deleting them.
    #
    # Note that this option controls the time that the session's _internal custom resource_ remains in the cluster, so
    # that it's visible to the `mirrord preview` family of commands for inspection. The workload itself is deleted as
    # soon as failure is detected.
    #
    # "Failed" in this case means an operator-side error, such as failing to create the necessary kubernetes resources,
    # failing to create DB branches, etc.
    #
    # Application-side failures such as crashes and evictions are handled automatically by kubernetes through pod
    # restarts and the underlying Deployment, this configuration doesn't change that.
    cleanupAfterMins: 15

    # Bounds on the traffic an idle or waking preview session buffers while its pods boot.
    #
    # Sessions with idle mode enabled hold incoming traffic instead of failing it while their pods scale up from zero.
    # These cap that buffer (per session): when either limit is reached the buffer is flushed and the held requests
    # fail with 502 instead. `idleHoldBufferMessages` counts mirrord protocol frames (a whole HTTP request, one body
    # chunk of a streamed request, or one data segment of a plain TCP connection — not necessarily one HTTP request);
    # `idleHoldBufferBytes` bounds the actual payload memory, since a single frame can carry a large body.
    idleHoldBufferMessages: 512
    idleHoldBufferBytes: 8388608

    # The pull policy to use for preview environment's images.
    # imagePullPolicy: "Always"

  # dbBranching:
  #   # Size of the init volume that stages the copy. On emptyDir
  #   # (`dbPod.storage.kind: emptyDir`, or the automatic fallback on clusters without a
  #   # default StorageClass) this is the size limit; on the default PVC backing it sizes
  #   # the claim, unless `initPvcSize` below is also set.
  #   initPodVolumeLimit: "100Mi"
  #   # Size of the volume holding the actual branch database. Same scope as above
  #   # (`databasePvcSize` wins on the PVC path).
  #   databasePodVolumeLimit: "1G"
  #   # Requested size of the per-branch data PVC (the default storage backing).
  #   # Provisioned per branch and deleted with it. Defaults to `databasePodVolumeLimit`
  #   # if set, else 20Gi.
  #   databasePvcSize: "20Gi"
  #   # Requested size of the per-branch init (dump) PVC. The staged dump is roughly the
  #   # size of the copied data. Defaults to `initPodVolumeLimit` if set, else 20Gi.
  #   initPvcSize: "20Gi"
  # When set to `true`, the operator will use a custom strategy when restarting target workloads.
  # This strategy can be used if standard restart procedure is not working for the target workload.
  isolatePodsRestart: true
  # Enable prometheus metrics endpoint
  metrics: false

  # When enabled, operator will inject a `mirrord-key` header with the
  # value of the current session key into redirected HTTP requests,
  # responses to said requests, and the queue-splitting messages routed to
  # a session. For queues it uses a native metadata field where the broker
  # has one (SQS, Google Pub/Sub, RabbitMQ, Kafka, Azure Service Bus, NATS,
  # and Temporal activity tasks), otherwise the JSON payload (BullMQ, Redis
  # Pub/Sub); non-JSON payloads are left untouched.
  injectSessionKeyHeader: true

  # Depth of the single, global `mirrord subscribe` event buffer (shared across all sessions).
  # If a subscriber lags by more than this many events, the oldest are dropped and it is sent a
  # "lagged" notice. Raise for bursty, slow-consumer cases.
  subscribeEventBufferSize: 2048

  # Multi-cluster configuration (Envoy)
  # Enable this on the PRIMARY cluster only
  #
  # ## How it works
  #
  # Clusters are discovered from Secrets with label `operator.metalbear.co/remote-cluster-credentials=true`.
  # Each Secret contains credentials for a remote cluster:
  #   - name: Logical cluster name (e.g., "staging-us-east")
  #   - server: Kubernetes API server URL
  #   - caData: CA certificate (base64 encoded)
  #   - bearerToken: ServiceAccount token
  #   - isDefault: "true" for the default cluster (stateful operations)
  #
  # Tokens are auto-refreshed using the TokenRequest API every 45 minutes.
  #
  # ## Setup
  #
  # 1. Create a ServiceAccount on each remote cluster (see remoteClusterSetup below)
  # 2. Get the token and CA from each remote cluster
  # 3. Create a Secret on the primary cluster for each remote cluster
  # 4. Enable multiCluster.enabled = true on the primary cluster
  #
  multiCluster:
    # Set to true to enable multi-cluster session orchestration and make this operator
    # the primary one.
    enabled: false

    # CLUSTER NAME: Name of this cluster (optional, defaults to "primary")
    # Used for logging and session tracking
    # clusterName: "primary"

    # DEFAULT CLUSTER: Where stateful operations happen (REQUIRED when multi-cluster enabled)
    # - DB branches are created here
    # - File operations read/write from here
    # - Outgoing traffic originates from here
    # Must match the `name` of one of your cluster Secrets
    defaultCluster: ""

    # Whether the primary cluster is management-only (no workloads)
    # When true: Primary only runs Envoy, all sessions go to remote clusters
    # When false: Primary is also a workload cluster
    managementOnly: true

    # These three are commented out on purpose. `remoteSessionTimeoutSeconds` and
    # `sessionTtlSeconds` replace `remoteSessionTimeoutSecs` and `sessionTtlSecs`, and both
    # spellings are honored. Shipping a value here would make the new name always set, so a values
    # file still using the old name would be ignored on upgrade. The defaults below live in the
    # ConfigMap template instead.

    # Timeout for waiting for remote sessions to become ready (seconds). Defaults to 300.
    # remoteSessionTimeoutSeconds: 300

    # TTL for multi-cluster sessions (seconds). Defaults to 60.
    # Sessions are deleted when no client has been connected for this duration.
    # Only applies once a client has connected; until then sessionSetupDeadlineSeconds applies.
    # sessionTtlSeconds: 60

    # How long a multi-cluster session may wait for its first client connection (seconds).
    # Defaults to 180.
    # Sessions are created on every cluster before any client connects, and setting them up can
    # take a while when queue splitting waits for target pods to roll. Deleting a session also
    # deletes its child sessions on every cluster, so this must outlast setup.
    # sessionSetupDeadlineSeconds: 180

    # Preview environment behavior across the fleet.
    preview:
      # Where a preview's pods run.
      #
      #   default-cluster (default) - pods on the DEFAULT cluster only
      #   replicas                  - a full replica on EVERY workload cluster: own pods,
      #                               own local HTTP steal, own local queue split
      #
      # Queue-splitting previews apply their splits on every cluster in BOTH modes - so
      # matched messages from anywhere keep reaching the preview either way; the modes only
      # differ in where pods run.
      #
      # Use `replicas` when:
      #   - previews must catch baggage-tagged HTTP arriving through your load balancer,
      #     which can land on ANY cluster - with default-cluster, matched requests landing
      #     on other clusters are served by the deployed app instead of the preview
      #   - previews should survive a cluster outage (the LB fails over onto replicas
      #     that already exist and are already serving)
      # Stay on `default-cluster` when:
      #   - previews are exercised via their share link or requests you steer yourself -
      #     that traffic enters one cluster anyway, so extra replicas would sit unused
      #   - queue splitting is the main feature (its coverage is identical either way)
      #   - you want the smallest footprint: one pod, no DB tunnel
      mode: default-cluster

      # Max concurrent branch-DB connections one workload cluster's replicas may hold open
      # through the branch tunnel. Only applies with `mode: replicas` AND database branching:
      # replicas on non-default clusters reach branch DBs over the tunnel, and each live
      # connection holds one stream plus one port-forward on the default cluster's apiserver.
      #
      # This caps CONNECTIONS, never previews or branches. Size it as
      #   concurrently running branching previews x their app's DB pool size
      # (an idle preview holds none - its pods, and so its connections, are gone). Excess
      # opens are rejected and surface as DB connect failures the drivers retry.
      #
      # The default suits roughly 25-50 concurrently connected replicas per cluster with
      # typical pool sizes. Raising it trades more concurrent port-forwards on the default
      # cluster's apiserver.
      maxTunnelStreams: 256

    # Remote cluster configuration
    #
    # Each cluster requires `authType` to specify how it authenticates:
    #
    #   authType: eks — AWS IAM authentication for EKS clusters
    #       → Tokens generated locally using the operator's IAM role (IRSA/Pod Identity)
    #       → Auto-refreshed every 10 min (15-min token lifetime)
    #       → No secrets to manage — safe to commit to Git
    #       → Requires `region` field and EKS Access Entry on each remote cluster
    #       → The cluster key name must match the EKS cluster name
    #
    #   authType: bearerToken — ServiceAccount token
    #       → Auto-refreshed via TokenRequest API
    #       → No manual rotation needed
    #
    #   authType: mtls — mTLS client certificate auth
    #       → NOT auto-refreshed (certs typically valid for months/years)
    #       → You must manually rotate before expiry
    #
    # Example with EKS IAM auth (cluster key = EKS cluster name):
    # clusters:
    #   my-eks-cluster:                    # ← must match the EKS cluster name
    #     authType: eks
    #     server: https://ABCDEF.gr7.us-east-1.eks.amazonaws.com
    #     region: us-east-1
    #     # caData is optional for EKS — EKS uses Amazon-signed certs trusted by default.
    #     # caData: LS0tLS1CRUdJTi...
    #     isDefault: true
    #
    # EKS IAM setup on each remote cluster:
    #   1. Install mirrord operator on the remote cluster with:
    #          --set operator.multiClusterMember=true \
    #          --set operator.multiClusterMemberIamGroup=mirrord-operator-envoy
    #      This creates both the ClusterRole and ClusterRoleBinding for the IAM group.
    #   2. Create EKS Access Entry:
    #      Via AWS Console:
    #        EKS → select remote cluster → Access tab → Create access entry
    #        → IAM principal: select the IAM role from sa.roleArn → Type: Standard
    #        → Groups: mirrord-operator-envoy → Next → skip access policies → Create
    #      Via AWS CLI:
    #        aws eks create-access-entry --cluster-name <EKS_CLUSTER> \
    #          --principal-arn <sa.roleArn value> \
    #          --type STANDARD --kubernetes-groups mirrord-operator-envoy
    #
    # Example with AKS Workload Identity auth:
    # clusters:
    #   remote-aks:
    #     authType: aks
    #     server: https://remote-aks-xxxxx.hcp.eastus.azmk8s.io:443
    #     # caData is required for AKS (each cluster has its own self-signed CA).
    #     # Get it from: az aks get-credentials --name <cluster> -g <rg> --file /dev/stdout | grep certificate-authority-data
    #     caData: LS0tLS1CRUdJTi...
    #     # tenantId and clientId are optional -- defaults to env vars injected by webhook
    #     # tenantId: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    #     # clientId: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    #
    # AKS` Workload Identity setup:
    #   1. Create a User-Assigned Managed Identity in Azure
    #   2. Create a Federated Identity Credential linking the operator's SA to the identity:
    #        az identity federated-credential create \
    #          --name mirrord-operator-federation \
    #          --identity-name <managed-identity-name> \
    #          --resource-group <rg> \
    #          --issuer $(az AKS show -n <primary-cluster> -g <rg> --query oidcIssuerProfile.issuerUrl -o tsv) \
    #          --subject "system:serviceaccount:mirrord:mirrord-operator" \
    #          --audiences "api://AzureADTokenExchange"
    #   3. Grant the identity access on each remote AKS cluster (Azure RBAC or K8s RBAC)
    #   4. Set sa.azureClientId to the Managed Identity's client ID
    #   5. Install mirrord on each remote cluster with:
    #          --set operator.multiClusterMember=true \
    #          --set operator.multiClusterMemberAzureGroup=mirrord-operator-envoy
    #
    # Example with bearer token:
    # clusters:
    #   staging-us-east:
    #     authType: bearerToken
    #     server: https://staging-us-east.example.com:6443
    #     caData: LS0tLS1CRUdJTi...  # base64 encoded CA cert
    #     isDefault: true
    #     bearerToken: eyJhbGci...   # initial token (will be auto-refreshed)
    #
    # Example with mTLS:
    # clusters:
    #   secure-cluster:
    #     authType: mtls
    #     server: https://secure.example.com:6443
    #     caData: LS0tLS1CRUdJTi...  # CA cert
    #     tlsCrt: LS0tLS1CRUdJ...    # client cert PEM
    #     tlsKey: LS0tLS1CRUdJ...    # client private key PEM
    clusters: {}

  # Set to `true` if installing the mirrord-operator on a cluster that is part of a connected
  # multi-cluster setup, and this one is not the primary.
  multiClusterMember: false

  # When using IAM auth for multi-cluster, set this to the Kubernetes group name
  # used in the EKS Access Entry. This creates a ClusterRoleBinding that grants
  # the IAM group the same permissions as the ServiceAccount-based setup.
  # Only used when multiClusterMember is true.
  # multiClusterMemberIamGroup: "mirrord-operator-envoy"

  # When using AKS Workload Identity for multi-cluster, set this to the Azure AD
  # group or object ID used for the ClusterRoleBinding on each remote AKS cluster.
  # This creates a ClusterRoleBinding that grants the Azure identity the same
  # permissions as the ServiceAccount-based setup.
  # Only used when multiClusterMember is true.
  # multiClusterMemberAzureGroup: "mirrord-operator-envoy"

  # imagePullSecrets:
  #   - name: value

  ## stop using container args for agent config, as now you can just use agent.extraConfig
  ## also imagePullSecrets is re-used from operator.imagePullSecrets
  # containerArgs:
  #   - '--agent-config'
  #   - '{"image_pull_secrets":[{"name":"docker"}]}'

  ## You can use this only if using Enterprise license.
  disableTelemetries: false

  # Sets log level for the logs printed to `stdout` by the operator container.
  #
  # See reference: https://docs.rs/tracing-subscriber/latest/tracing_subscriber/filter/struct.EnvFilter.html#directives.
  logLevel: mirrord=info,operator=info,kube_runtime=warn

  ## Sets the verbosity of everything the operator exports over OTel: the logs sent to
  ## `otelLogExportUrl` and the traces sent to `otelTraceExportUrl`. Defaults to `info`.
  ## This is independent of the logs printed to `stdout` (controlled by `logLevel`).
  ##
  ## See reference: https://docs.rs/tracing-subscriber/latest/tracing_subscriber/filter/struct.EnvFilter.html#directives.
  # otelLogLevel: mirrord=info

  ## The URL for OTel logs to be exported to in the cluster. If unset, logs will not be exported.
  ## This is independent of the logs printed to `stdout` (controlled by `logLevel`).
  ## This value may reference values in `operator.extraEnv`, as it appears later in the manifest.
  # otelLogExportUrl: https://loki:3100/loki/app/v1/push

  ## The URL for OTel traces to be exported to in the cluster. If unset, traces will not be exported.
  ## This value may reference values in `operator.extraEnv`, as it appears later in the manifest.
  # otelTraceExportUrl: https://tempo:4318/v1/traces

  ## Controls how long (in seconds) a session is allowed to live for.
  # maxSessionTimeSeconds: 3600

  ## Controls how long (in seconds) a session that a client has already connected to may go
  ## unused before it is closed. Defaults to 30 seconds.
  ## Raise this when clients are disconnected by slow or unreliable networks. The cost is that
  ## agents and patched workloads are held longer after a client really does go away.
  # sessionUnusedTtlSeconds: 30

  ## Controls how long (in seconds) a session may wait for its first client connection before it
  ## is closed. Defaults to 180 seconds.
  ## Raise this when setting up a session takes longer than the default, for example when queue
  ## splitting waits for slow-rolling target pods, or when multi-cluster sessions are created
  ## well before a client reaches each cluster.
  # sessionSetupDeadlineSeconds: 180

  ## Controls how long (in milliseconds) either side of a connected session - the client and the
  ## agent - may go without sending a message before the session is closed. The two are timed
  ## separately, so this is the budget per side, not a combined one. Defaults to 60000 (60 seconds).
  ## Raise this when developers work over slow or unreliable networks, where a laptop sleeping or
  ## changing network costs them a running session. The cost is that agents and patched workloads
  ## are held longer after a client really does go away.
  # communicationTimeoutMillis: 60000

  ## Controls how long (in milliseconds) a session can live when there are no pods ready to be targeted.
  ## When this value is not set when installing the chart, the default value of 60000 (60 seconds) is used.
  # noPodTargetsSessionTimeoutMillis: 60000

  ## Default TTL (in milliseconds) for idle Kafka splits.
  ## For any given topic, starting the first Kafka splitting session requires patching the target workload.
  ## Similarly, stopping the last Kafka splitting session requires another patch, that reverts the first one.
  ## If the target workload takes a long time to restart, it may be desirable to keep the Kafka splits alive longer,
  ## so that the next Kafka splitting session will not have to patch the workload again.
  ##
  ## This value can be overridden per topic with the `spec.splitTtl` field in the `MirrordKafkaTopicsConsumer` custom resource.
  # idleKafkaSplitTtlMillis: 30000

  ##  You can adjust the format of the created kafka topic names to suit your needs. The default value is:
  ## `mirrord-tmp-{{RANDOM}}{{FALLBACK}}{{ORIGINAL_TOPIC}}`
  ## see docs here https://metalbear.co/mirrord/docs/using-mirrord/queue-splitting/#customizing-mirrord-created-kafka-topic-names
  # kafkaSplittingTopicFormat: "mirrord-tmp-{{RANDOM}}{{FALLBACK}}{{ORIGINAL_TOPIC}}"

  kafkaSplittingSidecar:
    # Enables a sidecar container responsible for Java Kafka clients.
    # This enables Kafka splitting with Kafka Streams consumers.
    enabled: false
    image: ghcr.io/metalbear-co/operator-kafka-proxy
    # Port for the sidecar to listen on.
    # The operator communicates with the sidecar through a REST API served on localhost.
    port: 33000
    # CPU and memory requests for the sidecar.
    # Set any of these, or the whole `requests` block, to `null` to leave it out of the pod spec.
    requests:
      cpu: 100m
      memory: 100Mi
    # CPU and memory limits for the sidecar.
    # Set any of these, or the whole `limits` block, to `null` to leave it out of the pod spec.
    limits:
      cpu: 200m
      memory: 200Mi

  # Linger timeout for legacy SQS splits (in milliseconds).
  # Applies only to old MirrordWorkloadQueueRegistry objects: once their last SQS
  # session ends, the split lingers, keeping the target patched to read from the
  # temporary queue until that queue is empty. This caps how long it lingers.
  # With MirrordSplitConfig, set spec.drainTimeout on the config instead.
  sqsSplittingLingerTimeout: 60000

  ## Control whether the operator waits for patched pods to become ready when starting Kafka/SQS splitting sessions.
  ## This option defaults to true (maintaining existing behavior) but can be set to false to speed up
  ## session start time in environments where pod readiness waiting is not necessary or causes delays due to cluster conditions.
  queueSplittingWaitForReadyTarget: true

  ## CPU and memory requests and limits for the operator container.
  ## These defaults should be enough for around 200~ concurrent sessions.
  ##
  ## Every quantity is optional. Set one to `null` (`operator.limits.cpu: null`), or a whole block to
  ## `null` (`operator.limits: null`), and it is left out of the pod spec entirely - for clusters
  ## that set container resources themselves through a LimitRange or a VPA, or that run the operator
  ## without a CPU limit so it is never throttled.
  requests:
    cpu: 100m
    memory: 100Mi

  limits:
    cpu: 500m
    memory: 200Mi

  ## Allow to specify tolerations for operator deployment
  # tolerations:
  #   - key: "key1"
  #     operator: "Equal"
  #     value: "value1"
  #     effect: "NoSchedule"

  # affinity:
  #   podAntiAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       - topologyKey: kubernetes.io/hostname
  #         labelSelector:
  #           matchLabels:
  #             k8s-app: mirrord

  # nodeSelector:
  #   kubernetes.io/os: linux

  # Port for operator to listen on. If you can't listen on 443 due to privilege issues
  # you can change this to 3000/8443 or whatever you want - just make sure that nodes
  # can communicate on that port if it doesn't work then.
  # The operator binds the kube API on IPv6 (`[::]`) by default, with an IPv4
  # (`0.0.0.0`) fallback on the same port — set `OPERATOR_ADDR` /
  # `OPERATOR_FALLBACK_ADDR` directly if you need to override either side.
  port: 443

  copyTarget:
    # by default, the operator will create a dummy container using the agent image
    # as it is guaranteed to have a sleep binary. If you want the operator
    # to use the target's image, set this value to false and make sure it has sleep binary
    useAgentImage: true

  ## The URL of the Jira webhook to enable integration with the mirrord for Jira app.
  ## If this is set, the operator will attempt to send session duration metrics to the Jira app
  ## every time a user session ends.
  # jiraWebhookUrl: "https://example.atlassian-dev.net/x1/random-hash"

