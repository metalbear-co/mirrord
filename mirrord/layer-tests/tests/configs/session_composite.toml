key = 'dev.[A]+'
share = true
[feature.network.incoming]
mode = "steal"
ports = [23456]
port_mapping = [[54321, 23456]]
[feature.network.incoming.http_filter]
ports = [23456]
all_of = [
    { path = "^/custom$" },
    { body = "json", query = "$.selected", matches = "^true$" },
    { query = 'contains("x-team: local")' },
]
