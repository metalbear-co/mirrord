[package]
name = "mirrord-tests"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
k8s-openapi.workspace = true
kube.workspace = true
mirrord-command = { path = "../mirrord/command", features = ["tokio"] }
reqwest.workspace = true
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "macros",
    "process",
] }
serde_json.workspace = true
mirrord-operator = { path = "../mirrord/operator", features = ["crd"] }
serde.workspace = true
futures.workspace = true
rand.workspace = true
fancy-regex.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
rustls.workspace = true
rstest.workspace = true
mirrord-kube = { path = "../mirrord/kube" }

futures-util.workspace = true
chrono.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true

mirrord-test-utils = { path = "../mirrord/test-utils" }

[features]
default = ["ephemeral", "job", "cli", "targetless"]
ephemeral = []
job = []
operator = []
cli = []
targetless = []
# Tests that need a single-stack IPv6 cluster (see CONTRIBUTING.md). Not in default
# features, so they are ignored unless the cluster is actually IPv6.
ipv6 = []
