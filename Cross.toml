[build.env]
passthrough = ["MIRRORD_LAYER_FILE"]
# Dockerfile used for building mirrord-layer for x64 with very old libc
# this to support centos7 or Amazon Linux 2.
[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/metalbear-co/ci-layer-build:a15f775caaf65c1d08224d51dc51500f826a7405"

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"
