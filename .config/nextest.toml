[profile.default]
retries = 2
slow-timeout = { period = "1m", terminate-after = 3 }
failure-output = "immediate-final"
final-status-level = "fail"
# The `operator_install` tests install the cluster-wide operator, which the sessions of all other
# e2e tests would use. So only the `operator-install` profile runs them.
#
# The `traffic::ipv6` tests need an IPv6-only cluster, so only the `ipv6` profile runs them.
default-filter = "not (package(mirrord-tests) & (test(/^operator_install::/) | test(/^traffic::ipv6::/)))"

[[profile.default.overrides]]
filter = "package(mirrord-tests)"
slow-timeout = { period = "2m", terminate-after = 3 }

[profile.default.junit]
path = "junit.xml"

# `.github/scripts/flaky-issue.sh` picks the end-to-end target of a test by the filters of the
# profiles below, so it needs the same change as they do.
[profile.operator-install]
default-filter = "package(mirrord-tests) & test(/^operator_install::/)"
# Each test installs the cluster-wide operator, so they must not run at the same time.
test-threads = 1

[profile.ipv6]
default-filter = "package(mirrord-tests) & test(/^traffic::ipv6::/)"
test-threads = 1

# The end-to-end targets that pass a `--profile` ignore this profile, because the `--profile`
# overrides `NEXTEST_PROFILE`.
[profile.ci]
# Makes one CI run report every failing test.
fail-fast = false
