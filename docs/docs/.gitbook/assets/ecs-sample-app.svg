<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="1160" height="520" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The ECS sample app with MetalBear Cloud</title>
  <desc id="d">A client sends HTTP requests to a public load balancer in an AWS VPC, which sends them to the ECS task. The task runs the orders app and the mirrord agent, which the mirrord remote bootstrap starts in the app container. The orders app in the task serves requests without the session header. The agent sends requests with your session header to the MetalBear sessions-manager, which forwards them to the orders app that runs on your machine under mirrord up. The task and your machine both connect out to the sessions-manager over HTTPS. The task connects to the private RDS database, for its own app and for your local process.</desc>
