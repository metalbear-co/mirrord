<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2 1200 542" width="1200" height="542" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Multi-cluster architecture</title>
  <desc id="d">On your laptop, the mirrord CLI and your local application use one connection to the mirrord operator on the Primary cluster. The Primary operator coordinates all clusters and holds the parent session. It can also run workloads, or be management-only. The Primary creates a child session on workload cluster A and on workload cluster B. Each workload cluster has its own operator, an agent, and your pods for the child session. Workload cluster B is also the Default cluster. Traffic intercepted in any cluster flows back through the Primary to your local application. Stateful operations, such as environment variables, files, DNS, outgoing traffic, and DB branching, are served by the Default cluster only.</desc>
