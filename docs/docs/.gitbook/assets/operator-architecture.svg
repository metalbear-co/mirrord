<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 676" width="1200" height="676" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">mirrord for Teams architecture</title>
  <desc id="d">Two developers run local processes with mirrord on their laptops. Each local process connects to the mirrord Operator in the Kubernetes cluster. The Operator sends incoming traffic to each local process, and each local process sends outgoing traffic, database access, and file reads and writes to the Operator. The Operator connects to the mirrord agents of the target pods. Each agent runs as a separate pod in the network namespace of its target pod. Internet traffic and traffic from other services reach the target pods. The agents send outgoing traffic to other services and database access to the database.</desc>
