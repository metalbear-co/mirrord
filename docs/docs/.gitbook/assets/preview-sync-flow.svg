<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" width="1100" height="570" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">What happens after a sync</title>
  <desc id="d">A sync lands in the preview pod. If a triggered_by file changed, or on the first start, or after a failed prepare, the pod runs sync.prepare.command. When prepare succeeds, the app restarts. When prepare fails on the first start, the app doesn't start and mirrord preview sync fails; when it fails later, the app keeps running. Otherwise, sync.run.restart decides: with on_sync the app restarts, and with on_prepare there is no restart, so a dev server reloads the files.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#232141"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="570" fill="#ffffff"/>
  <!-- Start: a sync reaches the preview pod -->
  <rect x="400" y="20" width="300" height="56" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="550" y="54" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">A sync lands in the pod</text>
  <polyline points="550,76 550,116" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- First question: does prepare run? -->
  <rect x="320" y="120" width="460" height="92" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="550" y="150" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Did a <tspan font-family="Menlo, Consolas, monospace">triggered_by</tspan> file change?</text>
  <text x="550" y="174" font-size="12.5" fill="#333344" text-anchor="middle">Also yes on the first start,</text>
  <text x="550" y="192" font-size="12.5" fill="#333344" text-anchor="middle">and after a failed prepare</text>
  <polyline points="550,212 550,236 250,236" fill="none" stroke="#232141" stroke-width="2.5"/>
  <polyline points="550,236 850,236" fill="none" stroke="#232141" stroke-width="2.5"/>
  <polyline points="250,236 250,280" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polyline points="850,236 850,280" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="262" y="262" font-size="12.5" fill="#333344" text-anchor="start">yes</text>
  <text x="862" y="262" font-size="12.5" fill="#333344" text-anchor="start">no</text>
  <!-- Yes: run prepare -->
  <rect x="100" y="284" width="300" height="70" rx="12" fill="#FFCB7D" stroke="#232141" stroke-width="2"/>
  <text x="250" y="312" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Run prepare</text>
  <text x="250" y="334" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">sync.prepare.command</text>
  <!-- No: the restart setting decides -->
  <rect x="700" y="284" width="300" height="70" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="850" y="312" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">Restart the app?</text>
  <text x="850" y="334" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="middle">sync.run.restart</text>
  <polyline points="250,354 250,380 130,380" fill="none" stroke="#232141" stroke-width="2.5"/>
  <polyline points="250,380 370,380" fill="none" stroke="#232141" stroke-width="2.5"/>
  <polyline points="130,380 130,424" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polyline points="370,380 370,424" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="142" y="406" font-size="12.5" fill="#333344" text-anchor="start">succeeds</text>
  <text x="382" y="406" font-size="12.5" fill="#333344" text-anchor="start">fails</text>
  <polyline points="850,354 850,380 730,380" fill="none" stroke="#232141" stroke-width="2.5"/>
  <polyline points="850,380 970,380" fill="none" stroke="#232141" stroke-width="2.5"/>
  <polyline points="730,380 730,424" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polyline points="970,380 970,424" fill="none" stroke="#232141" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="742" y="406" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="start">on_sync</text>
  <text x="982" y="406" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#333344" text-anchor="start">on_prepare</text>
  <!-- Results -->
  <rect x="30" y="428" width="200" height="70" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="130" y="468" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">The app restarts</text>
  <rect x="250" y="428" width="240" height="124" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="370" y="452" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">First start</text>
  <text x="370" y="472" font-size="12.5" fill="#333344" text-anchor="middle">The app doesn't start, and</text>
  <text x="370" y="490" font-size="12.5" fill="#333344" text-anchor="middle">mirrord preview sync fails.</text>
  <text x="370" y="516" font-size="14" font-weight="700" fill="#232141" text-anchor="middle">Later</text>
  <text x="370" y="536" font-size="12.5" fill="#333344" text-anchor="middle">The app keeps running.</text>
  <rect x="630" y="428" width="200" height="70" rx="12" fill="#E4E3FD" stroke="#232141" stroke-width="2"/>
  <text x="730" y="468" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">The app restarts</text>
  <rect x="860" y="428" width="220" height="70" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="970" y="458" font-size="16" font-weight="700" fill="#232141" text-anchor="middle">No restart</text>
  <text x="970" y="480" font-size="12.5" fill="#333344" text-anchor="middle">a dev server reloads the files</text>
</svg>
