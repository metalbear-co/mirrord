<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Two Kafka splitting sessions</title>
  <desc id="d">A producer sends messages to a Kafka topic in the Kafka cluster. The mirrord operator consumes these messages. It sends messages that match filter x to a temporary topic for the first local application, and messages that match filter y to a temporary topic for the second local application. Both local applications run with mirrord on laptops. It sends messages that do not match any filter to a temporary topic for the deployed application. Each application consumes messages from its own temporary topic. A message that matches both filters goes to only one of the two sessions.</desc>
