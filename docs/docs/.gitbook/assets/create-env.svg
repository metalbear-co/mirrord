<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -45 1200 713" width="1200" height="713" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Preview environment creation workflow</title>
  <desc id="d">Step 1: on your laptop, you run mirrord preview start with a container image from a registry, a mirrord.json file, and an optional env key. Step 2: mirrord.json steals incoming traffic with a header filter, and mirrord replaces {{ key }} in every filter with the env key. The CLI prints the env key and the preview session. Step 3: in the staging cluster, a temporary cars-service preview pod starts with your image and lives until its TTL expires. Requests to cars-service that match the env key filter go to the preview pod.</desc>
