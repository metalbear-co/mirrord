<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The traditional dev loop</title>
  <desc id="d">The traditional dev loop: code and test locally on a laptop, then deploy to staging and test on staging in the cloud. When tests fail on staging, the loop goes back to code. When the code works on staging, it goes to deploy to production.</desc>
  <defs>
    <marker id="ring-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#756DF3"/>
    </marker>
    <symbol id="cloud" viewBox="0 0 48 32">
      <path d="M13 30 H37 A9 9 0 0 0 38 12 A13 13 0 0 0 13 10 A10 10 0 0 0 13 30 Z" fill="#ffffff" stroke="#232141" stroke-width="2.5" stroke-linejoin="round"/>
    </symbol>
    <symbol id="code" viewBox="0 0 48 32">
      <rect x="6" y="2" width="36" height="22" rx="3" fill="#ffffff" stroke="#232141" stroke-width="2.5"/>
      <path d="M1 28 H47 L44 31 H4 Z" fill="#232141" stroke="#232141" stroke-width="2" stroke-linejoin="round"/>
      <path d="M19 9 L15 13 L19 17 M29 9 L33 13 L29 17" fill="none" stroke="#756DF3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>
  <path d="M198.9 199.3 A190 190 0 0 0 198.9 400.7" fill="none" stroke="#756DF3" stroke-width="7" stroke-linecap="round" marker-end="url(#ring-arrow)"/>
  <path d="M259.3 461.1 A190 190 0 0 0 460.7 461.1" fill="none" stroke="#756DF3" stroke-width="7" stroke-linecap="round" marker-end="url(#ring-arrow)"/>
  <path d="M521.1 400.7 A190 190 0 0 0 521.1 199.3" fill="none" stroke="#756DF3" stroke-width="7" stroke-linecap="round" marker-end="url(#ring-arrow)"/>
  <path d="M460.7 138.9 A190 190 0 0 0 259.3 138.9" fill="none" stroke="#756DF3" stroke-width="7" stroke-linecap="round" marker-end="url(#ring-arrow)"/>
  <path d="M518.4 141.6 C 548.4 71.6 610 77 686 77" fill="none" stroke="#756DF3" stroke-width="7" stroke-linecap="round" marker-end="url(#ring-arrow)"/>
  <text x="360" y="76" font-size="13" fill="#333344" text-anchor="middle">tests fail: fix and repeat</text>
  <rect x="700" y="40" width="270" height="74" rx="12" fill="#FFCB7D" stroke="#232141" stroke-width="2"/>
  <use href="#cloud" x="718" y="61" width="48" height="32"/>
  <text x="776" y="83" font-size="17" font-weight="700" fill="#232141">Deploy to production</text>
  <circle cx="225.6" cy="165.6" r="40" fill="#ffffff" stroke="#232141" stroke-width="2.5"/>
  <use href="#code" x="199.6" y="147.6" width="52" height="35"/>
  <rect x="99.2" y="141.6" width="74" height="48" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="136.4" y="171.6" font-size="17" font-weight="700" fill="#232141" text-anchor="middle">Code</text>
  <circle cx="225.6" cy="434.4" r="40" fill="#ffffff" stroke="#232141" stroke-width="2.5"/>
  <use href="#code" x="199.6" y="416.4" width="52" height="35"/>
  <rect x="22.4" y="410.4" width="151" height="48" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="98.0" y="440.4" font-size="17" font-weight="700" fill="#232141" text-anchor="middle">Test locally</text>
  <circle cx="494.4" cy="434.4" r="40" fill="#ffffff" stroke="#232141" stroke-width="2.5"/>
  <use href="#cloud" x="468.4" y="416.4" width="52" height="35"/>
  <rect x="546.4" y="410.4" width="199" height="48" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="646.0" y="440.4" font-size="17" font-weight="700" fill="#232141" text-anchor="middle">Deploy to staging</text>
  <circle cx="494.4" cy="165.6" r="40" fill="#ffffff" stroke="#232141" stroke-width="2.5"/>
  <use href="#cloud" x="468.4" y="147.6" width="52" height="35"/>
  <rect x="546.4" y="141.6" width="180" height="48" rx="12" fill="#ffffff" stroke="#232141" stroke-width="2"/>
  <text x="636.4" y="171.6" font-size="17" font-weight="700" fill="#232141" text-anchor="middle">Test on staging</text>
</svg>
